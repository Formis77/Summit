<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--ink:#f6f4ee;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#dfe6e0;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;font-family:var(--serif)}
body{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
svg{display:block}
#sab{position:absolute;bottom:0;height:env(safe-area-inset-bottom);width:1px;pointer-events:none}
#menuBtn{position:absolute;left:calc(env(safe-area-inset-left) + 16px);top:calc(env(safe-area-inset-top) + 14px);width:44px;height:44px;z-index:4;opacity:.85}
.card{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);text-align:center;transition:opacity 1.1s ease;padding:0 24px calc(env(safe-area-inset-bottom) + 20px);text-shadow:0 1px 10px rgba(0,0,0,.18)}

.card h1{font-weight:400;font-size:clamp(30px,9.5vw,46px);letter-spacing:.16em;text-transform:uppercase;margin:0 0 6px;line-height:1.15}
.card .div{width:56px;height:1px;background:currentColor;opacity:.8;margin:18px auto 16px}
.card .lines{font-size:16px;letter-spacing:.24em;text-transform:uppercase;line-height:2;margin-bottom:22px}
.card .lines .small{font-size:12px;letter-spacing:.3em;opacity:.85}
.go{width:66px;height:66px;margin-top:46px}
#menu{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(20,24,24,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .4s}

#menu .chs button:disabled{opacity:.3}
#menu .chs button.cur{background:rgba(246,244,238,.22)}
</style>

<canvas id="c"></canvas>

<div id="menu" class="hide"><div class="panel">

</div></div>

<div id="card" class="card"><div class="veil" id="veil"></div><div id="cardBody"></div></div>

<script>
'use strict';
// =====================================================================
//  RESONANCE - a quiet isometric game about the voice of a singing bowl
// =====================================================================
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;

// ---------- notes & chakra colours ----------
const NOTES={B3:246.94,D4:293.66,E4:329.63,G4:392.00};
const NOTE_COL={B3:'#e0763a',D4:'#e5c13c',E4:'#5fb36b',G4:'#4aa3d8'};
const BOWL_F0=392.00;                                   // empty bowl sings G4
const bowlFreq=lv=>BOWL_F0*(1-0.4*Math.pow(lv,1.3));     // water lowers the pitch (full bowl ~ A#3)
const cents=(f,t)=>1200*Math.log2(f/t);

// ---------- chapters ----------
const LEVELS=[
  {chapter:'Chapter I',title:'The Listening Stone',lines:['in which','the bowl','finds its voice'],
   map:['5.46.45',
        '.1..1.2',
        '1101101',
        '11.1...',
        '.......'],
   stairs:[[6,2]],
   movers:[{id:'a',x:2,y:2,h:[0,1]},{id:'b',x:5,y:2,h:[0,1]}],
   stones:[{x:1,y:1,note:'G4',kind:'gate',opens:['a']},{x:4,y:1,note:'E4',kind:'gate',opens:['b']}],
   start:[0,3],goal:[6,1]},
  {chapter:'Chapter II',title:'Rising Water',lines:['in which','a held note','lifts the stone'],
   map:['..56.5.',
        '....4.4',
        '..44404',
        '.11....',
        '111....',
        '.......'],
   movers:[{id:'lift',x:2,y:3,h:[1,4],lift:true},{id:'br',x:5,y:2,h:[0,4]}],
   stones:[{x:1,y:3,note:'D4',kind:'lift',lift:'lift'},{x:4,y:1,note:'B3',kind:'gate',opens:['br']}],
   start:[0,4],goal:[6,1]},
  {chapter:'Chapter III',title:'Two Voices',lines:['in which','two stones','must sing together'],
   map:['4.5..64',
        '2.....2',
        '2222222',
        '...0...',
        '...2...',
        '...2...'],
   movers:[{id:'g',x:3,y:3,h:[0,2]}],
   stones:[{x:0,y:1,note:'E4',kind:'chord',group:'c',opens:['g']},{x:6,y:1,note:'B3',kind:'chord',group:'c',opens:['g']}],
   start:[1,2],goal:[3,5]},
];
const RANGE=2.5;          // how far a stone can hear the bowl (tiles)
const TOL=12;             // cents
const CHORD_RING=16;      // seconds a locked chord stone keeps singing

// ---------- palettes (one mood per chapter) ----------
const PAL=[
  {sky:['#dfe6e0','#b4bfb9'],fog:'#c9d2cc',top:'#bccb4b',edge:'#d6df7c',left:'#6f6479',right:'#aeaca6',rain:.22,sheet:'38,44,44'},
  {sky:['#f3dccb','#c99f9b'],fog:'#e6cbc0',top:'#cfc85c',edge:'#e8df8a',left:'#7b5a70',right:'#cfb5ab',rain:0,sheet:'60,40,46'},
  {sky:['#bfe0cb','#ece4c6'],fog:'#efe7cb',top:'#a9d23f',edge:'#c9ea6a',left:'#6a4c5d',right:'#93797f',rain:.16,sheet:'36,52,44'},
];
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixc=(a,b,t)=>{const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`;};
const shadeC=(a,f)=>{const A=hex(a);return `rgb(${A.map(v=>Math.round(Math.min(255,v*f))).join(',')})`;};
const rgba=(h,a)=>{const A=hex(h);return `rgba(${A[0]},${A[1]},${A[2]},${a})`;};
const hash=(x,y)=>{let h=x*374761393+y*668265263;h=(h^(h>>13))*1274126177;return ((h^(h>>16))>>>0)/4294967295;};

// ---------- save ----------
let save={unlocked:0,sound:true,guide:true};
try{const s=JSON.parse(localStorage.getItem('resonance')||'null');if(s)save=Object.assign(save,s);}catch(e){}
const persist=()=>{try{localStorage.setItem('resonance',JSON.stringify(save));}catch(e){}};

// ---------- canvas & projection ----------
const cv=$('c'),ctx=cv.getContext('2d');
let W,H,DPR,A,B,HU,ox,oy,oyBase,shiftY=0,bgCache=null,SAFE_B=0,FONT='Georgia,serif';
const P=(gx,gy,gz)=>[ox+(gx-gy)*A,oy+(gx+gy)*B-gz*HU];
function layout(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  SAFE_B=$('sab').getBoundingClientRect().height||0;FONT=getComputedStyle(document.body).fontFamily;
  bgCache=null;if(!G)return;
  let maxH=0,minH=99;
  for(let i=0;i<G.base.length;i++){const h=G.base[i];if(h>-50){maxH=Math.max(maxH,h);minH=Math.min(minH,h);}}
  G.movers.forEach(m=>{maxH=Math.max(maxH,...m.h);});
  const span=G.w+G.h;
  A=Math.min(W*0.86/span,(H*0.5)/(span*0.5774+(maxH-minH+1.5)*1.1547));B=A*0.5774;HU=A*1.1547;
  ox=0;oy=0;let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(let y=0;y<G.h;y++)for(let x=0;x<G.w;x++){const h=G.base[G.idx(x,y)];if(h<-50)continue;
    for(const [a,b] of [[x,y],[x+1,y],[x+1,y+1],[x,y+1]])for(const z of [h,minH-1]){const p=P(a,b,z);x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);}}
  ox=W/2-(x0+x1)/2;oyBase=H*0.5-(y0+y1)/2;oy=oyBase+shiftY;
}
addEventListener('resize',layout);

// ---------- level state ----------
let LI=0,G=null,disp=null,trav=null,won=null,levelT=0,ripples=[];
function parseLevel(L){
  const w=L.map[0].length,h=L.map.length;const base=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const c=L.map[y][x];base.push(c==='.'?-99:parseInt(c,36));}
  const idx=(x,y)=>y*w+x;
  const movers=new Map();L.movers.forEach(m=>movers.set(idx(m.x,m.y),Object.assign({open:false},m)));
  const stones=L.stones.map(s=>Object.assign({f:NOTES[s.note],col:NOTE_COL[s.note],progress:0,locked:false,ring:0,solved:false,glow:0,voice:null,c:999,inTune:false},s));
  const stoneAt=new Set(stones.map(s=>idx(s.x,s.y)));
  return {...L,w,h,base,idx,movers,stones,stoneAt,stairs:new Set((L.stairs||[]).map(([x,y])=>idx(x,y)))};
}
const moverById=id=>[...G.movers.values()].find(m=>m.id===id);
function loadLevel(i){
  if(G)G.stones.forEach(s=>stopStoneVoice(s));
  LI=i;G=parseLevel(LEVELS[i]);levelT=0;won=null;ripples=[];lastAnswer=null;
  disp=new Float32Array(G.w*G.h);
  for(let k=0;k<G.base.length;k++)disp[k]=G.base[k];
  G.movers.forEach((m,k)=>disp[k]=m.h[0]);
  trav={x:G.start[0],y:G.start[1],path:[],t:0,fx:G.start[0],fy:G.start[1],fz:disp[G.idx(G.start[0],G.start[1])],step:0};
  bowlState.level=0;bowlState.A=0;
  hintState={};
  document.querySelector('meta[name=theme-color]').content=pal().sky[0];document.body.style.background=pal().sky[0];
  layout();setAmbience();
}
const pal=()=>PAL[LI%PAL.length];
const dh=(x,y)=>(x<0||y<0||x>=G.w||y>=G.h)?-99:disp[G.idx(x,y)];
function walkable(x,y){if(x<0||y<0||x>=G.w||y>=G.h)return false;const i=G.idx(x,y);return disp[i]>-50&&!G.stoneAt.has(i);}
function canStep(ax,ay,bx,by){
  if(!walkable(bx,by))return false;const a=dh(ax,ay),b=dh(bx,by);
  if(Math.abs(a-b)<0.02)return true;
  return Math.abs(Math.abs(a-b)-1)<0.02&&(G.stairs.has(G.idx(ax,ay))||G.stairs.has(G.idx(bx,by)));
}
function findPath(tx,ty){
  const s=G.idx(trav.x,trav.y),t=G.idx(tx,ty);const prev=new Map([[s,-1]]);const q=[[trav.x,trav.y]];
  while(q.length){const [x,y]=q.shift();if(G.idx(x,y)===t)break;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;const k=G.idx(nx,ny);
      if(nx<0||ny<0||nx>=G.w||ny>=G.h||prev.has(k)||!canStep(x,y,nx,ny))continue;prev.set(k,G.idx(x,y));q.push([nx,ny]);}}
  if(!prev.has(t))return null;
  const path=[];let k=t;while(k!==s){path.push([k%G.w,Math.floor(k/G.w)]);k=prev.get(k);}return path.reverse();
}
const travBusy=()=>trav.path.length>0||!!won;

// =====================================================================
//  AUDIO
// =====================================================================
let AC=null,master,revIn,padBus,amb={},BV=null;
function makeIR(sec){
  const len=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);let lp=0;for(let i=0;i<len;i++){const n=Math.random()*2-1;lp=lp*0.6+n*0.4;d[i]=lp*Math.pow(1-i/len,2.4)*(i<AC.sampleRate*0.012?i/(AC.sampleRate*0.012):1);}}
  return b;
}
function noiseBuf(kind){
  const len=AC.sampleRate*4,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);let l=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;if(kind==='brown'){l=(l+0.02*w)/1.02;d[i]=l*3.5;}else d[i]=w;}
  return b;
}
function route(node,dry,wet,pan){
  let n=node;if(pan!=null&&AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=pan;node.connect(p);n=p;}
  const g1=AC.createGain();g1.gain.value=dry;n.connect(g1);g1.connect(master);
  const g2=AC.createGain();g2.gain.value=wet;n.connect(g2);g2.connect(revIn);
  return n;
}
function loopNoise(kind){const s=AC.createBufferSource();s.buffer=kind==='brown'?AC._brown:AC._white;s.loop=true;s.start(0,Math.random()*3);return s;}
function initAudio(){
  if(AC){if(AC.state!=='running')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;comp.attack.value=0.01;comp.release.value=0.3;comp.connect(AC.destination);
  master=AC.createGain();master.gain.value=save.sound?0.95:0;master.connect(comp);
  const rev=AC.createConvolver();rev.buffer=makeIR(5);revIn=AC.createGain();revIn.gain.value=0.85;revIn.connect(rev);
  const rhp=AC.createBiquadFilter();rhp.type='highpass';rhp.frequency.value=140;
  const rg=AC.createGain();rg.gain.value=0.5;rev.connect(rhp);rhp.connect(rg);rg.connect(master);
  AC._white=noiseBuf('white');AC._brown=noiseBuf('brown');
  // ambient pad (quiet, ducked while you play)
  padBus=AC.createGain();padBus.gain.value=0;route(padBus,0.45,0.9);padBus.gain.linearRampToValueAtTime(1,AC.currentTime+6);
  // rain + wind beds
  let s=loopNoise('white');const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=2400;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=8000;
  amb.rain=AC.createGain();amb.rain.gain.value=0;s.connect(hp);hp.connect(lp);lp.connect(amb.rain);route(amb.rain,0.8,0.25);
  s=loopNoise('brown');const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=380;bp.Q.value=0.6;
  amb.wind=AC.createGain();amb.wind.gain.value=0.022;s.connect(bp);bp.connect(amb.wind);route(amb.wind,0.7,0.4);
  const lfo=AC.createOscillator();lfo.frequency.value=0.05;const lg=AC.createGain();lg.gain.value=0.016;lfo.connect(lg);lg.connect(amb.wind.gain);lfo.start();
  const lfo2=AC.createOscillator();lfo2.frequency.value=0.027;const lg2=AC.createGain();lg2.gain.value=150;lfo2.connect(lg2);lg2.connect(bp.frequency);lfo2.start();
  buildBowlVoice();
  setAmbience();padLoop();
}
function setAmbience(){if(!AC)return;amb.rain.gain.setTargetAtTime(pal().rain*0.055,AC.currentTime,2);}
const mtof=m=>440*Math.pow(2,(m-69)/12);
// G major pentatonic world, so the stones always belong to the music
const CHORDS=[[43,50,59,62],[40,47,55,59],[38,45,50,57],[45,52,55,62],[43,47,50,55]];
let chordI=0;
function padChord(notes,dur){
  const t=AC.currentTime;
  notes.forEach((m,i)=>{
    const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.018/(1+i*0.3),t+dur*0.4);g.gain.linearRampToValueAtTime(0.0001,t+dur);
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700+i*90;lp.Q.value=0.2;
    [0,7].forEach(c=>{const o=AC.createOscillator();o.type=c?'triangle':'sine';o.frequency.value=mtof(m);o.detune.value=c+(Math.random()-.5)*5;o.connect(lp);o.start(t);o.stop(t+dur+0.1);});
    lp.connect(g);g.connect(padBus);
  });
}
function padLoop(){if(!AC)return;padChord(CHORDS[chordI%CHORDS.length],18);chordI++;setTimeout(padLoop,11000);}

// ---- struck bowl / chime (strikes, locks, stone answers) ----
function chime(f,gain,opts={}){
  if(!AC)return;const t=AC.currentTime;
  const parts=opts.parts||[[1,1,8],[2.71,0.45,4.6],[5.12,0.2,2.6],[8.45,0.08,1.4]];
  const out=AC.createGain();out.gain.value=gain;route(out,opts.dry==null?0.6:opts.dry,0.8,opts.pan);
  parts.forEach(([r,a,d],pi)=>{[-1,1].forEach(side=>{
    const o=AC.createOscillator();o.frequency.value=f*r+side*(0.45+pi*0.6);
    const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(a*0.5,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(out);o.start(t);o.stop(t+d+0.1);
  });});
  if(!opts.soft)burst(0.05,'bandpass',3600,2000,gain*0.35,2.5,0.25,opts.pan);
}
function burst(dur,type,f0,f1,gain,q,wet,pan,brown){
  if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=brown?AC._brown:AC._white;
  const f=AC.createBiquadFilter();f.type=type;f.Q.value=q||1;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,gain),t+Math.min(0.02,dur*0.3));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);route(g,0.85,wet||0.2,pan);s.start(t,Math.random()*3);s.stop(t+dur+0.05);
}
function tone(f,dur,gain,wet){
  if(!AC)return;const t=AC.currentTime,o=AC.createOscillator();o.frequency.value=f;
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);route(g,0.6,wet==null?0.5:wet);o.start(t);o.stop(t+dur+0.05);
}
const sfx={
  step(i){burst(0.08,'lowpass',i%2?720:560,220,0.08,0.8,0.12,null,true);},
  stone(){burst(1.4,'lowpass',240,60,0.25,0.7,0.35,null,true);tone(52,1.3,0.09,0.4);},
  nope(){tone(123.5,0.4,0.05,0.4);},
  win(){['B3','D4','E4','G4'].forEach((n,i)=>setTimeout(()=>chime(NOTES[n],0.12,{dry:0.45}),i*330));setTimeout(()=>chime(NOTES.B3*2,0.08,{dry:0.4}),1400);},
};

// ---- THE BOWL VOICE: a rubbed bowl, modelled partial by partial ----
// Each partial is a pair of slightly split modes (a real bowl is never perfectly round),
// which gives the slow natural "wah". The stick going around adds a pulse at twice the
// rotation rate, friction adds a breathy wooden texture, and pushing too fast makes it chatter.
const PARTIALS=[ {r:1,    rub:1.0,  hit:1.0, split:0.55},
                 {r:2.71, rub:0.17, hit:0.55,split:1.25},
                 {r:5.12, rub:0.05, hit:0.28,split:2.1},
                 {r:8.45, rub:0.012,hit:0.12,split:3.0} ];
function buildBowlVoice(){
  BV={oscs:[],pg:[]};
  const sum=AC.createGain();
  PARTIALS.forEach(p=>{
    const g=AC.createGain();g.gain.value=p.rub;g.connect(sum);BV.pg.push(g);

// ---- stone hums: each listening stone sings its note softly ----

// =====================================================================
//  THE BOWL (instrument state + physics)
// =====================================================================
const bowlState={level:0,A:0,theta:-Math.PI/2,omega:0,speed:0,rubbing:false,chatter:0,strikeE:0,wobble:0,freq:BOWL_F0,jerk:0,lastMove:0,slosh:0,gurgleT:0,stickVis:0};
function bowlPhysics(dt){
  const b=bowlState;
  b.freq=bowlFreq(b.level);
  if(performance.now()-b.lastMove>70)b.omega*=Math.pow(0.02,dt);
  b.speed=Math.abs(b.omega)/TAU;                 // revolutions per second
  b.rubbing=!!rubPtr&&b.speed>0.12;
  if(b.rubbing){
    // sweet spot ~0.6-1.6 rev/s; jerky circles feed less energy
    const drive=smooth(0.2,0.65,b.speed)*(1-0.55*smooth(1.7,2.6,b.speed));
    const steady=1/(1+b.jerk*0.9);
    const target=drive*steady;
    b.A+=(target-b.A)*(1-Math.exp(-dt/(target>b.A?0.85:2.2)));
    if(b.speed>1.75&&b.A>0.45)b.chatter=Math.min(1,b.chatter+dt*3.5);else b.chatter=Math.max(0,b.chatter-dt*2.5);
    b.A=Math.max(0,b.A-b.chatter*dt*0.6);
    b.stickVis=Math.min(1,b.stickVis+dt*6);
  }else{
    b.A*=Math.exp(-dt/7.5);b.chatter=Math.max(0,b.chatter-dt*3);
    b.stickVis=Math.max(0,b.stickVis-dt*2.5);
  }
  b.strikeE*=Math.exp(-dt/0.9);
  b.slosh*=Math.exp(-dt/0.5);
  b.wobble=Math.sin(levelT*6.3)*0.0035*Math.min(1,b.slosh)+Math.sin(levelT*0.7)*0.0004;
  if(b.slosh>0.25){b.gurgleT-=dt;if(b.gurgleT<=0){b.gurgleT=0.06+Math.random()*0.14;burst(0.09+Math.random()*0.08,'bandpass',300+Math.random()*700,200+Math.random()*300,0.03*Math.min(1,b.slosh),6,0.25);}}
  updateBowlVoice();
}
function strikeBowl(){
  const b=bowlState;b.A=Math.min(1,Math.max(b.A,0.5)+0.25);b.strikeE=1;
  burst(0.04,'bandpass',3800,2200,0.12,2.2,0.2);bowlRipples.push({t:0});
}

// =====================================================================
//  PUZZLE LOGIC: stones listen to the bowl
// =====================================================================
let tuneInfo=null,lastAnswer=null;
function stoneDist(s){return Math.hypot(trav.fx-s.x,trav.fy-s.y);}
function updateStones(dt){
  const b=bowlState,f=b.freq*(1+b.wobble);
  let near=null,nd=1e9;
  for(const s of G.stones){
    if(s.solved){s.glow=Math.min(1,s.glow+dt);if(s.voice)stopStoneVoice(s);continue;}
    const d=stoneDist(s);const listening=d<=RANGE;
    if(listening&&d<nd){nd=d;near=s;}
    const c=cents(f,s.f);const inTune=listening&&Math.abs(c)<TOL&&b.A>0.35&&b.chatter<0.5;
    s.inTune=inTune;s.c=c;
    if(s.kind==='lift'){
      const m=moverById(s.lift);const on=trav.x===m.x&&trav.y===m.y&&!trav.path.length;
      s.progress=inTune?Math.min(1,s.progress+dt/0.6):Math.max(0,s.progress-dt*1.5);
      if(on&&s.progress>=1){const i=G.idx(m.x,m.y);disp[i]=Math.min(m.h[1],disp[i]+dt*0.75);s.lifting=true;
        if(disp[i]>=m.h[1]-0.001){disp[i]=m.h[1];m.open=true;s.solved=true;s.lifting=false;lockFx(s);}}
      else s.lifting=false;
    }else{
      if(s.kind==='chord'&&s.locked){
        s.ring-=dt;if(s.ring<=0){s.locked=false;s.progress=0;chime(s.f,0.04,{soft:true,dry:0.3});}
      }else{
        s.progress=inTune?Math.min(1,s.progress+dt/1.5):Math.max(0,s.progress-dt*0.7);
        if(s.progress>=1){
          if(s.kind==='gate'){s.solved=true;openMovers(s.opens);lockFx(s);}
          else{s.locked=true;s.ring=CHORD_RING;lockFx(s,true);
            const grp=G.stones.filter(o=>o.group===s.group);
            if(grp.every(o=>o.locked)){grp.forEach(o=>{o.solved=true;});openMovers(s.opens);setTimeout(()=>{grp.forEach(o=>chime(o.f,0.1,{dry:0.5}));chime(grp[0].f*2,0.05,{dry:0.4});},350);}
          }
        }
      }
    }
    // voice: soft hum, louder as you approach, swelling as you tune in, sympathetic when locked
    if(AC&&!s.solved){
      startStoneVoice(s);
      const prox=1/(1+Math.max(0,d-0.8)*0.9);
      let g=0.012+0.03*prox;
      if(listening&&b.A>0.2)g+=0.03*smooth(60,0,Math.abs(c))*b.A;
      if(s.locked)g=0.05*clamp(s.ring/CHORD_RING,0.2,1)+0.02;
      g+=s.progress*0.03;
      s.voice.g.gain.setTargetAtTime(save.sound?g:0,AC.currentTime,0.15);
      if(s.voice.pan){const sp=P(s.x+0.5,s.y+0.5,0)[0];s.voice.pan.pan.setTargetAtTime(clamp((sp-W/2)/(W*0.6),-0.8,0.8),AC.currentTime,0.2);}
    }
    s.glow+=((s.locked?1:s.progress)-s.glow)*Math.min(1,dt*4);
  }
  tuneInfo=near;
}

  chime(s.f,soft?0.1:0.14,{dry:0.5});setTimeout(()=>chime(s.f*2,0.04,{soft:true,dry:0.4}),220);
  ripples.push({x:s.x,y:s.y,z:dh(s.x,s.y)+1.1,col:s.col,t:0});

function drawRain(t){

}
function drawMotes(t){
  ctx.fillStyle='#fff';
  for(let i=0;i<26;i++){const x=(hash(i,11)*W+Math.sin(t*0.2+i)*30+t*6)%W,y=(hash(i,12)*H-t*(8+hash(i,13)*10)+H*4)%H;

function drawMist(t){

  for(let i=0;i<4;i++){const x=((hash(i,21)*W+t*(6+i*3))%(W*1.6))-W*0.3,y=H*(0.62+0.1*i),r=W*(0.5+0.2*hash(i,22));

}
function drawWorld(t){
  drawBackground();drawMist(t*0.5);drawLightShafts();
  const order=[];for(let y=0;y<G.h;y++)for(let x=0;x<G.w;x++)if(disp[G.idx(x,y)]>-50)order.push([x,y]);
  order.sort((a,b)=>(a[0]+a[1])-(b[0]+b[1])||a[0]-b[0]);
  const tKey=trav.path.length?Math.max(Math.floor(trav.fx)+Math.floor(trav.fy),Math.ceil(trav.fx)+Math.ceil(trav.fy)):trav.x+trav.y;
  let tDrawn=false;
  for(const [x,y] of order){
    if(!tDrawn&&x+y>tKey){drawTraveller();tDrawn=true;}
    const i=G.idx(x,y),h=disp[i];drawColumn(x,y,h,i);
    const st=G.stones.find(s=>s.x===x&&s.y===y);if(st)drawStone(st);
    if(G.goal[0]===x&&G.goal[1]===y)drawStupa(x,y,h);
    if(!tDrawn&&x===trav.x&&y===trav.y&&!trav.path.length){drawTraveller();tDrawn=true;}
  }
  if(!tDrawn)drawTraveller();
  for(const s of G.stones){
    if(s.solved)continue;const c=P(s.x+0.5,s.y+0.5,dh(s.x,s.y));const prox=clamp(1.6-stoneDist(s)*0.3,0.25,1);
    for(let k=0;k<2;k++){const u=((levelT*0.35+k*0.5)%1);ctx.strokeStyle=rgba(s.col,(1-u)*0.5*prox);ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(c[0],c[1],A*(0.4+u*1.4),A*(0.4+u*1.4)*0.5774,0,0,TAU);ctx.stroke();}
  }
  for(const r of ripples){const c=P(r.x+0.5,r.y+0.5,r.z);const u=r.t/2;
    ctx.strokeStyle=rgba(r.col,Math.max(0,1-u)*0.85);ctx.lineWidth=2;for(let k=0;k<3;k++){const rr=A*(0.3+u*4+k*0.6);ctx.beginPath();ctx.ellipse(c[0],c[1],rr,rr*0.5774,0,0,TAU);ctx.stroke();}}
  if(sheetT>0.05){const c=P(trav.fx+0.5,trav.fy+0.5,trav.fz);ctx.save();ctx.setLineDash([2,6]);ctx.strokeStyle=`rgba(255,255,255,${0.35*sheetT})`;ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(c[0],c[1],RANGE*A*1.41,RANGE*A*1.41*0.5774,0,0,TAU);ctx.stroke();ctx.restore();}
  drawRain(t);drawMotes(t);
  if(won){ctx.fillStyle=`rgba(255,250,240,${clamp((won.t-1.4)/1.2,0,1)})`;ctx.fillRect(0,0,W,H);}
}

let sheetOpen=false,sheetT=0,bowlRipples=[];
function sheetGeo(){
  const top=lerp(H,H*0.5,ease(sheetT));
  const avail=H-top-SAFE_B;const cy=top+avail*0.5,r=Math.min(W*0.29,avail*0.29);
  return{top,cx:W/2,cy,r,ry:r*0.42,wx:W-36,wy0:cy-r*0.95,wy1:cy+r*0.95,closeX:W-34,closeY:top+30};
}
function drawBowlButton(){
  if(sheetT>0.5||cardOpen||won)return;
  const x=W/2,y=H-54-SAFE_B;const pulse=hintState.opened?0:0.5+0.5*Math.sin(levelT*3);
  ctx.strokeStyle='rgba(255,255,255,.92)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,24+pulse*3,0,TAU);ctx.stroke();
  ctx.lineWidth=1.8;ctx.beginPath();ctx.ellipse(x,y-3,11,3.5,0,0,TAU);ctx.stroke();

function drawSheet(){

  const vg=ctx.createLinearGradient(0,g.top-60,0,H);vg.addColorStop(0,`rgba(${p.sheet},0)`);vg.addColorStop(0.18,`rgba(${p.sheet},.42)`);vg.addColorStop(1,`rgba(${p.sheet},.62)`);

  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(g.closeX,g.closeY,15,0,TAU);ctx.stroke();

function drawTuner(g){

    ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillText(a.kind==='lift'?'the stone carried you up':'the stone answered',x,y+40);return;}

  let ty=y+34;

  ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(cx-r,cy);ctx.bezierCurveTo(cx-r*0.98,cy+r*0.62,cx-r*0.45,cy+r*0.72,cx,cy+r*0.72);ctx.bezierCurveTo(cx+r*0.45,cy+r*0.72,cx+r*0.98,cy+r*0.62,cx+r,cy);ctx.ellipse(cx,cy,r,ry,0,0,Math.PI,true);ctx.fill();

  ctx.fillStyle=gr;ctx.beginPath();ctx.ellipse(cx,cy,r*0.95,ry*0.9,0,0,TAU);ctx.fill();

function drawWaterSlider(g){

function drawSheetHint(){

  ctx.fillStyle='rgba(255,255,255,.9)';ctx.textAlign='center';ctx.font='italic 15px '+FONT;
  wrapText(s,W/2,H-22-SAFE_B,W-90,19);

function wrapText(s,x,y,maxW,lh){const words=s.split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}lines.push(cur);
  lines.forEach((l,i)=>ctx.fillText(l,x,y-(lines.length-1-i)*lh));}

// =====================================================================
//  HINTS
// =====================================================================
let hintState={},worldHint='';
function sheetHint(){
  const b=bowlState,s=tuneInfo;
  if(!hintState.sang)return LI===0&&!hintState.struck?'Tap the bowl to strike it. Circle the rim to make it sing':'Circle the rim slowly and steadily, like stirring tea';
  if(b.chatter>0.3)return'Too fast. The stick is chattering';
  if(!s&&lastAnswer&&levelT-lastAnswer.t<4)return'Close the bowl and walk on';
  if(!s)return'Walk closer to a stone. Its hum will guide you';
  if(s.kind==='lift'&&s.inTune&&!s.lifting)return'Stand on the stone beside it and hold the note';
  if(s.inTune)return s.kind==='lift'?'Hold it…':'Hold it… let the stone join in';
  if(s.kind==='chord'&&s.locked)return'Quick, walk to the other stone while this one sings';
  if(b.A>0.3&&Math.abs(s.c)<70)return'Hear the wobble? It slows as you get closer';
  if(b.A>0.3)return s.c>0?'Too high. Add water to lower the pitch':'Too low. Pour some water out';
  return'Keep circling to build the tone';
}
function updateWorldHint(){
  let s='';
  if(!cardOpen&&!won&&sheetT<0.5){
    if(LI===0&&!hintState.opened)s='Tap the bowl to listen';
    else if(G.stones.some(st=>!st.solved&&stoneDist(st)<=RANGE)&&!sheetOpen&&bowlState.A<0.1)s='A stone is humming nearby';
    else if(LI===2&&G.stones.some(st=>st.locked))s='The stone is still singing. Hurry';
  }
  worldHint=s;
}
function drawWorldHint(){if(!worldHint||sheetT>0.3)return;ctx.fillStyle='rgba(255,255,255,.92)';ctx.textAlign='center';ctx.font='italic 16px '+FONT;ctx.fillText(worldHint,W/2,H-100-SAFE_B);}

// =====================================================================
//  UPDATE
// =====================================================================
function update(dt){
  levelT+=dt;
  sheetT=clamp(sheetT+(sheetOpen?dt:-dt)*3.2,0,1);
  const tp=P(trav.fx+0.5,trav.fy+0.5,trav.fz);const want=sheetOpen?Math.min(0,(H*0.3)-(tp[1]-shiftY)):0;
  shiftY+=(want-shiftY)*Math.min(1,dt*5);oy=oyBase+shiftY;
  bowlPhysics(dt);
  if(rubPtr&&bowlState.A>0.25)hintState.sang=true;
  G.movers.forEach((m,i)=>{if(m.lift)return;const tgt=m.h[m.open?1:0];const d=tgt-disp[i];if(Math.abs(d)>0.005)disp[i]+=Math.sign(d)*Math.min(Math.abs(d),dt*1.6);else disp[i]=tgt;});
  if(trav.path.length){
    const [nx,ny]=trav.path[0];const sp=3.0;trav.t+=dt*sp;trav.step+=dt*sp;const u=Math.min(1,trav.t);
    trav.fx=trav.x+(nx-trav.x)*u;trav.fy=trav.y+(ny-trav.y)*u;
    const h0=disp[G.idx(trav.x,trav.y)],h1=disp[G.idx(nx,ny)];trav.fz=h0+(h1-h0)*u;
    if(u>=1){trav.x=nx;trav.y=ny;trav.t=0;trav.path.shift();sfx.step(Math.round(trav.step));
      if(G.goal[0]===nx&&G.goal[1]===ny){trav.path=[];win();}}
  }else{trav.fx=trav.x;trav.fy=trav.y;trav.fz=disp[G.idx(trav.x,trav.y)];}
  updateStones(dt);
  for(let i=ripples.length-1;i>=0;i--){ripples[i].t+=dt;if(ripples[i].t>2)ripples.splice(i,1);}
  for(let i=bowlRipples.length-1;i>=0;i--){bowlRipples[i].t+=dt;if(bowlRipples[i].t>0.8)bowlRipples.splice(i,1);}
  if(padBus)padBus.gain.setTargetAtTime(sheetOpen?0.3:1,AC.currentTime,0.8);
  if(won){won.t+=dt;if(won.t>2.8&&!won.done){won.done=true;nextLevel();}}
  updateWorldHint();
}
function win(){won={t:0};sheetOpen=false;sfx.win();save.unlocked=Math.max(save.unlocked,Math.min(LEVELS.length-1,LI+1));persist();}

// =====================================================================
//  INPUT
// =====================================================================
const ptrs=new Map();let rubPtr=null,waterPtr=null;
function tileAt(px,py){
  const order=[];for(let y=0;y<G.h;y++)for(let x=0;x<G.w;x++)if(disp[G.idx(x,y)]>-50)order.push([x,y]);
  order.sort((a,b)=>(b[0]+b[1])-(a[0]+a[1])||b[0]-a[0]);
  for(const [x,y] of order){const h=disp[G.idx(x,y)];
    if(inPoly(px,py,[P(x,y,h),P(x+1,y,h),P(x+1,y+1,h),P(x,y+1,h)]))return[x,y];
    if(inPoly(px,py,[P(x,y+1,h),P(x+1,y+1,h),P(x+1,y+1,h-0.4),P(x,y+1,h-0.4)])||inPoly(px,py,[P(x+1,y,h),P(x+1,y+1,h),P(x+1,y+1,h-0.4),P(x+1,y,h-0.4)]))return[x,y];}
  return null;
}
function inPoly(x,y,q){let c=false;for(let i=0,j=q.length-1;i<q.length;j=i++){if(((q[i][1]>y)!==(q[j][1]>y))&&(x<(q[j][0]-q[i][0])*(y-q[i][1])/(q[j][1]-q[i][1])+q[i][0]))c=!c;}return c;}
cv.addEventListener('pointerdown',e=>{
  initAudio();if(!G||cardOpen)return;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const x=e.clientX,y=e.clientY;const p={id:e.pointerId,x0:x,y0:y,t0:performance.now(),x,y,kind:'tap'};
  if(sheetOpen&&sheetT>0.6){
    const g=sheetGeo();
    if(Math.hypot(x-g.closeX,y-g.closeY)<30)p.kind='close';
    else if(Math.abs(x-g.wx)<34&&y>g.wy0-30&&y<g.wy1+30){p.kind='water';waterPtr=p;setWaterFrom(y);}
    else if(y>g.top){const nx=(x-g.cx)/g.r,ny=(y-g.cy)/g.ry;if(Math.hypot(nx,ny*0.6)<2.4){p.kind='bowl';p.lastA=Math.atan2(ny,nx);p.acc=0;p.lt=performance.now();}else p.kind='none';}
  }else if(!sheetOpen&&Math.hypot(x-W/2,y-(H-54-SAFE_B))<32&&!won)p.kind='openBowl';
  ptrs.set(e.pointerId,p);
});
function setWaterFrom(y){const g=sheetGeo();const nl=clamp((g.wy1-y)/(g.wy1-g.wy0),0,1);const b=bowlState;b.slosh=Math.min(1.5,b.slosh+Math.abs(nl-b.level)*14);b.level=nl;}
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;p.x=e.clientX;p.y=e.clientY;
  if(p.kind==='water')setWaterFrom(p.y);
  else if(p.kind==='bowl'||p.kind==='rub'){
    const g=sheetGeo();const nx=(p.x-g.cx)/g.r,ny=(p.y-g.cy)/g.ry;const a=Math.atan2(ny,nx);const rad=Math.hypot(nx,ny);
    let d=a-p.lastA;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;p.lastA=a;
    const now=performance.now(),dt=Math.max(4,now-p.lt)/1000;p.lt=now;
    if(rad<0.25)return;
    p.acc+=Math.abs(d);
    if(p.kind==='bowl'&&p.acc>0.5&&!rubPtr){p.kind='rub';rubPtr=p;}
    if(p.kind==='rub'){
      const b=bowlState;const w=d/dt;const prev=b.omega;b.omega=b.omega*0.7+w*0.3;
      b.jerk=b.jerk*0.9+Math.min(6,Math.abs(b.omega-prev)/TAU)*0.1;
      b.theta=a;b.lastMove=now;
    }
  }
});
function endPtr(e){
  const p=ptrs.get(e.pointerId);if(!p)return;ptrs.delete(e.pointerId);
  const moved=Math.hypot(p.x-p.x0,p.y-p.y0),quick=performance.now()-p.t0<350;
  if(p===rubPtr)rubPtr=null;if(p===waterPtr)waterPtr=null;
  if(p.kind==='close'){sheetOpen=false;return;}
  if(p.kind==='openBowl'&&moved<20){openSheet();return;}
  if(p.kind==='bowl'&&moved<14&&quick){strikeBowl();hintState.struck=true;return;}
  if(p.kind==='tap'&&moved<14)worldTap(p.x,p.y);
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
function openSheet(){sheetOpen=true;hintState.opened=true;}
function worldTap(px,py){
  if(travBusy())return;
  if(sheetOpen&&py>sheetGeo().top)return;
  const tp=P(trav.x+0.5,trav.y+0.5,disp[G.idx(trav.x,trav.y)]);
  if(Math.hypot(px-tp[0],py-(tp[1]-12*A/21))<Math.max(24,A*0.7)){if(!sheetOpen)openSheet();return;}
  const t=tileAt(px,py);if(!t||(t[0]===trav.x&&t[1]===trav.y))return;
  const path=findPath(t[0],t[1]);
  if(!path){sfx.nope();flash={x:t[0],y:t[1],t:0};return;}
  trav.path=path;trav.t=0;
}
let flash=null;

// =====================================================================
//  CARDS & MENU
// =====================================================================
const ORN_TOP='<svg class="orn" viewBox="0 0 250 34" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 26H95l12-12 10 10 8-8 8 8 10-10 12 12H250"/><path d="M125 2l9 9-9 9-9-9z"/></svg>';
const ORN_BOT='<svg class="orn" viewBox="0 0 250 34" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 8H95l12 12 10-10 8 8 8-8 10 10 12-12H250"/><path d="M125 14l9 9-9 9-9-9z"/></svg>';
const GO='<button class="go" id="goBtn" aria-label="Begin"><svg viewBox="0 0 66 66" width="66" height="66"><circle cx="33" cy="33" r="26" fill="none" stroke="currentColor" stroke-width="4.5"/><circle cx="33" cy="33" r="31" fill="none" stroke="currentColor" stroke-width="1" opacity=".6"/></svg></button>';
let cardOpen=true;
function showCard(html,onGo,veil){cardOpen=true;$('cardBody').innerHTML=html+GO;$('veil').style.background=veil;$('card').classList.remove('hide');$('goBtn').onclick=()=>{initAudio();onGo();};}
function hideCard(){cardOpen=false;$('card').classList.add('hide');}
function titleCard(){
  showCard(`${ORN_TOP}<div class="label">a singing bowl journey</div><h1>Resonance</h1><div class="div"></div><div class="lines"><span class="small">headphones recommended<br>silent switch off</span></div>${ORN_BOT}`,
    ()=>chapterCard(save.unlocked),'linear-gradient(rgba(40,50,48,.38),rgba(40,50,48,.15))');
}
function chapterCard(i){
  sheetOpen=false;sheetT=0;shiftY=0;loadLevel(i);const L=LEVELS[i];
  showCard(`${ORN_TOP}<div class="label">${L.chapter}</div><h1>${L.title}</h1><div class="div"></div><div class="lines"><span class="small">${L.lines[0]}</span><br>${L.lines.slice(1).join('<br>')}</div>${ORN_BOT}`,
    ()=>{hideCard();chime(NOTES.G4,0.1,{dry:0.4});},'linear-gradient(rgba(30,30,35,.28),rgba(30,30,35,.06))');
}
function nextLevel(){
  if(LI+1<LEVELS.length)chapterCard(LI+1);
  else showCard(`${ORN_TOP}<div class="label">Epilogue</div><h1>To be<br>continued</h1><div class="div"></div><div class="lines"><span class="small">in which</span><br>the valley<br>keeps humming</div>${ORN_BOT}`,()=>chapterCard(0),'linear-gradient(rgba(30,30,35,.3),rgba(30,30,35,.1))');
}
$('menuBtn').onclick=()=>{initAudio();if(cardOpen)return;renderMenu();$('menu').classList.remove('hide');};
$('mResume').onclick=()=>$('menu').classList.add('hide');
$('mRestart').onclick=()=>{$('menu').classList.add('hide');sheetOpen=false;loadLevel(LI);};
$('mSound').onclick=()=>{save.sound=!save.sound;persist();if(master)master.gain.setTargetAtTime(save.sound?0.95:0,AC.currentTime,0.2);renderMenu();};
$('mGuide').onclick=()=>{save.guide=!save.guide;persist();renderMenu();};
function renderMenu(){
  $('mSound').textContent='Sound: '+(save.sound?'on':'off');$('mGuide').textContent='Tuning guide: '+(save.guide?'on':'off');
  const roman=['I','II','III','IV','V'];
  $('mChapters').innerHTML=LEVELS.map((l,i)=>`<button ${i>save.unlocked?'disabled':''} class="${i===LI?'cur':''}" data-i="${i}">${roman[i]}</button>`).join('');
  $('mChapters').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('menu').classList.add('hide');chapterCard(+b.dataset.i);});
}

// =====================================================================
//  LOOP
// =====================================================================
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  try{
    if(G){
      update(dt);drawWorld(now/1000);
      if(flash){flash.t+=dt;const h=disp[G.idx(flash.x,flash.y)];poly([P(flash.x,flash.y,h),P(flash.x+1,flash.y,h),P(flash.x+1,flash.y+1,h),P(flash.x,flash.y+1,h)]);ctx.fillStyle=`rgba(255,255,255,${0.35*(1-flash.t/0.5)})`;ctx.fill();if(flash.t>0.5)flash=null;}
      drawWorldHint();drawBowlButton();drawSheet();
    }
  }catch(err){console.error(err);}
  requestAnimationFrame(frame);
}
loadLevel(save.unlocked);titleCard();requestAnimationFrame(frame);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
