<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Summit">
<meta name="theme-color" content="#0b1320">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Summit</title>
<style>
:root{--bg:#0b1320;--card:#14202f;--card2:#1c2b40;--line:#2a3b54;--snow:#eaf1f8;--mut:#8ea3bd;--acc:#ff8a3d;--good:#4fd18b;--bad:#ff5a6e;--warn:#ffc94d;--blue:#5ab0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--snow);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.38;cursor:default}
h1,h2,h3{margin:0}
.pad{padding:18px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.small{font-size:13px;color:var(--mut);line-height:1.35}
.big{display:block;width:100%;padding:16px;border-radius:14px;background:var(--acc);color:#1a0f05;font-weight:700;font-size:17px;margin-top:12px}
.ghost{display:block;width:100%;padding:14px;border-radius:14px;background:var(--card2);font-weight:600;margin-top:10px}
/* title */
.title{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;background:radial-gradient(ellipse at 50% 20%,#24365a 0%,var(--bg) 70%)}
.title h1{font-size:54px;letter-spacing:10px;font-weight:800;text-align:center}
.title .tag{text-align:center;color:var(--mut);margin:6px 0 22px}
.stats{display:flex;justify-content:space-around;margin:18px 0 6px;color:var(--mut);font-size:13px;text-align:center}
.stats b{display:block;color:var(--snow);font-size:20px}
/* team select */
.cand{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid transparent;border-radius:14px;padding:12px;margin-top:10px}
.cand.sel{border-color:var(--acc);background:var(--card2)}
.ci{font-size:30px;width:40px;text-align:center}
.trait{font-size:12px;color:var(--warn);margin-top:4px}
.obj{background:var(--card);border-radius:14px;padding:12px;margin-top:12px}
/* pack */
.packrow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px;margin-top:10px}
.packrow .lbl{flex:1}
.step{width:44px;height:44px;border-radius:12px;background:var(--card2);font-size:22px;font-weight:700}
.qty{width:34px;text-align:center;font-size:20px;font-weight:700}
.bar{height:10px;background:var(--card2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:6px}
/* game */
.hud{padding:8px 12px 6px;background:var(--card);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.day{font-weight:700}
.alt{font-weight:800;font-size:18px}
.wx{display:flex;gap:6px;align-items:center;font-size:14px}
.wx .now{font-size:20px}
.wx .fc{opacity:.75;font-size:15px}
.menu{font-size:22px;padding:0 4px}
.res{display:flex;justify-content:space-between;margin-top:6px;font-size:15px}
.res span{white-space:nowrap}
.res .low{color:var(--bad);font-weight:700}
.ebar{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px}
.ebar .bar{flex:1;height:8px}
.acc{font-size:12px;margin-top:5px;color:var(--mut)}
.acc.warn{color:var(--warn)}.acc.bad{color:var(--bad)}
.team{display:flex;gap:6px;padding:6px 12px;background:var(--bg)}
.mem{flex:1;background:var(--card);border-radius:10px;padding:6px 7px;min-width:0}
.mem .n{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem .bar{height:5px;margin-top:4px}
.mapwrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.mapwrap svg{display:block;width:100%}
.node{cursor:default}
.node.can{cursor:pointer}
.node.can circle.bg{stroke:var(--acc);stroke-width:3;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.25}}
.log{padding:6px 12px;font-size:12.5px;color:var(--mut);min-height:52px;background:var(--card);border-top:1px solid var(--line)}
.log div{margin:2px 0;line-height:1.3}
.log div:first-child{color:var(--snow)}
.actions{padding:8px 10px 10px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.arow{display:flex;gap:8px}
.act{flex:1;padding:12px 6px;border-radius:12px;background:var(--card2);font-weight:600;font-size:14px;line-height:1.2}
.act.go{background:var(--acc);color:#1a0f05}
.act small{display:block;font-weight:500;font-size:11.5px;opacity:.8;margin-top:2px}
.hint{font-size:12px;color:var(--mut);text-align:center}
/* overlay */
#ov{position:fixed;inset:0;background:rgba(5,9,16,.82);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
#ov.hidden{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.card .ico{font-size:46px;text-align:center}
.card h2{text-align:center;margin:6px 0 10px;font-size:22px}
.card p{line-height:1.45;margin:0 0 6px;color:#cfdbe8}
.choice{display:block;width:100%;text-align:left;padding:14px;border-radius:12px;background:var(--card2);margin-top:9px;font-weight:600;font-size:15px}
.choice small{display:block;font-weight:500;color:var(--mut);font-size:12px;margin-top:2px}
.result{background:var(--bg);border-radius:12px;padding:12px;margin-top:10px}
.result div{margin:4px 0;line-height:1.4}
.score{font-size:44px;font-weight:800;text-align:center;color:var(--acc);margin:4px 0}
.help h3{margin:14px 0 4px;font-size:15px;color:var(--acc)}
.help p{font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov" class="hidden"></div>
<script>
'use strict';
/* ================= utils ================= */
const rnd = Math.random;
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ================= data ================= */
const ROLES = {
  sherpa:       { name: 'Sherpa',       icon: '🧗', desc: 'Barely feels the altitude. Carries +10 kg.' },
  medic:        { name: 'Medic',        icon: '⛑️', desc: 'Heals everyone +10 HP when resting at camp.' },
  photographer: { name: 'Photographer', icon: '📷', desc: 'Extra photos at viewpoints and the summit.' },
  veteran:      { name: 'Veteran',      icon: '🎖️', desc: 'Climbing costs 20% less energy.' },
  rookie:       { name: 'Rookie',       icon: '🙂', desc: 'So excited: +1 morale every day.' },
  cook:         { name: 'Cook',         icon: '🍲', desc: '30% chance a day costs no food.' }
};
const TRAITS = {
  iron:     { name: 'Iron lungs', desc: 'Altitude sickness halved' },
  cheerful: { name: 'Cheerful',   desc: '+2 morale every day' },
  tough:    { name: 'Tough',      desc: '120 max HP' },
  clumsy:   { name: 'Clumsy',     desc: 'Gets hurt more by hazards' }
};
const SHERPA_NAMES = ['Pasang', 'Mingma', 'Lhakpa', 'Dawa', 'Nima', 'Pemba', 'Ang Tsering'];
const NAMES = ['Eva', 'Jakub', 'Klára', 'Marek', 'Lucie', 'Vojta', 'Anna', 'Petr', 'Bára', 'Tomáš', 'Šimon', 'Ema', 'Filip', 'Tereza'];
const PEAKS = [
  { name: 'Kanchen Ri',   alt: 8412 },
  { name: 'Tsering Kang', alt: 8586 },
  { name: 'Gauri Shar',   alt: 8848 }
];
const WX = [{ i: '☀️', n: 'Clear' }, { i: '🌬️', n: 'Windy' }, { i: '🌨️', n: 'Storm' }];
const WX_T = [[.6, .3, .1], [.35, .4, .25], [.3, .4, .3]];
const TYPE = {
  start:    { i: '🏘️', n: 'Village' },
  bridge:   { i: '🐂', n: 'Bridge' },
  teahouse: { i: '☕', n: 'Teahouse' },
  bc:       { i: '🏕️', n: 'Base Camp' },
  camp:     { i: '⛺', n: 'Camp' },
  event:    { i: '❓', n: 'Unknown' },
  hazard:   { i: '⚠️', n: 'Hazard' },
  cache:    { i: '📦', n: 'Supplies' },
  view:     { i: '🏔️', n: 'Viewpoint' },
  summit:   { i: '🚩', n: 'Summit' }
};

/* ================= state ================= */
let g = null;                       // current run
let meta = store.get('summit_meta', { runs: 0, summits: 0, best: 0 });
let ui = { screen: 'title', cands: [], sel: [], peak: null, pack: { food: 18, fuel: 10, o2: 6 }, end: null };
let lastScrollPos = -1;

const save = () => { if (g) store.set('summit_run', g); };
const curNode = () => g.nodes[g.pos];
const curAlt = () => curNode().alt;
const has = role => g.team.some(m => m.role === role);
const count = role => g.team.filter(m => m.role === role).length;
const cap = () => 40 + 10 * count('sherpa');
const load = () => g.food + g.fuel + 2 * g.o2;
const nodeName = n => n.name || TYPE[n.type].n;
const log = s => { g.log.unshift(s); g.log.length = Math.min(g.log.length, 40); };

/* ================= map generation ================= */
function buildMap(peak) {
  const rows = [
    { alt: 3900, name: 'Village', n: 1, kind: 'start' },
    { alt: 4600, n: 2, kind: 'trail' },
    { alt: 5300, name: 'Base Camp', n: 1, kind: 'bc' },
    { alt: 5650, n: ri(2, 3) }, { alt: 5900, n: ri(2, 3) },
    { alt: 6100, name: 'Camp 1', n: 1, kind: 'camp' },
    { alt: 6350, n: ri(2, 3) }, { alt: 6550, n: ri(2, 3) },
    { alt: 6750, name: 'Camp 2', n: 1, kind: 'camp' },
    { alt: 7000, n: ri(2, 3) }, { alt: 7200, n: ri(2, 3) },
    { alt: 7400, name: 'Camp 3', n: 1, kind: 'camp' },
    { alt: 7650, n: ri(2, 3) },
    { alt: 7900, name: 'Camp 4', n: 1, kind: 'camp' },
    { alt: peak.alt - 350, n: 2, kind: 'ridge' },
    { alt: peak.alt, name: peak.name, n: 1, kind: 'summit' }
  ];
  const nodes = [];
  rows.forEach((row, r) => {
    const trail = shuffle(['bridge', 'teahouse']);
    row.ids = [];
    for (let k = 0; k < row.n; k++) {
      let type;
      if (row.kind === 'start') type = 'start';
      else if (row.kind === 'trail') type = trail[k];
      else if (row.kind === 'bc') type = 'bc';
      else if (row.kind === 'camp') type = 'camp';
      else if (row.kind === 'summit') type = 'summit';
      else if (row.kind === 'ridge') type = k === 0 ? 'hazard' : 'event';
      else { const x = rnd(); type = x < .5 ? 'event' : x < .78 ? 'hazard' : x < .91 ? 'cache' : 'view'; }
      const id = nodes.length;
      nodes.push({ id, r, k, x: (k + 1) / (row.n + 1), alt: row.alt, type, name: row.name || null, camp: ['start', 'bc', 'camp'].includes(row.kind), out: [] });
      row.ids.push(id);
    }
  });
  for (let r = 0; r < rows.length - 1; r++) {
    const A = rows[r].ids.map(i => nodes[i]), B = rows[r + 1].ids.map(i => nodes[i]);
    A.forEach(a => B.forEach(b => { if (Math.abs(a.x - b.x) < .34) a.out.push(b.id); }));
    A.forEach(a => { if (!a.out.length) a.out.push(B.reduce((best, b) => Math.abs(b.x - a.x) < Math.abs(best.x - a.x) ? b : best).id); });
    B.forEach(b => { if (!A.some(a => a.out.includes(b.id))) A.reduce((best, a) => Math.abs(a.x - b.x) < Math.abs(best.x - b.x) ? a : best).out.push(b.id); });
  }
  return { rows: rows.map(r => ({ alt: r.alt, name: r.name || null, kind: r.kind || null })), nodes };
}

function makeWeather() {
  const w = [0], noise = [[0, 0, 0, 0]];
  for (let i = 1; i < 200; i++) {
    const p = WX_T[w[i - 1]], x = rnd();
    w.push(x < p[0] ? 0 : x < p[0] + p[1] ? 1 : 2);
    noise.push([rnd(), rnd(), rnd(), rnd()]);
  }
  return { w, noise };
}
function forecast(off) {
  const d = g.day + off, actual = g.weather[d];
  if (off === 0 || g.foresight >= d) return actual;
  const acc = [1, .85, .7, .55][off];
  const nz = g.fcNoise[d];
  return nz[off] < acc ? actual : (actual + (nz[0] < .5 ? 1 : 2)) % 3;
}

/* ================= run setup ================= */
function makeMember(role, name) {
  let trait = rnd() < .65 ? pick(Object.keys(TRAITS)) : null;
  if (role === 'sherpa' && trait === 'iron') trait = 'cheerful';
  const max = trait === 'tough' ? 120 : 100;
  return { name, role, trait, hp: max, max };
}
function newExpedition() {
  ui.peak = pick(PEAKS);
  const names = shuffle(NAMES.slice());
  const roles = shuffle(['medic', 'photographer', 'veteran', 'rookie', 'cook']).slice(0, 4);
  ui.cands = shuffle([makeMember('sherpa', pick(SHERPA_NAMES)), ...roles.map((r, i) => makeMember(r, names[i]))]);
  ui.sel = [];
  ui.screen = 'team';
  render();
}
function toggleCand(i) {
  const at = ui.sel.indexOf(i);
  if (at >= 0) ui.sel.splice(at, 1); else if (ui.sel.length < 3) ui.sel.push(i);
  render();
}
function startRun() {
  if (ui.sel.length !== 3) return;
  const map = buildMap(ui.peak), wx = makeWeather();
  g = {
    v: 1, peak: ui.peak, rows: map.rows, nodes: map.nodes, pos: 0, path: [0],
    day: 1, weather: wx.w, fcNoise: wx.noise, foresight: 0,
    team: ui.sel.map(i => ui.cands[i]), lost: [],
    food: 0, fuel: 0, o2: 0, energy: 100, morale: 70, acclim: 4300, maxAlt: 3900,
    phase: 'climb', packed: false, summited: false, descStops: [], descIdx: 0,
    photos: 0, warned: false, seen: {}, pending: null,
    log: []
  };
  log(`Day 1. Your team sets off from the village toward ${g.peak.name} (${g.peak.alt} m).`);
  meta.runs++; store.set('summit_meta', meta);
  ui.screen = 'game'; lastScrollPos = -1;
  save(); render();
}

/* ================= helpers for effects ================= */
function hurt(m, n, hazard) {
  if (!m) return '';
  let amt = n;
  if (hazard && m.trait === 'clumsy') amt *= 1.4;
  if (hazard && g.warned) amt *= .5;
  amt = Math.round(amt);
  m.hp -= amt;
  return `${m.name} −${amt} HP.`;
}
const hurtAll = (n, hazard) => g.team.map(m => hurt(m, n, hazard)).join(' ');
const healAll = n => g.team.forEach(m => m.hp = Math.min(m.max, m.hp + n));
function gain(res, n) {
  const per = res === 'o2' ? 2 : 1;
  const can = clamp(Math.floor((cap() - load()) / per), 0, n);
  g[res] += can;
  const icon = { food: '🍚', fuel: '🔥', o2: '🫁' }[res];
  return can < n ? `+${can} ${icon} (pack full)` : `+${can} ${icon}`;
}
function normalize() {
  g.energy = clamp(Math.round(g.energy), 0, 100);
  g.morale = clamp(Math.round(g.morale), 0, 100);
  g.food = Math.max(0, g.food); g.fuel = Math.max(0, g.fuel); g.o2 = Math.max(0, g.o2);
  g.team.forEach(m => m.hp = Math.min(m.max, m.hp));
}
function checkLosses(msgs) {
  const out = g.team.filter(m => m.hp <= 0);
  out.forEach(m => {
    g.team.splice(g.team.indexOf(m), 1);
    g.lost.push(m.name);
    g.morale -= 15;
    msgs.push(curAlt() >= 7500
      ? `💔 ${m.name} collapses and is helped down by Sherpas from another team.`
      : `💔 ${m.name} is too weak to continue and heads back down.`);
  });
}

/* ================= day tick ================= */
function passDay(msgs) {
  const n = curNode(), alt = n.alt;
  const supplied = !g.packed || n.type === 'bc';
  if (!supplied) {
    if (has('cook') && rnd() < .3) { /* cook stretches the rations */ }
    else if (g.food > 0) g.food--;
    else { msgs.push('🍚 Out of food! Everyone weakens (−6 HP).'); g.team.forEach(m => m.hp -= 6); g.morale -= 10; }
    if (alt >= 6500) {
      if (g.fuel > 0) g.fuel--;
      else { msgs.push('🔥 No fuel to melt snow. Dehydration (−6 HP).'); g.team.forEach(m => m.hp -= 6); }
    }
  }
  let onO2 = false;
  if (alt >= 7500) {
    if (g.o2 > 0) { g.o2--; onO2 = true; }
    else { msgs.push('🫁 No oxygen in the death zone (−8 HP)!'); g.team.forEach(m => m.hp -= 8); }
  }
  const diff = alt - (onO2 ? 1200 : 0) - g.acclim - 300;
  if (diff > 0) {
    const base = Math.ceil(diff / 60);
    g.team.forEach(m => { m.hp -= (m.role === 'sherpa' || m.trait === 'iron') ? Math.ceil(base / 2) : base; });
    msgs.push(`🤕 Altitude sickness (−${base} HP). Acclimatize or descend!`);
  }
  if (alt > g.acclim && g.acclim < 7300) g.acclim = Math.min(7300, g.acclim + Math.min(150, alt - g.acclim));
  if (alt >= 7000) g.morale -= 3;
  g.morale += 2 * g.team.filter(m => m.trait === 'cheerful').length + (has('rookie') ? 1 : 0);
  g.morale = clamp(g.morale, 0, 100);
  if (g.morale <= 0 && g.team.length > 1) {
    const m = pick(g.team);
    g.team.splice(g.team.indexOf(m), 1); g.lost.push(m.name);
    msgs.push(`😞 ${m.name} has had enough and turns back.`);
    g.morale = 30;
  }
  g.day++;
  checkLosses(msgs);
}

/* ================= actions ================= */
function climbCost(toAlt) {
  let c = 12 + Math.max(0, toAlt - 4000) / 300;
  if (has('veteran')) c *= .8;
  const w = g.weather[g.day];
  if (w === 1) c *= 1.35; else if (w === 2) c *= 1.7;
  if (g.morale < 25) c *= 1.5;
  return Math.round(c);
}
function descentCost() {
  let c = 6 + Math.max(0, curAlt() - 4000) / 800;
  const w = g.weather[g.day];
  if (w === 1) c *= 1.3; else if (w === 2) c *= 1.6;
  return Math.round(c);
}
function stormHit(alt, msgs, scale) {
  if (g.weather[g.day] !== 2) return;
  const hit = [];
  g.team.forEach(m => { if (rnd() < .55) { const d = Math.round((6 + (alt - 4000) / 300) * scale); m.hp -= d; hit.push(`${m.name} −${d}`); } });
  msgs.push('🌨️ The storm batters the team' + (hit.length ? ` (${hit.join(', ')} HP).` : ', but nobody is hurt.'));
}
function climb(id) {
  if (g.pending || g.phase !== 'climb') return;
  const n = g.nodes[id];
  if (!curNode().out.includes(id)) return;
  const cost = climbCost(n.alt);
  if (g.energy < cost) return;
  const msgs = [`⬆️ Climbed to ${nodeName(n)} (${n.alt} m).`];
  g.energy -= cost;
  stormHit(n.alt, msgs, 1);
  g.pos = id; g.path.push(id); g.maxAlt = Math.max(g.maxAlt, n.alt);
  passDay(msgs);
  finish(msgs, arrivalEvent(n));
}
function descend() {
  if (g.pending || g.phase !== 'descent') return;
  const cost = descentCost();
  if (g.energy < cost) return;
  const target = g.nodes[g.descStops[g.descIdx]];
  const msgs = [`⬇️ Descended to ${nodeName(target)} (${target.alt} m).`];
  g.energy -= cost;
  stormHit(curAlt(), msgs, .6);
  g.pos = target.id; g.descIdx++;
  if (target.type === 'camp' && target.alt < 7500) msgs.push('📦 Your support crew left supplies at this camp: ' + gain('food', 2) + ', ' + gain('fuel', 1));
  passDay(msgs);
  if (g.team.length && target.type === 'bc') { normalize(); msgs.slice().reverse().forEach(log); return endRun(true); }
  finish(msgs, rnd() < .45 ? pickEvent(POOL_DESC) : null);
}
function rest() {
  if (g.pending) return;
  const n = curNode(), alt = n.alt, dz = alt >= 7500, msgs = [];

const POOL_EVENT = ['tent', 'expedition', 'glove', 'raven', 'sick', 'sherpaTea', 'view', 'lenticular', 'whiteout', 'frostbite', 'queue', 'o2leak'];
const POOL_HAZ = ['snowbridge', 'rockfall', 'icefall', 'avalanche', 'ropes', 'cornice'];
const POOL_CAMP = ['expedition', 'sherpaTea', 'raven', 'tent'];
const POOL_DESC = ['glissade', 'tired', 'whiteout', 'frostbite', 'ropes', 'raven'];

function pickEvent(pool) {
  const alt = curAlt();
  const ok = pool.filter(id => { const e = EV[id]; return (e.min || 0) <= alt && alt <= (e.max || 99999) && (!e.cond || e.cond()); });
  if (!ok.length) return null;
  const fresh = ok.filter(id => !g.seen[id]);
  return pick(fresh.length ? fresh : ok);
}
function arrivalEvent(n) {
  switch (n.type) {
    case 'bridge': return 'yak';
    case 'teahouse': return 'teahouse';
    case 'bc': return g.packed ? null : 'puja';
    case 'summit': g.summited = true; return 'summit';
    case 'cache': return 'cache';
    case 'view': return 'view';
    case 'hazard': return pickEvent(POOL_HAZ) || pickEvent(POOL_EVENT);
    case 'event': return pickEvent(POOL_EVENT) || pickEvent(POOL_HAZ);
    case 'camp': return rnd() < .3 ? pickEvent(POOL_CAMP) : null;
  }
  return null;
}
function openEvent(id) {
  g.seen[id] = true;
  const m = pick(g.team);
  const sh = sherpaOf();
  g.pending = { id, m: m ? m.name : null, s: sh ? sh.name : null, result: null };
}
function ctx() {
  const m = g.team.find(x => x.name === g.pending.m) || g.team[0] || { name: g.pending.m, hp: 0, max: 1 };
  return { m, s: g.pending.s };
}
function choose(i) {
  const p = g.pending; if (!p || p.result) return;
  const ev = EV[p.id], c = ctx(), ch = ev.choices(c)[i];
  if (!ch || (ch.req && !ch.req())) return;
  const o = [];
  ch.fx(c, o);
  if (POOL_HAZ.includes(p.id)) g.warned = false;
  checkLosses(o);
  normalize();
  p.result = o;
  save(); render();
}
function closeEvent() {
  const p = g.pending; if (!p) return;
  const ev = EV[p.id];
  (p.result || []).slice().reverse().forEach(s => log(s));
  g.pending = null;
  if (!g.team.length) { endRun(false, 'Your whole team had to turn back.'); return; }
  if (ev.after) ev.after();
  save(); render();
}

/* ================= pack ================= */
function fitPack() {
  const c = 40 + 10 * count('sherpa');
  const p = ui.pack;
  while (p.food + p.fuel + 2 * p.o2 > c) { if (p.food > 10) p.food--; else if (p.fuel > 6) p.fuel--; else p.o2--; }
}
function packAdj(res, d) {
  const p = ui.pack, c = cap();
  const next = Object.assign({}, p, { [res]: Math.max(0, p[res] + d) });
  if (next.food + next.fuel + 2 * next.o2 > c) return;
  ui.pack = next; render();
}
function finishPack() {
  g.food = ui.pack.food; g.fuel = ui.pack.fuel; g.o2 = ui.pack.o2;
  g.packed = true;
  log(`🎒 Packed: ${g.food} 🍚, ${g.fuel} 🔥, ${g.o2} 🫁. The real climb begins.`);
  ui.screen = 'game'; save(); render();
}

/* ================= end ================= */
function calcScore(win) {
  if (!g.summited) return Math.round(g.maxAlt / 10);
  let s = 1000 + Math.round(g.peak.alt / 10) + g.team.length * 250 + g.photos * 100 + Math.max(0, 40 - g.day) * 15;
  if (!win) s = Math.round(s / 2);
  return s;
}
function endRun(win, reason) {
  const score = calcScore(win);
  if (win) meta.summits++;
  const best = score > meta.best;
  meta.best = Math.max(meta.best, score);
  store.set('summit_meta', meta);
  store.del('summit_run');
  ui.end = { win, reason, score, best, summited: g.summited, days: g.day, photos: g.photos, team: g.team.map(m => m.name), lost: g.lost.slice(), peak: g.peak, maxAlt: g.maxAlt };
  ui.screen = 'end';
  render();
}

function showHelp() {
  showModal(`<div class="help"><div class="ico">🏔️</div><h2>How to climb</h2>
  <p>Lead 3 climbers to the summit <b>and back down to Base Camp</b>. Every action takes one day.</p>
  <h3>⬆️ Climb</h3><p>Tap a glowing spot on the map. Costs ⚡ energy, more when it's windy 🌬️ or stormy 🌨️. Storms can hurt your team.</p>
  <h3>😴 Rest</h3><p>Recovers ⚡ and HP. Much better at camps than on a ledge.</p>
  <h3>🔁 Acclimatize</h3><p>At camps only. Climb high, sleep low: your body adapts. If you're more than 300 m above your acclimatization, everyone loses HP each day.</p>
  <h3>🎒 Supplies</h3><p>Above Base Camp you eat 1 🍚 a day. Above 6500 m you need 1 🔥 a day to melt snow. Above 7500 m (the death zone) you need 1 🫁 oxygen a day. Running out hurts.</p>
  <h3>🌤️ Forecast</h3><p>The 3-day forecast at the top gets less reliable the further ahead it looks.</p>
  <h3>🏆 Score</h3><p>Summit + peak height + survivors + photos + speed. Climbers at 0 HP have to turn back.</p></div>
  <button class="big" onclick="hideModal()">Got it</button>`);
}
function showMenu() {
  showModal(`<div class="ico">☰</div><h2>Menu</h2>
    <button class="choice" onclick="showHelp()">How to play</button>
    <button class="choice" onclick="abandon()">Turn back (end run)</button>
    <button class="choice" onclick="hideModal()">Close</button>`);
}

/* ================= rendering ================= */
const $app = document.getElementById('app');
function bar(v, max, color) { return `<div class="bar"><i style="width:${clamp(v / max * 100, 0, 100)}%;background:${color}"></i></div>`; }
function hpColor(f) { return f > .6 ? 'var(--good)' : f > .3 ? 'var(--warn)' : 'var(--bad)'; }

function mountainSVG() {
  return `<svg viewBox="0 0 360 200" style="width:100%;max-width:420px;margin:0 auto 10px;display:block">
    <defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a5680"/><stop offset="1" stop-color="#16233a"/></linearGradient></defs>
    <polygon points="0,200 80,110 120,135 190,40 250,105 290,85 360,200" fill="url(#mg)"/>
    <polygon points="170,72 190,40 210,72 199,66 190,78 181,66" fill="#eaf1f8"/>
    <polygon points="275,100 290,85 304,104 293,99 285,106" fill="#eaf1f8"/>
    <polygon points="68,124 80,110 92,126 84,122 76,128" fill="#eaf1f8"/>
    <line x1="190" y1="40" x2="190" y2="12" stroke="#eaf1f8" stroke-width="2.5"/>
    <polygon points="191,12 214,19 191,26" fill="#ff8a3d"/></svg>`;
}

function renderTitle() {
  const saved = store.get('summit_run', null);
  $app.innerHTML = `<div class="title">${mountainSVG()}
    <h1>SUMMIT</h1><div class="tag">Reach the top. Get back down.</div>
    ${saved && saved.v === 1 ? `<button class="big" onclick="resume()">Continue expedition · Day ${saved.day}</button><button class="ghost" onclick="newExpedition()">New expedition</button>` : `<button class="big" onclick="newExpedition()">New expedition</button>`}
    <button class="ghost" onclick="showHelp()">How to play</button>
    <div class="stats"><div><b>${meta.runs}</b>expeditions</div><div><b>${meta.summits}</b>summits</div><div><b>${meta.best}</b>best score</div></div>
  </div>`;
}
function resume() { g = store.get('summit_run', null); if (!g) return; ui.screen = g.packed || g.pending ? 'game' : (curNode().type === 'bc' ? 'pack' : 'game'); lastScrollPos = -1; render(); }

function renderTeam() {
  $app.innerHTML = `<div class="scroll pad">
    <h1>Choose your team</h1>
    <div class="obj">Objective: <b>${ui.peak.name}</b>, ${ui.peak.alt} m<div class="small">Pick 3 climbers. A Sherpa is always a good idea.</div></div>
    ${ui.cands.map((c, i) => `<button class="cand ${ui.sel.includes(i) ? 'sel' : ''}" onclick="toggleCand(${i})">
      <div class="ci">${ROLES[c.role].icon}</div>
      <div style="flex:1"><b>${c.name}</b> · ${ROLES[c.role].name}<div class="small">${ROLES[c.role].desc}</div>
      ${c.trait ? `<div class="trait">${TRAITS[c.trait].name}: ${TRAITS[c.trait].desc}</div>` : ''}</div></button>`).join('')}
    <button class="big" ${ui.sel.length !== 3 ? 'disabled' : ''} onclick="startRun()">${ui.sel.length === 3 ? 'Start the trek →' : `Pick ${3 - ui.sel.length} more`}</button>
    <button class="ghost" onclick="ui.screen='title';render()">Back</button>
  </div>`;
}

function renderPack() {
  const p = ui.pack, c = cap(), l = p.food + p.fuel + 2 * p.o2;
  const row = (res, icon, name, note) => `<div class="packrow"><div style="font-size:28px">${icon}</div>
    <div class="lbl"><b>${name}</b><div class="small">${note}</div></div>
    <button class="step" onclick="packAdj('${res}',-1)">−</button><div class="qty">${p[res]}</div><button class="step" onclick="packAdj('${res}',1)" ${l + (res === 'o2' ? 2 : 1) > c ? 'disabled' : ''}>+</button></div>`;
  $app.innerHTML = `<div class="scroll pad">
    <h1>Pack for the climb</h1>
    <p class="small" style="margin-top:6px">Base Camp is the last place to stock up. Everything above it comes out of your packs.</p>
    <div style="margin:14px 0 4px;display:flex;justify-content:space-between"><b>Weight</b><span>${l} / ${c} kg</span></div>
    ${bar(l, c, l >= c ? 'var(--acc)' : 'var(--good)')}
    ${row('food', '🍚', 'Food', '1 per day above Base Camp · 1 kg')}
    ${row('fuel', '🔥', 'Fuel', '1 per day above 6500 m · 1 kg')}
    ${row('o2', '🫁', 'Oxygen', '1 per day above 7500 m · 2 kg')}
    <p class="small" style="margin-top:14px">${count('sherpa') ? `Your Sherpa adds +10 kg of capacity.` : 'No Sherpa: you only have 40 kg of capacity. Tough.'} Supplies can also be found (or lost) on the mountain.</p>
    <button class="big" onclick="finishPack()">Start climbing →</button>
  </div>`;
}

function renderMap() {
  const W = 360, RH = 66, top = 44, rows = g.rows.length, H = top + rows * RH;
  const y = r => top + (rows - 1 - r) * RH + RH / 2;
  const xx = n => 40 + n.x * (W - 80);
  const cur = curNode();
  const reach = g.phase === 'climb' && !g.pending ? cur.out : [];
  const onPath = new Set();
  for (let i = 1; i < g.path.length; i++) onPath.add(g.path[i - 1] + '-' + g.path[i]);
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="bgm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e4468"/><stop offset=".55" stop-color="#1b2a42"/><stop offset="1" stop-color="#121c2c"/></linearGradient></defs>
    <polygon points="0,${H} 0,${H * .62} 40,${H * .55} 70,${H * .38} 110,${H * .3} 150,${top * .5} ${W / 2},6 210,${top * .6} 250,${H * .26} 290,${H * .4} 330,${H * .5} ${W},${H * .58} ${W},${H}" fill="url(#bgm)" opacity=".85"/>`;
  // row labels
  g.rows.forEach((row, r) => {
    s += `<text x="6" y="${y(r) + 4}" font-size="10" fill="#8ea3bd">${row.alt}</text>`;
    if (row.name && row.kind !== 'summit') s += `<text x="${W - 6}" y="${y(r) + 4}" font-size="10.5" fill="#cfdbe8" text-anchor="end">${row.name}</text>`;
  });
  // edges
  g.nodes.forEach(a => a.out.forEach(bid => {
    const b = g.nodes[bid], walked = onPath.has(a.id + '-' + bid), next = a.id === cur.id && reach.includes(bid);
    s += `<line x1="${xx(a)}" y1="${y(a.r)}" x2="${xx(b)}" y2="${y(b.r)}" stroke="${walked ? '#ff8a3d' : next ? '#ffd2b0' : '#5b7091'}" stroke-width="${walked ? 3.5 : next ? 2.5 : 1.5}" ${walked || next ? '' : 'stroke-dasharray="4 5"'} opacity="${walked || next ? 1 : .6}"/>`;
  }));
  // nodes
  g.nodes.forEach(n => {
    const can = reach.includes(n.id), here = n.id === cur.id, visited = g.path.includes(n.id);
    const r = n.type === 'summit' ? 19 : n.camp ? 17 : 15;
    s += `<g class="node ${can ? 'can' : ''}" ${can ? `onclick="tryClimb(${n.id})"` : ''}>
      <circle class="bg" cx="${xx(n)}" cy="${y(n.r)}" r="${r + 7}" fill="transparent" stroke="none"/>
      <circle class="bg" cx="${xx(n)}" cy="${y(n.r)}" r="${r}" fill="${here ? '#eaf1f8' : visited ? '#3b4f70' : '#1c2b40'}" stroke="${here ? '#ff8a3d' : '#5b7091'}" stroke-width="${here ? 3 : 1.5}"/>
      <text x="${xx(n)}" y="${y(n.r) + 6}" font-size="${r}" text-anchor="middle">${TYPE[n.type].i}</text></g>`;
    if (here) s += `<text x="${xx(n) + r + 4}" y="${y(n.r) - r + 6}" font-size="18">🧗</text>`;
  });
  return s + '</svg>';
}

function tryClimb(id) {
  const n = g.nodes[id], cost = climbCost(n.alt);
  if (g.energy < cost) { flashHint(`Too tired: need ${cost} ⚡. Rest first.`); return; }
  climb(id);
}
function flashHint(t) { const h = document.getElementById('hint'); if (h) { h.textContent = t; h.style.color = 'var(--bad)'; } }

function renderGame() {
  const n = curNode(), alt = n.alt, w = g.weather[g.day];
  const fc = [1, 2, 3].map(forecast);
  const accDiff = alt - g.acclim;
  const accCls = accDiff > 600 ? 'bad' : accDiff > 300 ? 'warn' : '';
  const low = (v, need) => v <= need ? 'low' : '';
  const supplied = !g.packed;
  let actions = '';
  if (g.phase === 'climb') {
    const chips = n.out.map(id => {
      const t = g.nodes[id], cost = climbCost(t.alt);
      return `<button class="act go" ${g.energy < cost ? 'disabled' : ''} onclick="tryClimb(${id})">⬆️ ${TYPE[t.type].i} ${nodeName(t)}<small>${t.alt} m · ⚡${cost}</small></button>`;
    }).join('');
    actions = `<div class="arow">${chips}</div>
      <div class="arow"><button class="act" onclick="rest()">😴 Rest<small>${n.camp ? 'at camp' : 'bivouac'}</small></button>
      <button class="act" ${!n.camp || g.energy < 15 ? 'disabled' : ''} onclick="acclimatize()">🔁 Acclimatize<small>${n.camp ? '⚡15' : 'camps only'}</small></button></div>`;
  } else {
    const t = g.nodes[g.descStops[g.descIdx]], cost = descentCost();
    actions = `<div class="arow"><button class="act go" ${g.energy < cost ? 'disabled' : ''} onclick="descend()">⬇️ Descend to ${nodeName(t)}<small>${t.alt} m · ⚡${cost}</small></button></div>
      <div class="arow"><button class="act" onclick="rest()">😴 Rest<small>${n.camp ? 'at camp' : 'bivouac'}</small></button></div>`;
  }
  const hint = g.phase === 'descent' ? 'Get everyone back to Base Camp.' : (g.energy < Math.min(...n.out.map(id => climbCost(g.nodes[id].alt))) ? 'Too tired to climb. Rest first.' : 'Pick a route on the map or below.');
  $app.innerHTML = `
  <div class="hud">
    <div class="hrow"><span class="day">Day ${g.day}</span><span class="alt">${alt} m</span>
      <span class="wx"><span class="now" title="${WX[w].n}">${WX[w].i}</span><span class="fc">${fc.map(f => WX[f].i).join(' ')}</span></span>
      <button class="menu" onclick="showMenu()">☰</button></div>
    <div class="ebar">⚡ ${bar(g.energy, 100, g.energy < 25 ? 'var(--bad)' : 'var(--blue)')} <b>${g.energy}</b></div>
    <div class="res">
      <span class="${supplied ? '' : low(g.food, 3)}">🍚 ${supplied ? '–' : g.food}</span>
      <span class="${supplied ? '' : low(g.fuel, 2)}">🔥 ${supplied ? '–' : g.fuel}</span>
      <span class="${supplied ? '' : low(g.o2, 1)}">🫁 ${supplied ? '–' : g.o2}</span>
      <span class="${low(g.morale, 25)}">${g.morale >= 60 ? '😄' : g.morale >= 30 ? '🙂' : '😟'} ${g.morale}</span>
      <span>📷 ${g.photos}</span>
    </div>
    <div class="acc ${accCls}">Acclimatized to ${g.acclim} m${accDiff > 300 ? ` · ${accDiff} m above it!` : ''}${alt >= 7500 ? ' · ☠️ death zone' : ''}</div>
  </div>
  <div class="team">${g.team.map(m => `<div class="mem"><div class="n">${ROLES[m.role].icon} ${m.name}</div>${bar(m.hp, m.max, hpColor(m.hp / m.max))}<div class="small" style="font-size:10.5px;margin-top:2px">${Math.max(0, m.hp)}/${m.max}${m.trait ? ' · ' + TRAITS[m.trait].name : ''}</div></div>`).join('')}</div>
  <div class="mapwrap" id="mapwrap">${renderMap()}</div>
  <div class="log">${g.log.slice(0, 3).map(l => `<div>${l}</div>`).join('')}</div>
  <div class="actions"><div class="hint" id="hint">${hint}</div>${actions}</div>`;
  // scroll map to current position
  const wrap = document.getElementById('mapwrap');
  const rows = g.rows.length, RH = 66, top = 44;
  const svgH = top + rows * RH;
  const scale = wrap.clientWidth / 360;
  const yy = (top + (rows - 1 - n.r) * RH + RH / 2) * scale;
  wrap.scrollTop = Math.max(0, yy - wrap.clientHeight * .6);
}

function renderEvent() {
  const p = g.pending, ev = EV[p.id], c = ctx();
  let html = `<div class="ico">${ev.icon}</div><h2>${ev.title}</h2><p>${ev.text(c)}</p>`;
  if (!p.result) {
    html += ev.choices(c).map((ch, i) => {
      const ok = !ch.req || ch.req();
      return `<button class="choice" ${ok ? '' : 'disabled'} onclick="choose(${i})">${ch.t}${(ok ? ch.s : (ch.rt || ch.s)) ? `<small>${ok ? ch.s : (ch.rt || 'Not possible')}</small>` : ''}</button>`;
    }).join('');
  } else {
    html += `<div class="result">${p.result.map(r => `<div>${r}</div>`).join('')}</div><button class="big" onclick="closeEvent()">Continue</button>`;
  }
  const ov = document.getElementById('ov');
  ov.innerHTML = `<div class="card">${html}</div>`;
  ov.classList.remove('hidden');
}

function renderEnd() {
  const e = ui.end;
  const head = e.win ? { i: '🏆', t: 'Expedition complete!' } : e.summited ? { i: '🚩', t: 'Summited, but…' } : { i: '🏳️', t: 'Expedition over' };
  $app.innerHTML = `<div class="scroll pad" style="display:flex;flex-direction:column;justify-content:center">
    <div style="font-size:64px;text-align:center">${head.i}</div>
    <h1 style="text-align:center;margin:8px 0">${head.t}</h1>
    <p class="small" style="text-align:center">${e.win ? `You stood on top of ${e.peak.name} (${e.peak.alt} m) and brought ${e.team.length} climber${e.team.length === 1 ? '' : 's'} home in ${e.days} days.` : (e.reason || '') + ` Highest point: ${e.maxAlt} m.`}</p>
    <div class="score">${e.score}</div>
    <div class="small" style="text-align:center">${e.best ? '🎉 New best score!' : `Best: ${meta.best}`}</div>
    <div class="obj"><div class="small">📷 Photos: ${e.photos} · 📅 Days: ${e.days}</div>
      ${e.team.length ? `<div class="small">Made it: ${e.team.join(', ')}</div>` : ''}
      ${e.lost.length ? `<div class="small">Turned back: ${e.lost.join(', ')}</div>` : ''}</div>
    <button class="big" onclick="newExpedition()">New expedition</button>
    <button class="ghost" onclick="ui.screen='title';render()">Main menu</button>
  </div>`;
}

function render() {
  const ov = document.getElementById('ov');
  if (!modalOpen) { ov.classList.add('hidden'); ov.innerHTML = ''; }
  if (ui.screen === 'title') renderTitle();
  else if (ui.screen === 'team') renderTeam();
  else if (ui.screen === 'pack') renderPack();
  else if (ui.screen === 'end') renderEnd();
  else if (ui.screen === 'game') { renderGame(); if (g.pending && !modalOpen) renderEvent(); }
}

render();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
