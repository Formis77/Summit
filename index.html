<script>
'use strict';
// =====================================================================
//  RESONANCE . World I: The Whispering Falls
// =====================================================================
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
const BOWL_F0=392.00;
const OVERTONE=2.71;
const bowlFreq=lv=>BOWL_F0*(1-0.4*Math.pow(lv,1.3));
const levelFor=f=>Math.pow(Math.max(0,(1-f/BOWL_F0)/0.4),1/1.3);
const NOTE_F={B3:246.94,D4:293.66,E4:329.63,G4:392.00,E5:659.26,G5:783.99,A5:880.00,B5:987.77};
const NOTE_COL={B3:'#e0763a',D4:'#e5c13c',E4:'#5fb36b',G4:'#4aa3d8',E5:'#d4568f',G5:'#8b6fd6',A5:'#5a6fd0',B5:'#c9a0e6'};
const RANGE=2.5;
// a stone's note can be sung with the bowl's fundamental, or (fast circling) with its overtone
function stoneNeeds(note){
  const f=NOTE_F[note];
  if(f<=BOWL_F0+0.01)return{mode:0,w:levelFor(f)};
  return{mode:1,w:levelFor(f/OVERTONE)};
}
function rotArm(r,k){return r.arms.map(([dx,dy])=>k?[r.pivot[0]-dy,r.pivot[1]+dx]:[r.pivot[0]+dx,r.pivot[1]+dy]);}
function parseWorld(L){
  const w=L.map[0].length,h=L.map.length;const base=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const c=L.map[y][x];base.push(c==='.'?-99:parseInt(c,36));}
  const idx=(x,y)=>y*w+x;
  const movers=(L.movers||[]).map((m,i)=>Object.assign({bit:i},m));
  const rots=(L.rotators||[]).map((r,i)=>Object.assign({bit:i},r));
  const stones=(L.stones||[]).map((s,i)=>Object.assign({i},s,stoneNeeds(s.note),{f:NOTE_F[s.note],col:NOTE_COL[s.note]}));
  const springs=new Set((L.springs||[]).map(([x,y])=>idx(x,y)));
  return{...L,w,h,base,idx,movers,rots,stones,springs,stoneAt:new Set(stones.map(s=>idx(s.x,s.y))),stairs:new Set((L.stairs||[]).map(([x,y])=>idx(x,y)))};
}
// st = {m: mover bits, r: rotator bits}
function heightAt(G,st,x,y){
  if(x<0||y<0||x>=G.w||y>=G.h)return -99;
  for(const m of G.movers)if(m.x===x&&m.y===y)return m.h[(st.m>>m.bit)&1];
  for(const r of G.rots){const k=(st.r>>r.bit)&1;for(const [ax,ay] of rotArm(r,k))if(ax===x&&ay===y)return r.h;}
  return G.base[G.idx(x,y)];
}
function walkable(G,st,x,y){const i=G.idx(x,y);return heightAt(G,st,x,y)>-50&&!G.stoneAt.has(i)&&!G.springs.has(i);}
function canStep(G,st,ax,ay,bx,by){
  if(bx<0||by<0||bx>=G.w||by>=G.h||!walkable(G,st,bx,by))return false;
  const a=heightAt(G,st,ax,ay),b=heightAt(G,st,bx,by);
  if(Math.abs(a-b)<0.01)return true;
  return Math.abs(Math.abs(a-b)-1)<0.01&&(G.stairs.has(G.idx(ax,ay))||G.stairs.has(G.idx(bx,by)));
}
function nearSpring(G,st,x,y){
  const h=heightAt(G,st,x,y);
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=G.w||ny>=G.h)continue;
    if(G.springs.has(G.idx(nx,ny))&&Math.abs(G.base[G.idx(nx,ny)]-h)<=1)return true;}
  return false;
}
function stoneHears(G,st,s,x,y){
  const dz=(heightAt(G,st,x,y)-G.base[G.idx(s.x,s.y)]);
  return Math.hypot(x-s.x,y-s.y,dz*0.5)<=RANGE;
}
// apply a stone's answer; returns new structure state and the wanderer's new position (riding)
function applyStone(G,st,s,px,py){
  let m=st.m,r=st.r;let nx=px,ny=py;
  for(const id of s.acts||[]){
    const mv=G.movers.find(o=>o.id===id);if(mv){m^=1<<mv.bit;continue;}
    const ro=G.rots.find(o=>o.id===id);if(ro){
      const k=(r>>ro.bit)&1;const before=rotArm(ro,k),after=rotArm(ro,1-k);
      for(let i=0;i<before.length;i++)if(before[i][0]===px&&before[i][1]===py){nx=after[i][0];ny=after[i][1];}
      r^=1<<ro.bit;}
  }
  return{st:{m,r},x:nx,y:ny};
}
const WORLD={
  name:'The Whispering Falls',
  map:['c..d8c.9.b',
       '.b8888.85.',
       '7.a8.5.4..',
       '..8.555..6',
       '..........',
       '...55.55..',
       '.7........',
       '.5....5..5',
       '.5..5555..',
       '3......5..',
       '.1....15..',
       '1111.1111.'],
  stairs:[[7,1]],
  springs:[[6,10],[1,7],[3,1]],
  movers:[{id:'M1',x:4,y:11,h:[-3,1]},{id:'L1',x:7,y:11,h:[1,5]},
          {id:'B1',x:5,y:5,h:[5,-3]},{id:'B2',x:6,y:4,h:[-3,5]},
          {id:'L2',x:5,y:2,h:[5,8]},{id:'M3',x:6,y:1,h:[-3,8]}],
  rotators:[{id:'R1',pivot:[4,8],h:5,arms:[[-1,0],[-2,0]]}],
  stones:[{x:1,y:10,note:'G4',acts:['M1']},
          {x:8,y:11,note:'D4',acts:['L1']},
          {x:6,y:7,note:'E5',acts:['R1']},
          {x:3,y:5,note:'D4',acts:['B1','B2']},
          {x:7,y:5,note:'B3',acts:['B2']},
          {x:4,y:3,note:'G5',acts:['L2']},
          {x:4,y:0,note:'E4',phrase:1},
          {x:2,y:1,note:'E5',phrase:2},
          {x:3,y:2,note:'A5',phrase:3,acts:['M3']}],
  rooms:[{name:'The Listening Stone',at:[0,11]},{name:'The Basin',at:[5,11]},{name:'The Higher Voice',at:[7,9]},
         {name:'Two Bridges',at:[4,5]},{name:'The Lift',at:[6,3]},{name:'Three Voices',at:[5,1]}],
  trees:[[2,3],[1,6],[0,2],[2,2],[9,0]],
  start:[0,11],goal:[7,0],
};
const TOL=22;              // cents
const PHRASE_WINDOW=25;    // seconds between phrase notes
const cents=(f,t)=>1200*Math.log2(f/t);

// ---------- look ----------
const PAL={sky:['#e3e9e3','#c3cbc4'],fog:'#cfd6cf',top:'#b5c548',topDark:'#97a83a',lip:'#a9bb3f',
  left:'#6c6178',leftDark:'#5a5066',right:'#b3b1ab',rightDark:'#9c9a94',stone:'#d9d6cf',water:'#bcd6d4',sheet:'36,42,42',rain:.2};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixc=(a,b,t)=>{const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`;};
const rgba=(h,a)=>{const A=hex(h);return `rgba(${A[0]},${A[1]},${A[2]},${a})`;};
const hash=(x,y)=>{let h=x*374761393+y*668265263;h=(h^(h>>13))*1274126177;return ((h^(h>>16))>>>0)/4294967295;};

// ---------- save ----------
let save={sound:true,guide:true,cp:null};
try{const s=JSON.parse(localStorage.getItem('resonance-w1')||'null');if(s)save=Object.assign(save,s);}catch(e){}
const persist=()=>{try{localStorage.setItem('resonance-w1',JSON.stringify(save));}catch(e){}};

// =====================================================================
//  WORLD STATE
// =====================================================================
const G=parseWorld(WORLD);
let ST={m:0,r:0};                                   // structure state (logic)
const mDisp=G.movers.map(m=>m.h[0]);                // animated mover heights
const rDisp=G.rots.map(()=>0);                      // animated rotator turn (0..1)
let trav,levelT=0,won=null,ripples=[],room=0,roomTitle=null,phrase={prog:0,t:0},deadEnd=false,deadCheckT=0;
function moverAt(x,y){return G.movers.find(m=>m.x===x&&m.y===y);}
function dispH(x,y){if(x<0||y<0||x>=G.w||y>=G.h)return -99;const m=moverAt(x,y);if(m)return mDisp[m.bit];return G.base[G.idx(x,y)];}
function logicH(x,y){return heightAt(G,ST,x,y);}
function settled(){return G.movers.every(m=>Math.abs(mDisp[m.bit]-m.h[(ST.m>>m.bit)&1])<0.01)&&G.rots.every(r=>Math.abs(rDisp[r.bit]-((ST.r>>r.bit)&1))<0.001);}
function resetWorld(cp){
  ST={m:cp?cp.m:0,r:cp?cp.r:0};
  G.movers.forEach(m=>mDisp[m.bit]=m.h[(ST.m>>m.bit)&1]);G.rots.forEach(r=>rDisp[r.bit]=(ST.r>>r.bit)&1);
  const x=cp?cp.x:G.start[0],y=cp?cp.y:G.start[1];
  trav={x,y,fx:x,fy:y,fz:logicH(x,y),path:[],t:0,step:0,ride:null};
  bowlState.level=cp?cp.w:0;bowlState.A0=bowlState.A1=0;
  room=cp?cp.room:0;won=null;phrase={prog:0,t:0};deadEnd=false;
  G.stones.forEach(s=>{s.progress=0;s.armed=true;s.glow=0;s.uses=0;s.inTune=false;s.hears=false;s.c=999;s.offT=0;s.ringT=0;});
  cam.snap=true;
}
function checkpoint(){save.cp={x:trav.x,y:trav.y,m:ST.m,r:ST.r,w:bowlState.level,room};persist();}
function findPath(tx,ty){
  const s=G.idx(trav.x,trav.y),t=G.idx(tx,ty);const prev=new Map([[s,-1]]);const q=[[trav.x,trav.y]];
  while(q.length){const [x,y]=q.shift();if(G.idx(x,y)===t)break;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(!canStep(G,ST,x,y,nx,ny))continue;const k=G.idx(nx,ny);if(prev.has(k))continue;prev.set(k,G.idx(x,y));q.push([nx,ny]);}}
  if(!prev.has(t))return null;const path=[];let k=t;while(k!==s){path.push([k%G.w,Math.floor(k/G.w)]);k=prev.get(k);}return path.reverse();
}
// can the world still be finished from here? (catches dead ends, offers a return)
function canFinish(){
  const start={x:trav.x,y:trav.y,m:ST.m,r:ST.r,w:+bowlState.level.toFixed(3),p:0};
  const key=s=>`${s.x},${s.y},${s.m},${s.r},${s.w},${s.p}`;const seen=new Set([key(start)]);const q=[start];let n=0;
  while(q.length&&n<40000){const s=q.shift();n++;if(s.x===G.goal[0]&&s.y===G.goal[1])return true;const st={m:s.m,r:s.r};const nx=[];
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])if(canStep(G,st,s.x,s.y,s.x+dx,s.y+dy))nx.push({...s,x:s.x+dx,y:s.y+dy});
    const sp=nearSpring(G,st,s.x,s.y);if(sp&&s.w<1)nx.push({...s,w:1});
    for(const sn of G.stones){if(!stoneHears(G,st,sn,s.x,s.y))continue;const w=+sn.w.toFixed(3);if(!(w<=s.w+0.02||sp))continue;
      let p=s.p,acts=!sn.phrase;if(sn.phrase){if(sn.phrase===s.p+1){p=sn.phrase;if(sn.acts)acts=true;}else p=sn.phrase===1?1:0;}
      let ns={...s,w,p};if(acts){const r=applyStone(G,st,sn,s.x,s.y);ns={...ns,m:r.st.m,r:r.st.r,x:r.x,y:r.y};}nx.push(ns);}
    for(const n2 of nx){const k=key(n2);if(!seen.has(k)){seen.add(k);q.push(n2);}}}
  return n>=40000;
}

// =====================================================================
//  CANVAS, CAMERA, PROJECTION
// =====================================================================
const cv=$('c'),ctx=cv.getContext('2d');
let W,H,DPR,A,B,HU,baseA,SAFE_B=0,SAFE_T=0,FONT='Georgia,serif',bgCache=null;
const cam={x:0,y:0,px:0,py:0,zoom:1,zoomT:1,over:false,snap:true};
function P(gx,gy,gz){return[W/2+(gx-gy)*A-cam.x,H*0.5+(gx+gy)*B-gz*HU-cam.y];}
function layout(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  W=document.documentElement.clientWidth||innerWidth;
  H=Math.max(innerHeight,document.documentElement.clientHeight||0,cv.getBoundingClientRect().height||0);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  SAFE_B=$('sab').getBoundingClientRect().height||0;SAFE_T=$('sat').getBoundingClientRect().height||0;FONT=getComputedStyle(document.body).fontFamily;
  baseA=clamp(W/10.2,30,56);bgCache=null;
}
addEventListener('resize',layout);
function overviewZoom(){
  // fit the whole world on screen
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(let y=0;y<G.h;y++)for(let x=0;x<G.w;x++){const h=G.base[G.idx(x,y)];if(h<-50)continue;const sx=(x-y),sy=(x+y)*0.5774-h*1.1547;x0=Math.min(x0,sx-1);x1=Math.max(x1,sx+1);y0=Math.min(y0,sy-1.2);y1=Math.max(y1,sy+1);}
  const z=Math.min(W*0.92/((x1-x0)*baseA),(H*0.8)/((y1-y0+3)*baseA));
  return{z,cx:(x0+x1)/2,cy:(y0+y1)/2};
}
function updateCamera(dt){
  const ov=overviewZoom();
  cam.zoomT=cam.over?ov.z:1;cam.zoom+= (cam.zoomT-cam.zoom)*Math.min(1,dt*4);
  A=baseA*cam.zoom;B=A*0.5774;HU=A*1.1547;
  let tx,ty;
  if(cam.over){tx=ov.cx*A;ty=ov.cy*A+H*0.04;}
  else{
    const rx=(trav.fx-trav.fy)*A,ry=(trav.fx+trav.fy)*B-trav.fz*HU;
    const anchor=sheetOpen?H*0.27:H*0.5;
    tx=rx+cam.px;ty=ry-(anchor-H*0.5)+cam.py-HU*0.6;
  }
  if(cam.snap){cam.x=tx;cam.y=ty;cam.snap=false;}
  const k=Math.min(1,dt*(dragPan?20:3.2));cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;
}

// =====================================================================
//  AUDIO
// =====================================================================
let AC=null,master,revIn,padBus,amb={},BV=null,falls=[];
function makeIR(sec){const len=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);let lp=0;for(let i=0;i<len;i++){const n=Math.random()*2-1;lp=lp*0.6+n*0.4;d[i]=lp*Math.pow(1-i/len,2.4)*(i<AC.sampleRate*0.012?i/(AC.sampleRate*0.012):1);}}return b;}
function noiseBuf(kind){const len=AC.sampleRate*4,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);let l=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;if(kind==='brown'){l=(l+0.02*w)/1.02;d[i]=l*3.5;}else d[i]=w;}return b;}
function route(node,dry,wet,pan){let n=node;if(pan!=null&&AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=pan;node.connect(p);n=p;}
  const g1=AC.createGain();g1.gain.value=dry;n.connect(g1);g1.connect(master);const g2=AC.createGain();g2.gain.value=wet;n.connect(g2);g2.connect(revIn);return n;}
function loopNoise(kind){const s=AC.createBufferSource();s.buffer=kind==='brown'?AC._brown:AC._white;s.loop=true;s.start(0,Math.random()*3);return s;}
function initAudio(){
  if(AC){if(AC.state!=='running')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;comp.attack.value=0.01;comp.release.value=0.3;comp.connect(AC.destination);
  master=AC.createGain();master.gain.value=save.sound?0.95:0;master.connect(comp);
  const rev=AC.createConvolver();rev.buffer=makeIR(5.5);revIn=AC.createGain();revIn.gain.value=0.85;revIn.connect(rev);
  const rhp=AC.createBiquadFilter();rhp.type='highpass';rhp.frequency.value=150;const rg=AC.createGain();rg.gain.value=0.5;rev.connect(rhp);rhp.connect(rg);rg.connect(master);

    const d0=smooth(0.15,0.45,b.speed)*(1-smooth(1.0,1.15,b.speed));
    const d1=smooth(1.1,1.3,b.speed)*(1-smooth(3.8,4.4,b.speed));

function updateStones(dt){
  const b=bowlState;let near=null,nd=1e9;const busyNow=!settled()||trav.path.length;

  if(spring){ctx.strokeStyle='rgba(190,230,245,.9)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x-5,y0-8);ctx.lineTo(x,y0-13);ctx.lineTo(x+5,y0-8);ctx.stroke();}
}
function drawSheetHint(){const s=sheetHint();if(!s)return;ctx.fillStyle='rgba(255,255,255,.9)';ctx.textAlign='center';ctx.font='italic 15px '+FONT;wrapText(s,W/2,H-20-SAFE_B,W-100,19);}
function wrapText(s,x,y,maxW,lh){const words=s.split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}lines.push(cur);lines.forEach((l,i)=>ctx.fillText(l,x,y-(lines.length-1-i)*lh));}

// =====================================================================
//  HINTS (gentle, never the solution)
// =====================================================================
let hintState={};
function sheetHint(){
  const b=bowlState,s=tuneInfo;
  if(b.blocked>0)return'There is no spring here. Water can only be poured out';
  if(!hintState.sang)return'Circle the rim slowly and steadily, like stirring tea';
  if(b.chatter>0.3)return'Too fast. The stick is chattering';
  if(!s)return lastAnswer&&levelT-lastAnswer.t<4?'Close the bowl and walk on':'Walk closer to a stone. Its hum will guide you';
  if(s.phrase&&!hintState.phrase)return'These three must hear you in order, one after another';
  if(!s.armed)return'The stone answered. Let the bowl fall quiet before singing to it again';
  if(s.inTune)return'Hold it… let the stone join in';
  if(s.mode&&b.voice===0&&b.Asound>0.3)return hintState.high?'This stone wants the high voice. Circle fast':'This stone sings above your bowl. Circle fast to wake its high voice';
  if(!s.mode&&b.voice===1&&b.Asound>0.3)return'This stone wants the low voice. Circle slowly';
  if(b.Asound>0.3&&Math.abs(s.c)<70)return'Hear the wobble? It slows as you get closer';
  if(b.Asound>0.3){if(s.c>0)return b.level>0.98?'Your bowl is full and still too high':'Too high. More water lowers the pitch';
    return'Too low. Pour some water out';}
  if(b.level<0.02&&!hintState.watered&&LEVEL_HINTS.water(s))return'An empty bowl sings its highest. Water lowers its voice';
  return'Keep circling to build the tone';
}
const LEVEL_HINTS={water:s=>s.w>0.1};
function worldHint(){
  if(cardOpen||won||sheetT>0.3||cam.over)return'';
  if(deadEnd)return'';
  if(!hintState.opened)return'Tap the bowl to listen';
  if(nearSpring(G,ST,trav.x,trav.y)&&bowlState.level<0.9&&!hintState.watered)return'A spring. Open the bowl to fill it';
  if(phrase.prog>0)return`The phrase hangs in the air · ${Math.ceil(phrase.t)}s`;
  if(!hintState.looked&&room>=2)return'Tap the eye to look around';
  return'';
}
function drawWorldHint(){const s=worldHint();if(!s)return;ctx.fillStyle='rgba(255,255,255,.95)';ctx.textAlign='center';ctx.font='italic 16px '+FONT;ctx.fillText(s,W/2,H-96-SAFE_B);}

// =====================================================================
//  UPDATE
// =====================================================================
function update(dt){
  levelT+=dt;sheetT=clamp(sheetT+(sheetOpen?dt:-dt)*3.2,0,1);
  bowlPhysics(dt);if(rubPtr&&bowlState.Asound>0.25)hintState.sang=true;if(bowlState.voice===1&&bowlState.A1>0.4)hintState.high=true;
  // structures move
  G.movers.forEach(m=>{const tgt=m.h[(ST.m>>m.bit)&1];const d=tgt-mDisp[m.bit];const sp=m.id[0]==='L'?1.1:2.2;if(Math.abs(d)>0.002)mDisp[m.bit]+=Math.sign(d)*Math.min(Math.abs(d),dt*sp);else mDisp[m.bit]=tgt;});
  G.rots.forEach(r=>{const tgt=(ST.r>>r.bit)&1;const d=tgt-rDisp[r.bit];if(Math.abs(d)>0.0005)rDisp[r.bit]+=Math.sign(d)*Math.min(Math.abs(d),dt*0.7);else rDisp[r.bit]=tgt;});
  // walking / riding
  if(trav.ride){const {r,i}=trav.ride;const th=rDisp[r.bit]*Math.PI/2;const [dx,dy]=r.arms[i];const c=Math.cos(th),s=Math.sin(th);trav.fx=r.pivot[0]+dx*c-dy*s;trav.fy=r.pivot[1]+dx*s+dy*c;trav.fz=r.h;
    if(Math.abs(rDisp[r.bit]-((ST.r>>r.bit)&1))<0.0005){const k=(ST.r>>r.bit)&1;const p=rotArm(r,k)[i];trav.x=p[0];trav.y=p[1];trav.fx=p[0];trav.fy=p[1];trav.ride=null;}}
  else if(trav.path.length){
    const [nx,ny]=trav.path[0];const sp=3.0;trav.t+=dt*sp;trav.step+=dt*sp;const u=Math.min(1,trav.t);
    trav.fx=trav.x+(nx-trav.x)*u;trav.fy=trav.y+(ny-trav.y)*u;const h0=logicH(trav.x,trav.y),h1=logicH(nx,ny);trav.fz=h0+(h1-h0)*u;
    if(u>=1){trav.x=nx;trav.y=ny;trav.t=0;trav.path.shift();sfx.step(Math.round(trav.step));arrived();}
  }else{trav.fx=trav.x;trav.fy=trav.y;const m=moverAt(trav.x,trav.y);trav.fz=m?mDisp[m.bit]:logicH(trav.x,trav.y);}
  updateStones(dt);updateStoneVoices();
  for(let i=ripples.length-1;i>=0;i--){ripples[i].t+=dt;if(ripples[i].t>2)ripples.splice(i,1);}
  for(let i=bowlRipples.length-1;i>=0;i--){bowlRipples[i].t+=dt;if(bowlRipples[i].t>0.8)bowlRipples.splice(i,1);}
  for(let i=pourDrops.length-1;i>=0;i--){pourDrops[i].t+=dt*1.5;if(pourDrops[i].t>1)pourDrops.splice(i,1);}
  if(padBus)padBus.gain.setTargetAtTime(sheetOpen?0.25:1,AC.currentTime,0.8);
  if(roomTitle)roomTitle.t+=dt;
  if(deadCheckT>0){deadCheckT-=dt;if(deadCheckT<=0&&!won){if(!settled()||trav.path.length||trav.ride)deadCheckT=0.3;else if(!canFinish())showDeadEnd();}}
  if(won){won.t+=dt;if(won.t>3&&!won.done){won.done=true;endCard();}}
  updateCamera(dt);
}
function arrived(){
  if(trav.x===G.goal[0]&&trav.y===G.goal[1]){trav.path=[];won={t:0};sheetOpen=false;sfx.win();save.cp=null;persist();return;}
  WORLD.rooms.forEach((rm,i)=>{if(i>room&&trav.x===rm.at[0]&&trav.y===rm.at[1]){room=i;checkpoint();roomTitle={t:0,num:['I','II','III','IV','V','VI','VII'][i],name:rm.name};chime(NOTE_F.G4*0.5*Math.pow(2,[0,2,4,7,9,12][i%6]/12),0.06,{soft:true,dry:0.3});}});
}

// =====================================================================
//  INPUT
// =====================================================================
const ptrs=new Map();let rubPtr=null,dragPan=false;
function tileAt(px,py){
  const order=[];for(let y=0;y<G.h;y++)for(let x=0;x<G.w;x++)if(logicH(x,y)>-50)order.push([x,y]);
  order.sort((a,b)=>(b[0]+b[1])-(a[0]+a[1])||b[0]-a[0]);
  for(const [x,y] of order){const h=logicH(x,y);if(inPoly(px,py,[P(x,y,h),P(x+1,y,h),P(x+1,y+1,h),P(x,y+1,h)]))return[x,y];}
  return null;
}
function inPoly(x,y,q){let c=false;for(let i=0,j=q.length-1;i<q.length;j=i++){if(((q[i][1]>y)!==(q[j][1]>y))&&(x<(q[j][0]-q[i][0])*(y-q[i][1])/(q[j][1]-q[i][1])+q[i][0]))c=!c;}return c;}
cv.addEventListener('pointerdown',e=>{
  initAudio();if(cardOpen)return;try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const x=e.clientX,y=e.clientY;const p={id:e.pointerId,x0:x,y0:y,lx:x,ly:y,t0:performance.now(),x,y,kind:'world'};
  if(sheetOpen&&sheetT>0.6&&y>sheetGeo().top-10){
    const g=sheetGeo();
    if(Math.hypot(x-g.closeX,y-g.closeY)<30)p.kind='close';
    else if(Math.abs(x-g.wx)<40&&y>g.wy0-40&&y<g.wy1+40){p.kind='water';p.l0=bowlState.level;}
    else{const nx=(x-g.cx)/g.r,ny=(y-g.cy)/g.ry;if(Math.hypot(nx,ny*0.6)<2.4){p.kind='bowl';p.lastA=Math.atan2(ny,nx);p.acc=0;p.lt=performance.now();}else p.kind='none';}
  }else if(!sheetOpen&&!cam.over&&Math.hypot(x-W/2,y-(H-50-SAFE_B))<32&&!won)p.kind='openBowl';
  ptrs.set(e.pointerId,p);
});
function setWaterFrom(y){const g=sheetGeo();setWater((g.wy1-y)/(g.wy1-g.wy0));}
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;p.x=e.clientX;p.y=e.clientY;
  if(p.kind==='water'){const g=sheetGeo();const dy=p.ly-p.y;const gain=0.45+Math.min(1,Math.abs(dy)/14)*1.1;setWater(bowlState.level+dy/(g.wy1-g.wy0)*gain);}
  else if(p.kind==='bowl'||p.kind==='rub'){
    const g=sheetGeo();const nx=(p.x-g.cx)/g.r,ny=(p.y-g.cy)/g.ry;const a=Math.atan2(ny,nx);const rad=Math.hypot(nx,ny);
    let d=a-p.lastA;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;p.lastA=a;const now=performance.now(),dt=Math.max(4,now-p.lt)/1000;p.lt=now;
    if(rad<0.25)return;p.acc+=Math.abs(d);
    if(p.kind==='bowl'&&p.acc>0.5&&!rubPtr){p.kind='rub';rubPtr=p;}
    if(p.kind==='rub'){const b=bowlState;const w=d/dt;const prev=b.omega;b.omega=b.omega*0.7+w*0.3;b.jerk=b.jerk*0.9+Math.min(6,Math.abs(b.omega-prev)/TAU)*0.1;b.theta=a;b.lastMove=now;}
  }else if(p.kind==='world'||p.kind==='pan'){
    if(p.kind==='world'&&Math.hypot(p.x-p.x0,p.y-p.y0)>10){p.kind='pan';dragPan=true;}
    if(p.kind==='pan'){cam.px-=p.x-p.lx;cam.py-=p.y-p.ly;hintState.panned=true;}
  }
  p.lx=p.x;p.ly=p.y;
});
function endPtr(e){
  const p=ptrs.get(e.pointerId);if(!p)return;ptrs.delete(e.pointerId);const moved=Math.hypot(p.x-p.x0,p.y-p.y0),quick=performance.now()-p.t0<350;
  if(p===rubPtr)rubPtr=null;if(p.kind==='pan')dragPan=false;
  if(p.kind==='close'){sheetOpen=false;return;}
  if(p.kind==='openBowl'&&moved<20){sheetOpen=true;hintState.opened=true;return;}
  if(p.kind==='bowl'&&moved<14&&quick){strikeBowl();return;}
  if(p.kind==='world'&&moved<10)worldTap(p.x,p.y);
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
function worldTap(px,py){
  if(cam.over){cam.over=false;return;}
  if(trav.path.length||trav.ride||won)return;
  if(sheetOpen&&py>sheetGeo().top)return;
  const tp=P(trav.x+0.5,trav.y+0.5,trav.fz);
  if(Math.hypot(px-tp[0],py-(tp[1]-12*A/26))<Math.max(22,A*0.6)){if(!sheetOpen){sheetOpen=true;hintState.opened=true;}return;}
  if(!settled())return;
  const t=tileAt(px,py);if(!t||(t[0]===trav.x&&t[1]===trav.y))return;
  const path=findPath(t[0],t[1]);if(!path){sfx.nope();flash={x:t[0],y:t[1],t:0};return;}
  trav.path=path;trav.t=0;cam.px*=0.3;cam.py*=0.3;
}
let flash=null;
$('viewBtn').onclick=()=>{initAudio();if(cardOpen)return;cam.over=!cam.over;cam.px=cam.py=0;hintState.looked=true;if(cam.over)sheetOpen=false;};

// =====================================================================
//  CARDS & MENU
// =====================================================================
const ORN_TOP='<svg class="orn" viewBox="0 0 250 34" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 26H95l12-12 10 10 8-8 8 8 10-10 12 12H250"/><path d="M125 2l9 9-9 9-9-9z"/></svg>';
const ORN_BOT='<svg class="orn" viewBox="0 0 250 34" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 8H95l12 12 10-10 8 8 8-8 10 10 12-12H250"/><path d="M125 14l9 9-9 9-9-9z"/></svg>';
const GO='<button class="go" id="goBtn" aria-label="Begin"><svg viewBox="0 0 66 66" width="66" height="66"><circle cx="33" cy="33" r="26" fill="none" stroke="currentColor" stroke-width="4.5"/><circle cx="33" cy="33" r="31" fill="none" stroke="currentColor" stroke-width="1" opacity=".6"/></svg></button>';
let cardOpen=true;
function showCard(html,onGo,veil){cardOpen=true;$('cardBody').innerHTML=html+GO;$('veil').style.background=veil;$('card').classList.remove('hide');$('goBtn').onclick=()=>{initAudio();onGo();};}
function hideCard(){cardOpen=false;$('card').classList.add('hide');}
function titleCard(){showCard(`${ORN_TOP}<div class="label">a singing bowl journey</div><h1>Resonance</h1><div class="div"></div><div class="lines"><span class="small">headphones recommended<br>silent switch off</span></div>${ORN_BOT}`,worldCard,'linear-gradient(rgba(40,50,48,.42),rgba(40,50,48,.18))');}
function worldCard(){
  showCard(`${ORN_TOP}<div class="label">World I</div><h1>The Whispering<br>Falls</h1><div class="div"></div><div class="lines"><span class="small">in which</span><br>water is precious<br>and stones have long memories</div>${ORN_BOT}`,
    ()=>{hideCard();chime(NOTE_F.G4,0.1,{dry:0.4});if(!save.cp)roomTitle={t:0,num:'I',name:WORLD.rooms[0].name};},'linear-gradient(rgba(30,32,34,.32),rgba(30,32,34,.08))');
}
function endCard(){showCard(`${ORN_TOP}<div class="label">End of World I</div><h1>The Falls<br>Remember</h1><div class="div"></div><div class="lines"><span class="small">to be continued</span><br>more worlds<br>are listening</div>${ORN_BOT}`,()=>{resetWorld(null);hideCard();},'linear-gradient(rgba(30,32,34,.3),rgba(30,32,34,.1))');}
let deadShown=false;
function showDeadEnd(){
  if(deadShown)return;deadShown=true;deadEnd=true;sheetOpen=false;
  showCard(`${ORN_TOP}<div class="label">The valley is quiet</div><h1>No way<br>onward</h1><div class="div"></div><div class="lines"><span class="small">the water, the stones and the bridges<br>can no longer lead to the door</span><br>return to ${WORLD.rooms[room].name.toLowerCase()}</div>${ORN_BOT}`,
    ()=>{deadShown=false;resetWorld(save.cp);hideCard();},'linear-gradient(rgba(30,32,34,.66),rgba(30,32,34,.45))');
}
$('menuBtn').onclick=()=>{initAudio();if(cardOpen)return;renderMenu();$('menu').classList.remove('hide');};
$('mResume').onclick=()=>$('menu').classList.add('hide');
$('mRoom').onclick=()=>{$('menu').classList.add('hide');sheetOpen=false;resetWorld(save.cp);};
$('mRestart').onclick=()=>{$('menu').classList.add('hide');sheetOpen=false;save.cp=null;persist();resetWorld(null);roomTitle={t:0,num:'I',name:WORLD.rooms[0].name};};
$('mSound').onclick=()=>{save.sound=!save.sound;persist();if(master)master.gain.setTargetAtTime(save.sound?0.95:0,AC.currentTime,0.2);renderMenu();};
$('mGuide').onclick=()=>{save.guide=!save.guide;persist();renderMenu();};
function renderMenu(){$('mSound').textContent='Sound: '+(save.sound?'on':'off');$('mGuide').textContent='Tuning guide: '+(save.guide?'on':'off');}

// =====================================================================
//  LOOP
// =====================================================================
let last=performance.now();
function frame(now){
  const dt=clamp((now-last)/1000,0,0.05);last=now;
  try{update(dt);drawWorld(now/1000);
    if(flash){flash.t+=dt;const h=logicH(flash.x,flash.y);poly([P(flash.x,flash.y,h),P(flash.x+1,flash.y,h),P(flash.x+1,flash.y+1,h),P(flash.x,flash.y+1,h)]);ctx.fillStyle=`rgba(255,255,255,${0.35*(1-flash.t/0.5)})`;ctx.fill();if(flash.t>0.5)flash=null;}
    drawWorldHint();drawBowlButton();drawSheet();
  }catch(err){console.error(err);}
  requestAnimationFrame(frame);
}
layout();resetWorld(save.cp);titleCard();requestAnimationFrame(frame);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
