<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shadow Walker">
<meta name="theme-color" content="#cfd8d2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Shadow Walker</title>
<style>
:root{--ink:#f6f4ee;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#cfd8d2;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;font-family:var(--serif)}
body{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
svg{display:block}
#menuBtn{position:absolute;left:calc(env(safe-area-inset-left) + 16px);top:calc(env(safe-area-inset-top) + 14px);width:44px;height:44px;z-index:4;opacity:.85}
#hint{position:absolute;left:24px;right:24px;bottom:calc(env(safe-area-inset-bottom) + 26px);text-align:center;color:var(--ink);font-style:italic;font-size:17px;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .8s}
#hint.show{opacity:.92}
.card{position:absolute;inset:0;z-index:6;text-shadow:0 1px 10px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);text-align:center;transition:opacity 1.1s ease;padding:0 24px calc(env(safe-area-inset-bottom) + 20px)}
.card.hide{opacity:0;pointer-events:none}
.card .veil{position:absolute;inset:0;z-index:-1}
.orn{width:min(250px,64vw);height:34px;opacity:.9}
.card .label{font-size:15px;letter-spacing:.32em;text-transform:uppercase;margin:22px 0 10px}
.card h1{font-weight:400;font-size:clamp(30px,9.5vw,46px);letter-spacing:.16em;text-transform:uppercase;margin:0 0 6px;line-height:1.15}
.card .div{width:56px;height:1px;background:currentColor;opacity:.8;margin:18px auto 16px}
.card .lines{font-size:16px;letter-spacing:.24em;text-transform:uppercase;line-height:2;margin-bottom:22px}
.card .lines .small{font-size:12px;letter-spacing:.3em;opacity:.85}
.go{width:66px;height:66px;margin-top:46px}
.go circle{transition:r .3s}
#menu{position:absolute;left:0;right:0;top:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(20,24,24,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .4s}
#menu.hide{opacity:0;pointer-events:none}
#menu .panel{color:var(--ink);text-align:center;min-width:240px}
#menu .panel button{display:block;width:100%;padding:14px 10px;font-size:16px;letter-spacing:.24em;text-transform:uppercase}
#menu .panel button:disabled{opacity:.35}
#menu .sep{height:1px;background:currentColor;opacity:.35;margin:8px 30px}
#menu .chs{display:flex;justify-content:center;gap:10px;padding:6px 0 10px}
#menu .chs button{width:46px;height:46px;border:1px solid rgba(246,244,238,.6);border-radius:50%;padding:0;font-size:15px;letter-spacing:.05em}
#menu .chs button.cur{background:rgba(246,244,238,.22)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="menuBtn" aria-label="Menu"><svg viewBox="0 0 44 44" width="44" height="44"><circle cx="22" cy="22" r="17" fill="none" stroke="#f6f4ee" stroke-width="2"/><circle cx="22" cy="22" r="5.5" fill="#f6f4ee"/></svg></button>
<div id="hint"></div>

<div id="menu" class="hide"><div class="panel">
  <button id="mResume">Continue</button>
  <button id="mRestart">Restart chapter</button>
  <div class="sep"></div>
  <div class="chs" id="mChapters"></div>
  <div class="sep"></div>
  <button id="mSound">Sound: on</button>
</div></div>

<div id="card" class="card"><div class="veil" id="veil"></div><div id="cardBody"></div></div>

<script>
'use strict';
// The sun travels a sky arc behind the valley: psi 0 = dawn (left), PI/2 = noon, PI = dusk (right).
// Low sun = long shadows. Shadows always fall towards the viewer.
const STOPS=[0,1,2,3,4].map(k=>k*Math.PI/4);
const sunAt=psi=>({phi:Math.PI*0.75+psi,tan:0.5+0.7*Math.sin(psi)});
const CHAKRA=[
  {name:'Root',   col:'#d9534f',freq:196.00},
  {name:'Sacral', col:'#ec8a3a',freq:220.00},
  {name:'Solar',  col:'#e9c23b',freq:246.94},
  {name:'Heart',  col:'#5fb36b',freq:293.66},
  {name:'Throat', col:'#4aa3d8',freq:329.63},
  {name:'Third eye',col:'#5b62c9',freq:392.00},
  {name:'Crown',  col:'#a061c9',freq:440.00},
];
function parseLevel(L){
  const w=L.map[0].length,h=L.map.length;
  const base=[];for(let y=0;y<h;y++)for(let x=0;x<w;x++){const c=L.map[y][x];base.push(c==='.'?-99:parseInt(c,36));}
  const idx=(x,y)=>y*w+x;
  const stairs=new Set((L.stairs||[]).map(([x,y])=>idx(x,y)));
  const movers=new Map();(L.movers||[]).forEach(m=>movers.set(idx(m.x,m.y),m));
  const bowls=new Map();(L.bowls||[]).forEach(b=>bowls.set(idx(b.x,b.y),b));
  return Object.assign({},L,{w,h,base,idx,stairs,movers,bowls});
}
function hgt(G,bits,x,y){
  if(x<0||y<0||x>=G.w||y>=G.h)return -99;
  const i=y*G.w+x;const m=G.movers.get(i);
  if(m)return m.h[(bits>>m.c)&1];
  return G.base[i];
}
function shadowed(G,bits,sun,x,y){
  const h0=hgt(G,bits,x,y);if(h0<-50)return false;
  const dx=Math.cos(sun.phi),dy=Math.sin(sun.phi);
  for(let t=0.25;t<16;t+=0.05){
    const sx=Math.floor(x+0.5+dx*t),sy=Math.floor(y+0.5+dy*t);
    if(sx<-1||sy<-1||sx>G.w||sy>G.h)break;
    if(sx===x&&sy===y)continue;
    if(hgt(G,bits,sx,sy)>h0+t*sun.tan+1e-6)return true;
  }
  return false;
}
function canStep(G,bits,ax,ay,bx,by){
  const ha=hgt(G,bits,ax,ay),hb=hgt(G,bits,bx,by);
  if(ha<-50||hb<-50)return false;
  if(ha===hb)return true;
  return Math.abs(ha-hb)===1&&(G.stairs.has(G.idx(ax,ay))||G.stairs.has(G.idx(bx,by)));
}
const isGoal=(G,x,y)=>x===G.goal[0]&&y===G.goal[1];
// tiles the traveller can reach right now (path through shadow only)
function reachable(G,bits,sun,sx,sy){
  const seen=new Map();const q=[[sx,sy]];seen.set(G.idx(sx,sy),null);
  while(q.length){
    const [x,y]=q.shift();
    if(isGoal(G,x,y)&&!(x===sx&&y===sy))continue;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;const k=G.idx(nx,ny);
      if(nx<0||ny<0||nx>=G.w||ny>=G.h||seen.has(k))continue;
      if(!canStep(G,bits,x,y,nx,ny))continue;
      if(!isGoal(G,nx,ny)&&!shadowed(G,bits,sun,nx,ny))continue;
      seen.set(k,G.idx(x,y));q.push([nx,ny]);
    }
  }
  return seen;
}
const LEVELS=[
  {chapter:'Chapter I',title:'The First Shade',lines:['in which','the wanderer learns','to walk in shadow'],
   map:['.......',
        '.33.33.',
        '1111111',
        '.......'],
   start:[0,2],goal:[6,2],sun:1},
  {chapter:'Chapter II',title:'The Root Bowl',lines:['in which','a stone remembers','its voice'],
   map:['.......',
        '.3..1..',
        '1110111',
        '.......'],
   movers:[{x:3,y:2,c:0,h:[0,1]},{x:4,y:1,c:0,h:[1,3]}],
   bowls:[{x:1,y:2,c:0}],
   start:[0,2],goal:[6,2],sun:0},
  {chapter:'Chapter III',title:'Two Voices',lines:['in which','one stone must fall','so another may rise'],
   map:['......',
        '...31.',
        '..430.',
        '.3111.',
        '.31...',
        '111...'],
   movers:[{x:3,y:3,c:3,h:[4,1]},{x:4,y:2,c:1,h:[0,1]}],
   bowls:[{x:2,y:3,c:3},{x:4,y:3,c:1}],
   start:[0,5],goal:[4,1],sun:2},
  {chapter:'Chapter IV',title:'The Crown',lines:['in which','the wanderer rises','towards the light'],
   map:['......',
        '....4.',
        '..554.',
        '..333.',
        '.53...',
        '.43...',
        '111...'],
   stairs:[[4,3]],
   movers:[{x:2,y:6,c:5,h:[1,3]},{x:3,y:3,c:4,h:[1,3]}],
   bowls:[{x:2,y:6,c:5},{x:2,y:3,c:4}],
   start:[0,6],goal:[4,1],sun:0},
];

// ---------- looks: one palette per chapter ----------
const PAL=[
  {sky:['#dfe6e0','#b4bfb9'],fog:'#c9d2cc',lit:'#bccb4b',shade:'#78846a',left:'#6f6479',right:'#aeaca6',edge:'#d6df7c',ink:'#f6f4ee',rain:.22,sunCol:'#fff6dc'},
  {sky:['#f3dccb','#c99f9b'],fog:'#e6cbc0',lit:'#d0c85c',shade:'#836f73',left:'#7b5a70',right:'#cfb5ab',edge:'#e8df8a',ink:'#fff8f0',rain:0,sunCol:'#fff0d0'},
  {sky:['#bfe0cb','#ece4c6'],fog:'#efe7cb',lit:'#a9d23f',shade:'#5d7a5f',left:'#6a4c5d',right:'#93797f',edge:'#c9ea6a',ink:'#fbf8ec',rain:.18,sunCol:'#fffbe0'},
  {sky:['#3a2f4c','#e2a57c'],fog:'#c48f80',lit:'#e9c46c',shade:'#4e405e',left:'#3e3152',right:'#7c6589',edge:'#f6dc95',ink:'#fff4e6',rain:0,sunCol:'#ffe2a8'},
];
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixc=(a,b,t)=>{const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`;};
const shadeC=(a,f)=>{const A=hex(a);return `rgb(${A.map(v=>Math.round(Math.min(255,v*f))).join(',')})`;};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const $=id=>document.getElementById(id);

// ---------- save ----------
let save={unlocked:0,sound:true};
try{const s=JSON.parse(localStorage.getItem('shadow-walker')||'null');if(s)save=Object.assign(save,s);}catch(e){}
const persist=()=>{try{localStorage.setItem('shadow-walker',JSON.stringify(save));}catch(e){}};

// ---------- canvas & projection ----------
const cv=$('c'),ctx=cv.getContext('2d');
let W,H,DPR,A,B,HU,ox,oy,ringC,ringR,ringRy;
function P(gx,gy,gz){return[ox+(gx-gy)*A,oy+(gx+gy)*B-gz*HU];}
function layout(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  if(!G)return;
  // fit the diorama
  let maxH=0,minH=99;for(let i=0;i<G.base.length;i++){const h=G.base[i];if(h>-50){maxH=Math.max(maxH,h);minH=Math.min(minH,h);}}
  G.movers.forEach(m=>{maxH=Math.max(maxH,...m.h);});
  const span=G.w+G.h;
  const a1=Math.min(W*0.84/span,(H*0.56)/(span*0.5774+(maxH-minH+1.5)*1.1547));
  A=a1;B=A*0.5774;HU=A*1.1547;
  // center
  ox=0;oy=0;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(let y=0;y<G.h;y++)for(let x=0;x<G.w;x++){const h=G.base[G.idx(x,y)];if(h<-50)continue;
    for(const [cx_,cy_] of [[x,y],[x+1,y],[x+1,y+1],[x,y+1]]){for(const z of [h,minH-1]){const p=P(cx_,cy_,z);x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);}}}
  G.movers.forEach(m=>{const p=P(m.x,m.y,Math.max(...m.h));y0=Math.min(y0,p[1]);});
  ox=W/2-(x0+x1)/2;oy=H*0.47-(y0+y1)/2;
  const c=P(G.w/2,G.h/2,minH);ringC=[W/2,Math.min(c[1],H*0.66)];
  ringR=W*0.42;ringRy=Math.max(140,ringC[1]-Math.max(110,H*0.16));
  bgCache=null;
}
addEventListener('resize',layout);

// ---------- game state ----------
let LI=0,G=null,bits=0,psi=0,sunStop=0,sunAnim=null,dragging=false,dragMoved=false;
let disp=null,shadeV=null,trav=null,won=false,levelT=0,ripples=[],flags=[];
let bgCache=null,hintState={};
function loadLevel(i){
  LI=i;G=parseLevel(LEVELS[i]);bits=0;sunStop=G.sun;psi=STOPS[sunStop];sunAnim=null;won=false;levelT=0;ripples=[];
  disp=new Float32Array(G.w*G.h);shadeV=new Float32Array(G.w*G.h);
  for(let y=0;y<G.h;y++)for(let x=0;x<G.w;x++){disp[G.idx(x,y)]=hgt(G,0,x,y);shadeV[G.idx(x,y)]=shadowed(G,0,sunAt(psi),x,y)?1:0;}
  trav={x:G.start[0],y:G.start[1],path:[],t:0,fx:G.start[0],fy:G.start[1],fz:disp[G.idx(G.start[0],G.start[1])],step:0,face:1};
  hintState={};
  document.querySelector('meta[name=theme-color]').content=PAL[i%PAL.length].sky[0];
  document.body.style.background=PAL[i%PAL.length].sky[0];
  layout();
}
const pal=()=>PAL[LI%PAL.length];
const dispH=(x,y)=>(x<0||y<0||x>=G.w||y>=G.h)?-99:disp[G.idx(x,y)];
// visual shadow uses the animated heights so shadows sweep smoothly
function shadowedDisp(x,y,sn){
  const h0=dispH(x,y);if(h0<-50)return false;
  const dx=Math.cos(sn.phi),dy=Math.sin(sn.phi);
  for(let t=0.25;t<16;t+=0.05){
    const sx=Math.floor(x+0.5+dx*t),sy=Math.floor(y+0.5+dy*t);
    if(sx<-1||sy<-1||sx>G.w||sy>G.h)break;
    if(sx===x&&sy===y)continue;
    if(dispH(sx,sy)>h0+t*sn.tan+1e-6)return true;
  }
  return false;
}
const busy=()=>dragging||sunAnim||trav.path.length>0||won||[...G.movers.values()].some(m=>Math.abs(disp[G.idx(m.x,m.y)]-m.h[(bits>>m.c)&1])>0.01);

// ---------- audio: cozy, airy, generative ----------
let AC=null,master,revIn,padBus,amb={},sunVoice=null;
function makeIR(sec){
  const len=AC.sampleRate*sec,b=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
  return b;
}
function noiseBuf(brown){
  const len=AC.sampleRate*3,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);let l=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;if(brown){l=(l+0.02*w)/1.02;d[i]=l*3.5;}else d[i]=w;}
  return b;
}
function route(node,dry,wet){const g1=AC.createGain();g1.gain.value=dry;node.connect(g1);g1.connect(master);const g2=AC.createGain();g2.gain.value=wet;node.connect(g2);g2.connect(revIn);}
function initAudio(){
  if(AC){if(AC.state!=='running')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;comp.connect(AC.destination);
  master=AC.createGain();master.gain.value=save.sound?0.9:0;master.connect(comp);
  const rev=AC.createConvolver();rev.buffer=makeIR(4.5);revIn=AC.createGain();revIn.gain.value=0.9;revIn.connect(rev);
  const rg=AC.createGain();rg.gain.value=0.55;rev.connect(rg);rg.connect(master);
  AC._white=noiseBuf(false);AC._brown=noiseBuf(true);
  // pad
  padBus=AC.createGain();padBus.gain.value=0.0;route(padBus,0.5,0.9);
  padBus.gain.linearRampToValueAtTime(1,AC.currentTime+6);
  // rain + wind beds
  let s=AC.createBufferSource();s.buffer=AC._white;s.loop=true;
  const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=2200;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=7500;
  amb.rain=AC.createGain();amb.rain.gain.value=0;s.connect(hp);hp.connect(lp);lp.connect(amb.rain);route(amb.rain,0.8,0.3);s.start();
  s=AC.createBufferSource();s.buffer=AC._brown;s.loop=true;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=0.6;
  amb.wind=AC.createGain();amb.wind.gain.value=0.025;s.connect(bp);bp.connect(amb.wind);route(amb.wind,0.7,0.4);s.start();
  const lfo=AC.createOscillator();lfo.frequency.value=0.06;const lg=AC.createGain();lg.gain.value=0.018;lfo.connect(lg);lg.connect(amb.wind.gain);lfo.start();
  const lfo2=AC.createOscillator();lfo2.frequency.value=0.031;const lg2=AC.createGain();lg2.gain.value=160;lfo2.connect(lg2);lg2.connect(bp.frequency);lfo2.start();
  setAmbience();
  padLoop();sparkleLoop();
}
function setAmbience(){if(!AC)return;amb.rain.gain.setTargetAtTime(pal().rain*0.06,AC.currentTime,2);}
const mtof=m=>440*Math.pow(2,(m-69)/12);
// G major pentatonic world: G A B D E
const CHORDS=[[43,50,59,64,69],[40,47,55,62,66],[48,55,62,64,71],[38,45,54,57,64],[45,52,59,62,67]];
let chordI=0;
function padChord(notes,dur){
  const t=AC.currentTime;
  notes.forEach((m,i)=>{
    const f=mtof(m);
    const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.022/(1+i*0.25),t+dur*0.4);g.gain.linearRampToValueAtTime(0.0001,t+dur);
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900+i*120;lp.Q.value=0.3;
    [0,6].forEach(cents=>{const o=AC.createOscillator();o.type=cents?'triangle':'sine';o.frequency.value=f;o.detune.value=cents+(Math.random()-.5)*4;o.connect(lp);o.start(t);o.stop(t+dur+0.1);});
    lp.connect(g);g.connect(padBus);
  });
}
function padLoop(){if(!AC)return;padChord(CHORDS[chordI%CHORDS.length],16);chordI+=1+(Math.random()<.3?1:0);setTimeout(padLoop,10500);}
function sparkleLoop(){
  if(!AC)return;
  const notes=[79,81,83,86,88,91,93];
  if(save.sound)bowl(mtof(notes[Math.floor(Math.random()*notes.length)]),0.025,0.3);
  setTimeout(sparkleLoop,4000+Math.random()*7000);
}
// singing bowl: inharmonic partials, each a slowly beating pair
function bowl(f,gain,dryAmt){
  if(!AC)return;const t=AC.currentTime;
  const parts=[[1,1,7.5],[2.76,0.42,4.5],[5.40,0.2,2.6],[8.93,0.08,1.3]];
  const out=AC.createGain();out.gain.value=gain;route(out,dryAmt==null?0.7:dryAmt,0.75);
  parts.forEach(([r,a,d])=>{[-0.7,0.7].forEach(beat=>{
    const o=AC.createOscillator();o.frequency.value=f*r+beat*(r>1?1.6:1);
    const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(a*0.5,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(out);o.start(t);o.stop(t+d+0.1);
  });});
  noise(0.06,'bandpass',3200,1800,gain*0.25,2,0.3);
}
function noise(dur,type,f0,f1,gain,q,wet,brown){
  if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=brown?AC._brown:AC._white;
  const f=AC.createBiquadFilter();f.type=type;f.Q.value=q||1;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+Math.min(0.03,dur*0.3));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);route(g,0.8,wet||0.2);s.start(t,Math.random()*2);s.stop(t+dur+0.05);
}
function tone(f,dur,gain,wet,type){

// ---------- update ----------
function update(dt){
  levelT+=dt;

    sunAnim.t+=dt/0.4;const u=ease(Math.min(1,sunAnim.t));psi=sunAnim.from+(sunAnim.to-sunAnim.from)*u;
    sunVoiceUpdate(true,psi);
    if(sunAnim.t>=1){psi=STOPS[sunStop];sunAnim=null;sunVoiceUpdate(false,psi);sfx.snap(sunStop);refreshReach();}
  }
  // movers rise and fall
  let moving=false;
  G.movers.forEach(m=>{const i=G.idx(m.x,m.y),tgt=m.h[(bits>>m.c)&1];const d=tgt-disp[i];
    if(Math.abs(d)>0.005){disp[i]+=Math.sign(d)*Math.min(Math.abs(d),dt*2.2);moving=true;}else disp[i]=tgt;});
  if(moving===false&&G._wasMoving)refreshReach();
  G._wasMoving=moving;
  // shadows ease in and out
  const curSun=sunAt(psi);
  for(let y=0;y<G.h;y++)for(let x=0;x<G.w;x++){const i=G.idx(x,y);if(disp[i]<-50)continue;
    const tgt=shadowedDisp(x,y,curSun)?1:0;shadeV[i]+=(tgt-shadeV[i])*Math.min(1,dt*(dragging?14:8));}
  // walking
  if(trav.path.length){
    const [nx,ny]=trav.path[0];const sp=3.0;
    trav.t+=dt*sp;trav.step+=dt*sp;
    const u=Math.min(1,trav.t);
    trav.fx=trav.x+(nx-trav.x)*u;trav.fy=trav.y+(ny-trav.y)*u;
    const h0=disp[G.idx(trav.x,trav.y)],h1=disp[G.idx(nx,ny)];trav.fz=h0+(h1-h0)*u;
    if(nx!==trav.x)trav.face=nx>trav.x?1:-1;else trav.face=ny>trav.y?-1:1;
    if(u>=1){
      trav.x=nx;trav.y=ny;trav.t=0;trav.path.shift();sfx.step(Math.round(trav.step));
      if(isGoal(G,nx,ny)){trav.path=[];win();}
      else if(!trav.path.length)refreshReach();
    }
  }else{trav.fx=trav.x;trav.fy=trav.y;trav.fz=disp[G.idx(trav.x,trav.y)];}

}

    if(inPoly(px,py,q))return[x,y];
    // the front faces also count, so tall columns are easy to hit on their tops
    const lf=[P(x,y+1,h),P(x+1,y+1,h),P(x+1,y+1,h-0.4),P(x,y+1,h-0.4)],rf=[P(x+1,y,h),P(x+1,y+1,h),P(x+1,y+1,h-0.4),P(x+1,y,h-0.4)];
    if(inPoly(px,py,lf)||inPoly(px,py,rf))return[x,y];
  }
  return null;
}
function inPoly(x,y,q){let c=false;for(let i=0,j=q.length-1;i<q.length;j=i++){if(((q[i][1]>y)!==(q[j][1]>y))&&(x<(q[j][0]-q[i][0])*(y-q[i][1])/(q[j][1]-q[i][1])+q[i][0]))c=!c;}return c;}
function psiFromPoint(px,py){
  let a=Math.atan2(-(py-ringC[1])/ringRy,-(px-ringC[0])/ringR);
  if(a<-Math.PI/2)a=Math.PI;else if(a<0)a=0;
  return clamp(a,0,Math.PI);
}
cv.addEventListener('pointerdown',e=>{
  initAudio();if(!G||won||cardOpen)return;
  const q=sunPos(psi);
  const nearSun=Math.hypot(e.clientX-q[0],e.clientY-q[1])<48;
  const nx=(e.clientX-ringC[0])/ringR,ny=(e.clientY-ringC[1])/ringRy;const rd=Math.hypot(nx,ny);
  const onRing=Math.abs(rd-1)<0.14&&ny<0.15&&!tileAt(e.clientX,e.clientY);
  if((nearSun||onRing)&&!trav.path.length){
    dragging=true;dragMoved=false;sunAnim=null;try{cv.setPointerCapture(e.pointerId);}catch(_){}
    hintState.dragged=true;sunVoiceUpdate(true,psi);return;
  }
  downAt=[e.clientX,e.clientY];
});
cv.addEventListener('pointermove',e=>{
  if(!dragging)return;
  psi=psiFromPoint(e.clientX,e.clientY);dragMoved=true;sunVoiceUpdate(true,psi);
});
function endDrag(){
  if(!dragging)return;dragging=false;
  let best=0,bd=1e9;STOPS.forEach((s,i)=>{const d=Math.abs(s-psi);if(d<bd){bd=d;best=i;}});
  sunStop=best;sunAnim={from:psi,to:STOPS[best],t:0};
}
cv.addEventListener('pointerup',e=>{
  if(dragging){endDrag();return;}
  if(!downAt||!G||won||cardOpen)return;
  if(Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>14){downAt=null;return;}
  downAt=null;tap(e.clientX,e.clientY);
});
cv.addEventListener('pointercancel',()=>{endDrag();downAt=null;});
function tap(px,py){
  if(busy())return;
  const tp=P(trav.x+0.5,trav.y+0.5,disp[G.idx(trav.x,trav.y)]);
  let t=Math.hypot(px-tp[0],py-(tp[1]-12*A/30))<Math.max(24,A*0.7)?[trav.x,trav.y]:tileAt(px,py);if(!t)return;
  const [x,y]=t;const i=G.idx(x,y);
  if(x===trav.x&&y===trav.y){
    const b=G.bowls.get(i);
    if(b){strike(b);return;}
    return;
  }
  const seen=reachable(G,bits,sunAt(STOPS[sunStop]),trav.x,trav.y);
  if(!seen.has(i)){sfx.nope();flashTile=[x,y,0];return;}
  const path=[];let k=i;while(k!==G.idx(trav.x,trav.y)){path.push([k%G.w,Math.floor(k/G.w)]);k=seen.get(k);}
  path.reverse();trav.path=path;trav.t=0;hintState.walked=true;
}
let flashTile=null;
function strike(b){
  bits^=1<<b.c;const h=disp[G.idx(b.x,b.y)];
  ripples.push({x:b.x,y:b.y,z:h,c:b.c,t:0});
  bowl(CHAKRA[b.c].freq,0.3);
  if([...G.movers.values()].some(m=>m.c===b.c))setTimeout(sfx.stone,180);
  hintState.struck=true;
}
function win(){won={t:0};sfx.win();save.unlocked=Math.max(save.unlocked,Math.min(LEVELS.length-1,LI+1));persist();}

// ---------- hints (only where needed) ----------
let hintText='';
function setHint(s){if(s===hintText)return;hintText=s;const el=$('hint');if(s){el.textContent=s;el.classList.add('show');}else el.classList.remove('show');}
function hints(){
  if(cardOpen||won){setHint('');return;}
  if(LI===0&&!hintState.dragged)return setHint('Drag the sun around the sky');
  if(LI===0&&!hintState.walked)return setHint('The wanderer walks only in shadow. Tap a shaded stone');
  if(LI===1&&!hintState.struck){const b=G.bowls.get(G.idx(trav.x,trav.y));if(b&&!trav.path.length)return setHint('Tap the wanderer to strike the bowl');}
  setHint('');
}

// ---------- cards & menu ----------
const ORN_TOP='<svg class="orn" viewBox="0 0 250 34" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 26H95l12-12 10 10 8-8 8 8 10-10 12 12H250"/><path d="M125 2l9 9-9 9-9-9z"/></svg>';
const ORN_BOT='<svg class="orn" viewBox="0 0 250 34" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 8H95l12 12 10-10 8 8 8-8 10 10 12-12H250"/><path d="M125 14l9 9-9 9-9-9z"/></svg>';
const GO='<button class="go" id="goBtn" aria-label="Begin"><svg viewBox="0 0 66 66" width="66" height="66"><circle cx="33" cy="33" r="26" fill="none" stroke="currentColor" stroke-width="4.5"/><circle cx="33" cy="33" r="31" fill="none" stroke="currentColor" stroke-width="1" opacity=".6"/></svg></button>';
let cardOpen=true,cardNext=null;
function showCard(html,onGo,veil){
  cardOpen=true;$('cardBody').innerHTML=html+GO;$('veil').style.background=veil||'transparent';
  $('card').classList.remove('hide');
  $('goBtn').onclick=()=>{initAudio();onGo();};
}
function hideCard(){cardOpen=false;$('card').classList.add('hide');}
function titleCard(){
  showCard(`${ORN_TOP}<div class="label">a quiet journey</div><h1>Shadow<br>Walker</h1><div class="div"></div><div class="lines"><span class="small">sound on &middot; silent switch off</span></div>${ORN_BOT}`,()=>chapterCard(save.unlocked),'linear-gradient(rgba(40,50,48,.35),rgba(40,50,48,.15))');
}
function chapterCard(i){
  loadLevel(i);setAmbience();
  const L=LEVELS[i];
  showCard(`${ORN_TOP}<div class="label">${L.chapter}</div><h1>${L.title}</h1><div class="div"></div><div class="lines"><span class="small">${L.lines[0]}</span><br>${L.lines.slice(1).join('<br>')}</div>${ORN_BOT}`,
    ()=>{hideCard();refreshReach();bowl(CHAKRA[i%7].freq,0.12,0.4);},
    `linear-gradient(rgba(30,30,35,.25),rgba(30,30,35,.05))`);
}
function nextLevel(){
  if(LI+1<LEVELS.length)chapterCard(LI+1);
  else showCard(`${ORN_TOP}<div class="label">Epilogue</div><h1>To be<br>continued</h1><div class="div"></div><div class="lines"><span class="small">in which</span><br>the valley waits<br>for new paths</div>${ORN_BOT}`,()=>chapterCard(0),'linear-gradient(rgba(30,30,35,.3),rgba(30,30,35,.1))');
}
$('menuBtn').onclick=()=>{initAudio();if(cardOpen)return;renderMenu();$('menu').classList.remove('hide');};
$('mResume').onclick=()=>$('menu').classList.add('hide');
$('mRestart').onclick=()=>{$('menu').classList.add('hide');loadLevel(LI);refreshReach();};
$('mSound').onclick=()=>{save.sound=!save.sound;persist();if(master)master.gain.setTargetAtTime(save.sound?0.9:0,AC.currentTime,0.2);renderMenu();};
function renderMenu(){
  $('mSound').textContent='Sound: '+(save.sound?'on':'off');
  const roman=['I','II','III','IV','V','VI','VII'];
  $('mChapters').innerHTML=LEVELS.map((l,i)=>`<button ${i>save.unlocked?'disabled':''} class="${i===LI?'cur':''}" data-i="${i}">${roman[i]}</button>`).join('');
  $('mChapters').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('menu').classList.add('hide');chapterCard(+b.dataset.i);});
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(G){try{update(dt);drawScene(now/1000);}catch(err){console.error(err);}}
  if(flashTile){flashTile[2]+=dt;const [x,y]=flashTile;const h=disp[G.idx(x,y)];const q=[P(x,y,h),P(x+1,y,h),P(x+1,y+1,h),P(x,y+1,h)];
    poly(q);ctx.fillStyle=`rgba(255,255,255,${0.35*(1-flashTile[2]/0.5)})`;ctx.fill();if(flashTile[2]>0.5)flashTile=null;}
  requestAnimationFrame(frame);
}
loadLevel(save.unlocked);titleCard();
requestAnimationFrame(frame);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
