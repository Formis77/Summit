<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="High Roller">
<meta name="theme-color" content="#0c0918">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>High Roller</title>
<style>
:root{--bg:#0c0918;--panel:#171130;--panel2:#1f1740;--line:rgba(255,255,255,.08);--ink:#f4f1ff;--mut:#9d93c4;--gold:#f7c948;--gold2:#e09b1f;--pink:#ff3d7f;--cyan:#2de2e6;--green:#3be089;--red:#ff5a5a;--purple:#9b6bff;
  --c-common:#a7b0c4;--c-rare:#3fa9ff;--c-epic:#b065ff;--c-legendary:#ffb02e;--c-mythic:#ff3d7f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 70% at 50% -10%,#2a1a5e 0%,#140f2b 45%,#0c0918 100%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
/* header */
#top{padding:calc(env(safe-area-inset-top) + 8px) 16px 10px;display:flex;align-items:center;gap:10px}
#moneyBox{flex:1;min-width:0}
#money{font-size:30px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;white-space:nowrap}
#money .coin{width:26px;height:26px;flex:none}
#income{font-size:13px;color:var(--mut);margin-top:1px}
#income b{color:var(--green);font-weight:700}
.pill{display:flex;align-items:center;gap:5px;padding:7px 10px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:13px;font-weight:700}
#boostPill{display:none;color:var(--cyan)}
/* views */
#views{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 20px;display:none}
.view.on{display:block}
#treeView{padding:0;overflow:hidden}
/* tabs */
#tabs{display:flex;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);background:rgba(10,8,20,.85);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--mut);position:relative}
#tabs button.on{color:var(--gold)}
#tabs button svg{width:24px;height:24px}
.dot{position:absolute;top:2px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 8px var(--pink);display:none}
/* machine selector */
#mlist{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
#mlist::-webkit-scrollbar{display:none}
.mchip{flex:none;display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:700;position:relative}
.mchip svg{width:20px;height:20px}
.mchip.on{background:linear-gradient(135deg,#3b2a7a,#26195a);border-color:rgba(247,201,72,.55);color:var(--gold)}
.mchip.locked{opacity:.38}
.mchip .auto{position:absolute;top:-4px;right:-4px;font-size:9px;font-weight:800;padding:2px 5px;border-radius:6px;background:var(--green);color:#06210f;letter-spacing:.3px}
.machine{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;padding:16px;position:relative;overflow:hidden}
.machine h2{margin:0;font-size:20px;letter-spacing:.2px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.msub{font-size:12px;color:var(--mut)}
.stage{position:relative;border-radius:16px;background:radial-gradient(100% 100% at 50% 0%,#2b1f5c,#120d26);border:1px solid var(--line);overflow:hidden}
/* bet controls */
.betrow{display:flex;align-items:center;gap:8px;margin-top:12px}
.betval{flex:1;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.betval small{display:block;font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.6px}
.betval span{font-size:18px;font-weight:800}
.bb{padding:11px 0;width:46px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:800;font-size:13px}
.play{width:100%;margin-top:10px;padding:16px;border-radius:16px;font-size:18px;font-weight:900;letter-spacing:1.5px;color:#2a1800;background:linear-gradient(180deg,#ffe07a,#f2a91d);box-shadow:0 6px 0 #a8650a,0 10px 24px rgba(242,169,29,.35);transition:transform .08s,box-shadow .08s;text-transform:uppercase}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #a8650a,0 6px 14px rgba(242,169,29,.3)}
.play:disabled{filter:grayscale(.8) brightness(.7)}
.play.cash{background:linear-gradient(180deg,#7dffb4,#21c46b);color:#032612;box-shadow:0 6px 0 #0f7a40,0 10px 24px rgba(59,224,137,.35)}
.autorow{display:flex;gap:8px;margin-top:10px}
.autobtn{flex:1;padding:10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.autobtn.on{background:rgba(59,224,137,.14);border-color:rgba(59,224,137,.6);color:var(--green)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.seg button{flex:1 0 22%;padding:10px 4px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:13px;font-weight:700}
.seg button.on{border-color:var(--gold);color:var(--gold);background:rgba(247,201,72,.1)}
.lockcard{text-align:center;padding:30px 10px;color:var(--mut)}
.lockcard svg{width:44px;height:44px;margin:0 auto 10px;opacity:.6}
/* coin flip */
.coinwrap{height:220px;display:flex;align-items:center;justify-content:center;perspective:700px}
.coin3d{width:130px;height:130px;position:relative;transform-style:preserve-3d;transition:transform 1.4s cubic-bezier(.2,.75,.2,1)}
.coin3d .face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#fff2b0,#f7c948 40%,#c9871a 75%,#8a5a0c);box-shadow:inset 0 0 0 6px rgba(255,255,255,.25),inset 0 0 0 10px rgba(140,90,10,.4)}
.coin3d .back{transform:rotateY(180deg)}
.coin3d svg{width:62px;height:62px}
/* slots */
.reels{display:flex;gap:6px;padding:14px;position:relative}
.reel{flex:1;height:204px;overflow:hidden;border-radius:12px;background:linear-gradient(180deg,#0b0818,#1b1438 20%,#1b1438 80%,#0b0818);position:relative;border:1px solid var(--line)}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.sym{height:68px;display:flex;align-items:center;justify-content:center}
.sym svg{width:46px;height:46px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.paylines{position:absolute;inset:14px;pointer-events:none}
.jackpot{text-align:center;font-weight:900;font-size:13px;letter-spacing:1px;color:var(--pink);margin-bottom:8px}
.jackpot span{color:var(--gold);font-size:17px}
/* canvas machines */
canvas.mcv{display:block;width:100%;touch-action:none}
.crashinfo{position:absolute;left:0;right:0;top:18px;text-align:center;pointer-events:none}
.crashinfo .mult{font-size:46px;font-weight:900;letter-spacing:-1px}
.crashinfo .st{font-size:12px;color:var(--mut);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.hist{display:flex;gap:6px;overflow:hidden;margin-top:8px}
.hist span{flex:none;font-size:12px;font-weight:800;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.06)}
.stepper{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid var(--line);font-size:13px;font-weight:700}
.stepper .lab{flex:1;color:var(--mut)}
.stepper button{width:34px;height:30px;border-radius:9px;background:rgba(255,255,255,.08);font-weight:900}
/* gacha */
.gachabox{display:flex;flex-direction:column;align-items:center;padding:14px 0 6px}
.gachabox svg.globe{width:190px;height:220px}
.gacharow{display:flex;gap:8px;width:100%}
.gacharow .play{flex:1}
.pity{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}
/* charms */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.charm{border-radius:16px;padding:12px 8px 10px;background:var(--panel);border:1px solid var(--line);text-align:center;position:relative}
.charm .ic{width:54px;height:54px;margin:0 auto 6px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.charm .ic svg{width:34px;height:34px}
.charm .nm{font-size:12px;font-weight:800;line-height:1.2}
.charm .ef{font-size:11px;color:var(--mut);margin-top:3px;line-height:1.25}
.charm .lv{position:absolute;top:6px;right:8px;font-size:10px;font-weight:900;color:var(--gold)}
.charm.unk{opacity:.45}
.charm.unk .ic{background:rgba(255,255,255,.05)!important}
.secttl{font-size:13px;font-weight:800;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin:14px 2px 10px}
.totals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tot{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.tot b{display:block;font-size:17px}
.tot small{font-size:11px;color:var(--mut);font-weight:700}
/* tree */
#treeWrap{position:absolute;inset:0;touch-action:none;overflow:hidden}
#tree{position:absolute;left:0;top:0;transform-origin:0 0}
#tree svg.links{position:absolute;left:0;top:0;overflow:visible}
.node{position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:22px;background:var(--panel);border:2px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;transition:transform .12s}
.node svg{width:34px;height:34px}
.node .lv{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;padding:2px 7px;border-radius:8px;background:#0c0918;border:1px solid rgba(255,255,255,.15);white-space:nowrap}
.node.hidden{opacity:.18;filter:grayscale(1)}
.node.can{border-color:var(--gold);box-shadow:0 0 18px rgba(247,201,72,.45)}
.node.max{border-color:var(--green);background:linear-gradient(135deg,#123b2a,#171130)}
.node.big{width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:28px}
.node.big svg{width:42px;height:42px}
.node:active{transform:scale(.94)}
.branchlbl{position:absolute;font-size:11px;font-weight:900;letter-spacing:2px;color:rgba(255,255,255,.28);text-transform:uppercase;white-space:nowrap;transform:translate(-50%,-50%)}
#treeHint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12px;color:var(--mut);pointer-events:none}
/* sheets & overlays */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;background:#1a1335;border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 40px rgba(0,0,0,.4)}
.sheet.on{transform:none}
.sheet .row{display:flex;gap:14px;align-items:center}
.sheet .bigic{width:64px;height:64px;border-radius:20px;background:var(--panel2);display:flex;align-items:center;justify-content:center;flex:none}
.sheet .bigic svg{width:38px;height:38px}
.sheet h3{margin:0;font-size:19px}
.sheet p{margin:6px 0 0;color:var(--mut);font-size:14px;line-height:1.4}
.sheet .eff{margin-top:14px;padding:12px;border-radius:14px;background:rgba(0,0,0,.25);font-size:14px;display:flex;justify-content:space-between}
.sheet .eff b{color:var(--green)}
.sheet .btns{display:flex;gap:8px;margin-top:14px}
.sheet .btns .play{margin:0}
.sheet .btns .ghost{flex:none;width:110px;padding:16px 8px;border-radius:16px;background:rgba(255,255,255,.08);font-weight:800}
#shade{position:absolute;inset:0;z-index:15;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s}
#shade.on{opacity:1;pointer-events:auto}
#fx{position:absolute;inset:0;z-index:30;pointer-events:none}
.float{position:absolute;font-weight:900;font-size:20px;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.6);animation:fl 1.3s ease-out forwards;white-space:nowrap}
@keyframes fl{0%{transform:translate(-50%,0) scale(.7);opacity:0}15%{transform:translate(-50%,-10px) scale(1.12);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
#big{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .25s}
#big.on{opacity:1}
#big .t{font-size:52px;font-weight:900;letter-spacing:2px;background:linear-gradient(180deg,#fff7c2,#f7c948 45%,#e07b1f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(247,160,40,.6));animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
#big .a{font-size:30px;font-weight:900;margin-top:6px;text-shadow:0 3px 12px rgba(0,0,0,.6)}
#big .rays{position:absolute;width:160vmax;height:160vmax;background:repeating-conic-gradient(rgba(255,215,90,.13) 0 10deg,transparent 10deg 20deg);animation:spin 8s linear infinite;mask:radial-gradient(circle,#000 0,transparent 60%);-webkit-mask:radial-gradient(circle,#000 0,transparent 60%)}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%) translateY(-20px);z-index:35;padding:10px 16px;border-radius:14px;background:#251b4d;border:1px solid rgba(247,201,72,.4);font-size:14px;font-weight:700;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translateX(-50%)}
/* gacha reveal */
#reveal{position:absolute;inset:0;z-index:45;background:radial-gradient(circle at 50% 45%,rgba(40,25,90,.96),rgba(6,4,14,.98));display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#reveal.on{display:flex}
#reveal .cap{width:150px;height:150px}
#reveal .rcard{text-align:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#reveal .rcard .ic{width:120px;height:120px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
#reveal .rcard .ic svg{width:70px;height:70px}
#reveal .rar{font-size:13px;font-weight:900;letter-spacing:3px;text-transform:uppercase}
#reveal .nm{font-size:28px;font-weight:900;margin:4px 0}
#reveal .ef{color:var(--mut);font-size:15px}
#reveal .tap{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 30px);color:var(--mut);font-size:13px;font-weight:700;letter-spacing:1px}
#reveal .multi{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:420px}
#reveal .multi .m{border-radius:14px;padding:8px 4px;text-align:center;background:rgba(255,255,255,.05);animation:pop .4s both}
#reveal .multi .m .ic{width:46px;height:46px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center}
#reveal .multi .m svg{width:28px;height:28px}
#reveal .multi .m div{font-size:9px;font-weight:800}
#reveal .glow{position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(40px);opacity:.5}
/* modal */
#modal{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:24px}
#modal.on{display:flex}
#modal .box{width:100%;max-width:360px;background:#1d1540;border:1px solid var(--line);border-radius:24px;padding:22px;text-align:center}
#modal h3{margin:0 0 6px;font-size:22px}
#modal p{color:var(--mut);margin:0 0 16px;line-height:1.45;font-size:14px}
#modal .big{font-size:30px;font-weight:900;color:var(--gold);margin:8px 0 16px}
.statrow{display:flex;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line);font-size:14px}
.statrow span{color:var(--mut)}
.vip{border-radius:20px;padding:18px;background:linear-gradient(135deg,#3a2468,#1d1440);border:1px solid rgba(247,201,72,.35);margin-top:6px}
.vip h3{margin:0;font-size:18px;display:flex;align-items:center;gap:8px}
.vip p{color:var(--mut);font-size:13px;line-height:1.45;margin:8px 0 12px}
.wheelwrap{display:flex;justify-content:center;padding:14px 0 4px;position:relative}
.wheelwrap .ptr{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--gold);filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));z-index:2}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="moneyBox">
      <div id="money" class="num"><span class="coin" id="coinIc"></span><span id="moneyN">$0</span></div>
      <div id="income" class="num"><b id="incomeN">+$0/s</b> &middot; luck <span id="luckN">0%</span> &middot; payout <span id="payN">x1</span></div>
    </div>
    <div class="pill" id="boostPill"></div>
    <div class="pill" id="vipPill" style="display:none"></div>
  </div>
  <div id="views">
    <section class="view on" id="casinoView"><div id="mlist"></div><div id="mpanel"></div></section>
    <section class="view" id="treeView"><div id="treeWrap"><div id="tree"></div></div><div id="treeHint">Drag to explore &middot; tap a node</div></section>
    <section class="view" id="charmView"></section>
    <section class="view" id="statsView"></section>
  </div>
  <nav id="tabs">
    <button data-v="casinoView" class="on"><span data-ic="dice"></span>Casino</button>
    <button data-v="treeView"><span data-ic="tree"></span>Upgrades<i class="dot" id="treeDot"></i></button>
    <button data-v="charmView"><span data-ic="gem"></span>Charms</button>
    <button data-v="statsView"><span data-ic="crown"></span>VIP</button>
  </nav>
</div>
<div id="shade"></div>
<div class="sheet" id="sheet"></div>
<div id="fx"></div>
<div id="big"><div class="rays"></div><div class="t" id="bigT">BIG WIN</div><div class="a num" id="bigA"></div></div>
<div id="toast"></div>
<div id="reveal"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>

<script>
'use strict';
// =====================================================================
//  HIGH ROLLER - a casino incremental. Fake money only.
// =====================================================================
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=Math.random;
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td'];
function fmt(n,dec){
  if(!isFinite(n))return'∞';const neg=n<0;n=Math.abs(n);let s;
  if(n<1000)s=n<10&&dec!==0?(Math.floor(n*100)/100).toFixed(n%1?2:0):Math.floor(n).toString();
  else{let i=Math.floor(Math.log10(n)/3);let v=n/Math.pow(1000,i);if(v<1){i--;v*=1000;}if(v>=999.5){i++;v/=1000;}if(i>=SUF.length)return(neg?'-':'')+n.toExponential(2);s=(v<10?v.toFixed(2):v<100?v.toFixed(1):v.toFixed(0))+SUF[i];}
  return(neg?'-':'')+s;
}
const $$=n=>'$'+fmt(n);

// ---------- icons (original line/fill drawings) ----------

const FRESH=()=>({money:100,life:0,runLife:0,up:{root:1},charms:{},vip:0,pulls:0,pity:0,jackpot:5000,bets:{},auto:{},autoPct:{},crashTarget:2,roBet:'red',wheelAt:0,boostUntil:0,
  stats:{plays:0,wins:0,biggest:0,biggestMult:0,pulls:0},last:Date.now(),sound:true,seenTree:0});
let S=FRESH();
try{const s=JSON.parse(localStorage.getItem('highroller')||'null');if(s)S=Object.assign(FRESH(),s);}catch(e){}

const L=id=>S.up[id]||0;
const has=id=>L(id)>0;

// ---------- derived numbers ----------
let D={};
function charmSum(key){let s=0;for(const c of CHARMS){const lv=S.charms[c.id]||0;if(lv&&c.fx[key])s+=c.fx[key]*(1+0.5*(lv-1));}return s;}
function charmMul(key){let m=1;for(const c of CHARMS){const lv=S.charms[c.id]||0;if(lv&&c.fx[key])m*=c.fx[key]+0.25*(lv-1);}return m;}
function recalc(){
  const vipM=1+0.1*S.vip;
  const boost=Date.now()<S.boostUntil?2:1;
  D.income=(1+L('inc1'))*Math.pow(1.25,L('inc2'))*Math.pow(1.5,L('inc3'))*Math.pow(2,L('inc4'))*Math.pow(3,L('inc5'))*(1+charmSum('income'))*charmMul('incomeX')*vipM*boost;
  D.luck=Math.min(0.3,0.01*L('luck1')+0.01*L('luck2')+0.015*L('luck3')+0.02*L('luck4')+charmSum('luck'));
  D.payout=(1+0.05*L('pay1')+0.1*L('pay2')+charmSum('payout'))*charmMul('payoutX')*vipM;
  D.speed=1+charmSum('speed');
  D.offlineH=1+L('off');
}
function maxBet(m){return m.base*Math.pow(2,L(m.bet))*(1+0.1*S.vip);}
function unlocked(m){return !m.unlock||has(m.unlock);}
function autoInterval(m){const lv=L(m.auto);return lv?3.2*Math.pow(0.72,lv-1)/D.speed:0;}

let AC=null,master;
function initAudio(){
  if(AC){if(AC.state!=='running')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=S.sound?0.6:0;const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination);
  const len=AC.sampleRate;const b=AC.createBuffer(1,len,AC.sampleRate);const d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AC._n=b;
}
function osc(type,f,t0,dur,g,f1){if(!AC||!S.sound)return;const t=AC.currentTime+t0;const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const gn=AC.createGain();gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+0.008);gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+dur+0.02);}
function noise(t0,dur,g,f,q,type){if(!AC||!S.sound)return;const t=AC.currentTime+t0;const s=AC.createBufferSource();s.buffer=AC._n;const fl=AC.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.value=f;fl.Q.value=q||1;
  const gn=AC.createGain();gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+0.005);gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(fl);fl.connect(gn);gn.connect(master);s.start(t,Math.random()*0.5);s.stop(t+dur+0.02);}
const snd={
  click(){osc('triangle',900,0,0.05,0.08);},
  tick(f){osc('square',f||1400,0,0.025,0.03);},
  thunk(){osc('sine',160,0,0.15,0.25,70);noise(0,0.06,0.08,1200,2);},
  coin(n){for(let i=0;i<(n||1);i++){const t=i*0.06;osc('sine',2400+rnd()*600,t,0.18,0.07);osc('sine',3600+rnd()*500,t+0.02,0.12,0.04);}},
  win(m){const base=523.25;const steps=m>=10?[0,4,7,12,16,19,24]:[0,4,7,12];steps.forEach((s,i)=>osc('triangle',base*Math.pow(2,s/12),i*0.07,0.32,0.12));snd.coin(Math.min(8,2+Math.floor(m)));},
  lose(){osc('sine',220,0,0.25,0.07,140);},
  big(){[0,4,7,12,16,19,24,28,31,36].forEach((s,i)=>{osc('sawtooth',261.6*Math.pow(2,s/12),i*0.08,0.4,0.05);osc('triangle',523.2*Math.pow(2,s/12),i*0.08,0.5,0.08);});for(let i=0;i<14;i++)setTimeout(()=>snd.coin(1),i*90);},
  peg(i){osc('sine',600+i*55+rnd()*20,0,0.06,0.05);},
  buy(){[0,7,12].forEach((s,i)=>osc('triangle',659*Math.pow(2,s/12),i*0.06,0.2,0.09));},
  pop(){noise(0,0.12,0.2,2400,0.8);osc('sine',900,0,0.15,0.15,300);},
  shake(){for(let i=0;i<8;i++)noise(i*0.07,0.05,0.08,3000,3);},
  rarity(r){const ch=[[0,4,7],[0,4,7,11],[0,4,7,11,14],[0,4,7,12,16,19],[0,4,7,12,16,19,24,28]][r];ch.forEach((s,i)=>osc('triangle',523.25*Math.pow(2,s/12),i*0.09,0.6,0.09));},
  boom(){noise(0,0.9,0.4,300,0.5,'lowpass');osc('sine',90,0,0.6,0.3,30);},
};
let engine=null;
function engineStart(){if(!AC||!S.sound)return;const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=80;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=400;const g=AC.createGain();g.gain.value=0.04;o.connect(f);f.connect(g);g.connect(master);o.start();engine={o,f,g};}
function engineSet(m){if(engine){engine.o.frequency.setTargetAtTime(80+Math.log(m)*90,AC.currentTime,0.05);engine.f.frequency.setTargetAtTime(400+Math.log(m)*600,AC.currentTime,0.05);}}
function engineStop(){if(engine){const e=engine;e.g.gain.setTargetAtTime(0,AC.currentTime,0.05);setTimeout(()=>e.o.stop(),300);engine=null;}}

function coinBurst(x,y,n){

// settle a gamble: returns the amount paid
function settle(m,bet,mult,el,quiet){
  S.stats.plays++;const pay=bet*mult;
  if(mult>0){earn(pay);S.stats.wins++;
    if(pay>S.stats.biggest)S.stats.biggest=pay;if(mult>S.stats.biggestMult)S.stats.biggestMult=mult;
    const profitMult=mult;
    if(profitMult>=10&&L('tip'))earn(D.income*10*L('tip'));
    if(!quiet&&el){const r=el.getBoundingClientRect();floatText('+'+$$(pay),r.left+r.width/2,r.top+r.height*0.35,mult>=bet?undefined:undefined);
      if(mult>=1.01){snd.win(mult);coinBurst(r.left+r.width/2,r.top+r.height/2,Math.min(18,3+Math.floor(Math.log2(mult+1)*3)));}else snd.coin(1);
      if(mult>=10)bigWin(mult,pay);}
    else if(quiet&&mult>=25)toast(`${m.name}: +${$$(pay)} (${mult.toFixed(1)}x)`);
  }else if(!quiet&&el){const r=el.getBoundingClientRect();floatText('-'+$$(bet),r.left+r.width/2,r.top+r.height*0.35,'var(--red)');snd.lose();}
  return pay;
}

// ---------- SLOTS ----------
const SL_SYMS=[['cherry',32,8],['lemon',26,12],['bell',18,22],['bar',12,45],['seven',7,120],['diamond',3,450]];
function slotPick(){const syms=SL_SYMS.map(s=>({n:s[0],w:s[1]}));if(has('sl_wild'))syms.push({n:'wild',w:1});const tot=syms.reduce((a,s)=>a+s.w,0);let r=rnd()*tot;for(const s of syms){r-=s.w;if(r<=0)return s.n;}return'cherry';}
const PAYS=Object.fromEntries(SL_SYMS.map(s=>[s[0],s[2]]));
const LINES=[[[0,1],[1,1],[2,1]],[[0,0],[1,0],[2,0]],[[0,2],[1,2],[2,2]],[[0,0],[1,1],[2,2]],[[0,2],[1,1],[2,0]]];
function lineCount(){return[1,3,5][L('sl_lines')];}
function lineMult(sy){const non=sy.filter(s=>s!=='wild');if(!non.length)return 500;if(non.every(s=>s===non[0]))return PAYS[non[0]];
  if((sy[0]==='cherry'||sy[0]==='wild')&&(sy[1]==='cherry'||sy[1]==='wild')&&(sy[0]==='cherry'||sy[1]==='cherry'))return 2.4;return 0;}
let slotBusy=false;
MRENDER.slots=(m,P)=>{
  const strip=s=>`<div class="sym">${SYM[s]}</div>`;
  P.innerHTML=`<div class="machine"><div class="mhead"><div><h2>Slots</h2><div class="msub">${lineCount()} payline${lineCount()>1?'s':''} &middot; luck boosts wins +${Math.round(D.luck*200)}%</div></div></div>
  ${has('sl_jack')?`<div class="jackpot">PROGRESSIVE JACKPOT <span class="num" id="jackN">${$$(S.jackpot)}</span></div>`:''}
  <div class="stage"><div class="reels" id="reels">${[0,1,2].map(i=>`<div class="reel"><div class="strip" id="strip${i}">${['seven','cherry','bell'].map(strip).join('')}</div></div>`).join('')}<svg class="paylines" id="paylines"></svg></div></div>
  ${betBlock(m)}<button class="play" id="playBtn">Spin</button>${autoBlock(m)}</div>`;
  wireBet(m,P);$('playBtn').onclick=()=>{initAudio();MPLAY.slots(m,curBet(m),false);};
};
MPLAY.slots=(m,bet,auto)=>{
  if(slotBusy&&!auto)return;if(!spend(bet)){if(!auto)toast('Not enough cash');return;}
  const grid=[0,1,2].map(()=>[slotPick(),slotPick(),slotPick()]);   // grid[col][row]
  const n=lineCount();const per=bet/n;let mult=0;const wins=[];let jack=false;
  for(let i=0;i<n;i++){const sy=LINES[i].map(([c,r])=>grid[c][r]);const lm=lineMult(sy);if(lm>0){mult+=lm/n;wins.push(i);if(has('sl_jack')&&sy.every(s=>s==='diamond'||s==='wild')&&sy.includes('diamond'))jack=true;}}
  mult*=D.payout*(1+D.luck*2);
  if(has('sl_jack'))S.jackpot+=bet*0.02;
  let jackAmt=0;if(jack){jackAmt=S.jackpot;S.jackpot=5000*Math.pow(10,Math.floor(Math.log10(Math.max(1,maxBet(m)))-2));}
  const reels=$('reels');
  if(reels&&curM==='slots'){
    slotBusy=true;
    [0,1,2].forEach(c=>{const st=$('strip'+c);const syms=[];for(let k=0;k<18+c*6;k++)syms.push(slotPick());syms.push(...grid[c]);
      st.style.transition='none';st.style.transform='translateY(0)';st.innerHTML=syms.map(s=>`<div class="sym">${SYM[s]}</div>`).join('');
      const h=68;const dist=(syms.length-3)*h;void st.offsetWidth;st.style.transition=`transform ${1.0+c*0.35}s cubic-bezier(.15,.65,.25,1.04)`;st.style.transform=`translateY(${-dist}px)`;
      setTimeout(()=>snd.thunk(),1000+c*350);});
    for(let i=0;i<14;i++)setTimeout(()=>snd.tick(1200+rnd()*300),i*95);
    $('paylines').innerHTML='';
    setTimeout(()=>{slotBusy=false;drawPaylines(wins);settle(m,bet,mult,reels,false);if(jackAmt){earn(jackAmt);bigWin(999,jackAmt,'JACKPOT');}},1000+2*350+80);
  }else{settle(m,bet,mult,null,true);if(jackAmt){earn(jackAmt);toast('JACKPOT! +'+$$(jackAmt));}}
};
function drawPaylines(wins){const svg=$('paylines');if(!svg)return;const r=svg.getBoundingClientRect();const w=r.width,h=r.height;const cx=c=>w*(c*2+1)/6,cy=rr=>h*(rr*2+1)/6;
  svg.innerHTML=wins.map(i=>`<polyline points="${LINES[i].map(([c,rr])=>cx(c)+','+cy(rr)).join(' ')}" fill="none" stroke="#f7c948" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".85"><animate attributeName="opacity" values=".2;1;.2" dur=".8s" repeatCount="3"/></polyline>`).join('');}

// ---------- GACHA ----------
function pullCost(){return Math.max(500,D.income*90)*Math.pow(0.94,L('ga_cost'));}
function rollRarity(){
  const boost=1+0.12*L('ga_odds');let w=RAR.map((r,i)=>i?r.p*boost:0);w[0]=Math.max(0.1,1-w.slice(1).reduce((a,b)=>a+b,0));
  const pity=has('ga_pity')&&S.pity>=24;if(pity)w[0]=w[1]=0;
  let x=rnd()*w.reduce((a,b)=>a+b,0);for(let i=0;i<w.length;i++){x-=w[i];if(x<=0)return i;}return 0;
}
function pullOne(){const r=rollRarity();S.pity=r>=2?0:S.pity+1;const pool=CHARMS.filter(c=>c.r===r);const c=pool[Math.floor(rnd()*pool.length)];const before=S.charms[c.id]||0;S.charms[c.id]=before+1;S.pulls++;S.stats.pulls++;return{c,r,lvl:before+1,isNew:!before};}
function fxText(c,lvl){const k=1+0.5*(lvl-1);const f=c.fx;const out=[];
  if(f.income)out.push(`+${Math.round(f.income*k*100)}% income`);if(f.luck)out.push(`+${(f.luck*k*100).toFixed(1)}% luck`);if(f.payout)out.push(`+${Math.round(f.payout*k*100)}% payout`);if(f.speed)out.push(`+${Math.round(f.speed*k*100)}% auto speed`);
  if(f.payoutX)out.push(`x${(f.payoutX+0.25*(lvl-1)).toFixed(2)} payouts`);if(f.incomeX)out.push(`x${(f.incomeX+0.25*(lvl-1)).toFixed(2)} income`);return out.join(', ');}
function charmIcon(c,size){const col=RAR[c.r].hex;return I[c.icon].replace('<svg',`<svg style="color:${col}"`).replace('fill="#f7c948"',`fill="${col}"`);}
const globeSVG=()=>{let caps='';for(let i=0;i<16;i++){const a=hash(i)*Math.PI*2,rr=Math.sqrt(hash(i+40))*58;const x=95+Math.cos(a)*rr,y=92+Math.sin(a)*rr*0.9;const col=RAR[Math.min(4,Math.floor(hash(i+9)*hash(i+3)*6))].hex;caps+=`<circle cx="${x}" cy="${y}" r="13" fill="${col}"/><path d="M${x-13} ${y}h26" stroke="#0004" stroke-width="2"/><circle cx="${x-4}" cy="${y-5}" r="3" fill="#fff6"/>`;}
  return`<svg class="globe" viewBox="0 0 190 220"><rect x="45" y="160" width="100" height="55" rx="12" fill="#ff3d7f"/><rect x="80" y="178" width="30" height="20" rx="5" fill="#2a0d1c"/><circle cx="95" cy="92" r="78" fill="rgba(160,200,255,.12)" stroke="rgba(255,255,255,.35)" stroke-width="3"/>${caps}<ellipse cx="70" cy="50" rx="20" ry="10" fill="#fff3" transform="rotate(-30 70 50)"/></svg>`;};
function hash(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
MRENDER.gacha=(m,P)=>{

    else R.innerHTML=`<div class="glow" style="background:${RAR[best.r].hex}"></div><div class="multi">${res.map((x,i)=>`<div class="m" style="animation-delay:${i*0.07}s;box-shadow:inset 0 0 0 1.5px ${RAR[x.r].hex}"><div class="ic" style="background:${RAR[x.r].hex}22">${charmIcon(x.c)}</div><div style="color:${RAR[x.r].col}">${x.isNew?'NEW':'Lv '+x.lvl}</div><div>${x.c.name}</div></div>`).join('')}</div><div class="tap">TAP TO CONTINUE</div>`;
    R.onclick=()=>{R.classList.remove('on');R.onclick=null;renderMachine();renderCharms();};
    if(best.r>=3)$('app').animate([{transform:'translate(-5px,2px)'},{transform:'translate(5px,-2px)'},{transform:'none'}],{duration:300});};
  R.onclick=open;setTimeout(open,2400);
}

// ---------- FORTUNE WHEEL ----------
const WH=[{n:'1 min',k:'inc',v:60,col:'#3fa9ff'},{n:'Free pull',k:'pull',col:'#ff3d7f'},{n:'5 min',k:'inc',v:300,col:'#3be089'},{n:'2x income 3m',k:'boost',v:180,col:'#2de2e6'},{n:'30 sec',k:'inc',v:30,col:'#9b6bff'},{n:'15 min',k:'inc',v:900,col:'#f7c948'},{n:'2 min',k:'inc',v:120,col:'#ff8a3d'},{n:'1 HOUR',k:'inc',v:3600,col:'#ff3d7f',w:0.4}];
const wheelCD=()=>600*Math.pow(0.85,L('wh_cd'));
let whAng=0,whSpin=null;
MRENDER.wheel=(m,P)=>{
  P.innerHTML=`<div class="machine"><div class="mhead"><div><h2>Fortune Wheel</h2><div class="msub">Free spin every ${Math.round(wheelCD()/60*10)/10} min &middot; prizes x${(1+0.5*L('wh_prize')).toFixed(1)}</div></div></div>
  <div class="stage"><div class="wheelwrap"><div class="ptr"></div><canvas class="mcv" id="whcv" height="280" style="width:280px"></canvas></div></div>
  <button class="play" id="playBtn">Spin</button></div>`;
  $('playBtn').onclick=()=>{initAudio();spinWheel();};
};
function spinWheel(){
  if(whSpin||Date.now()<S.wheelAt)return;
  const ws=WH.map(s=>s.w||1);let x=rnd()*ws.reduce((a,b)=>a+b,0);let k=0;for(;k<WH.length;k++){x-=ws[k];if(x<=0)break;}k=Math.min(k,WH.length-1);
  S.wheelAt=Date.now()+wheelCD()*1000;const seg=Math.PI*2/WH.length;const target=-(k*seg)-seg/2+(rnd()-0.5)*seg*0.6;let end=target-Math.PI*2*6;while(end>whAng-Math.PI*10)end-=Math.PI*2;
  whSpin={t:0,dur:4,start:whAng,end,k,ticks:0};
}
function wheelPrize(k){const p=WH[k];const mul=1+0.5*L('wh_prize');const cv=$('whcv');const r=cv?cv.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
  if(p.k==='inc'){const v=D.income*p.v*mul;earn(v);floatText('+'+$$(v),r.left+r.width/2,r.top+r.height/2,'var(--gold)');snd.win(5);coinBurst(r.left+r.width/2,r.top+r.height/2,12);if(p.v>=900)bigWin(50,v,'JACKPOT');}
  else if(p.k==='boost'){S.boostUntil=Math.max(Date.now(),S.boostUntil)+p.v*mul*1000;recalc();toast('Income doubled for '+Math.round(p.v*mul/60)+' minutes');snd.win(3);}
  else if(p.k==='pull'){if(has('gacha')){S.money+=pullCost();doPull(1);}else{const v=D.income*120;earn(v);toast('+'+$$(v));}}}
function drawWheel(dt){
  if(whSpin){whSpin.t+=dt;const u=Math.min(1,whSpin.t/whSpin.dur);const e=1-Math.pow(1-u,4);whAng=whSpin.start+(whSpin.end-whSpin.start)*e;const tk=Math.floor((whAng)/(Math.PI*2/WH.length));if(tk!==whSpin.ticks){whSpin.ticks=tk;snd.tick(1600);}
    if(u>=1){const k=whSpin.k;whSpin=null;wheelPrize(k);}}
  const cv=$('whcv');if(!cv||curM!=='wheel')return;const W=280,H=280,dpr=Math.min(2.5,devicePixelRatio||1);if(cv.width!==W*dpr){cv.width=W*dpr;cv.height=H*dpr;}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);const R=128,cx=140,cy=140;const seg=Math.PI*2/WH.length;
  g.save();g.translate(cx,cy);g.rotate(whAng);
  WH.forEach((s,i)=>{const a0=i*seg-Math.PI/2,a1=a0+seg;g.fillStyle=s.col;g.beginPath();g.moveTo(0,0);g.arc(0,0,R,a0,a1);g.closePath();g.fill();g.strokeStyle='#0c0918';g.lineWidth=3;g.stroke();
    g.save();g.rotate((a0+a1)/2);g.fillStyle='#0c0918';g.font='800 13px -apple-system,system-ui';g.textAlign='right';g.textBaseline='middle';g.fillText(s.n,R-12,0);g.restore();});
  g.restore();g.strokeStyle='#f7c948';g.lineWidth=6;g.beginPath();g.arc(cx,cy,R+3,0,7);g.stroke();
  for(let i=0;i<16;i++){const a=i/16*Math.PI*2+levelT*0.5;g.fillStyle=i%2?'#fff':'#f7c948';g.beginPath();g.arc(cx+Math.cos(a)*(R+3),cy+Math.sin(a)*(R+3),3,0,7);g.fill();}
  g.fillStyle='#1d1540';g.beginPath();g.arc(cx,cy,22,0,7);g.fill();g.strokeStyle='#f7c948';g.lineWidth=3;g.stroke();
  const b=$('playBtn');if(b){const left=S.wheelAt-Date.now();if(whSpin){b.disabled=true;b.textContent='Spinning…';}else if(left>0){b.disabled=true;const s=Math.ceil(left/1000);b.textContent=`Next spin in ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}else{b.disabled=false;b.textContent='Spin free';}}
}

// =====================================================================
//  UPGRADE TREE
// =====================================================================
const TS=96;  // px per tree unit
let tp={x:0,y:0,init:false};
function nodeVisible(n){return n.id==='root'||(n.p||[]).every(p=>has(p));}
function nodeCost(n){return n.cost*Math.pow(n.g,L(n.id));}
function renderTree(){
  const T=$('tree');const W=$('treeWrap').clientWidth;
  const xs=NODES.map(n=>n.x),ys=NODES.map(n=>n.y);const minX=Math.min(...xs),maxY=Math.max(...ys);
  const ox=-minX*TS+60,oy=70;
  let links='';for(const n of NODES)for(const p of n.p||[]){const a=NODE[p];const on=has(n.id),vis=nodeVisible(n);
    links+=`<line x1="${a.x*TS+ox}" y1="${a.y*TS+oy}" x2="${n.x*TS+ox}" y2="${n.y*TS+oy}" stroke="${on?'#f7c948':vis?'rgba(255,255,255,.35)':'rgba(255,255,255,.08)'}" stroke-width="${on?4:3}" stroke-linecap="round"/>`;}
  let html=`<svg class="links" width="10" height="10">${links}</svg>`;
  for(const [t,x,y] of BRANCHES)html+=`<div class="branchlbl" style="left:${x*TS+ox}px;top:${y*TS+oy}px">${t}</div>`;
  for(const n of NODES){const lv=L(n.id),vis=nodeVisible(n),max=lv>=n.max,can=vis&&!max&&S.money>=nodeCost(n);
    html+=`<button class="node ${n.big?'big':''} ${vis?'':'hidden'} ${max?'max':''} ${can?'can':''}" data-n="${n.id}" style="left:${n.x*TS+ox}px;top:${n.y*TS+oy}px;color:${max?'var(--green)':vis?'var(--gold)':'#777'}">${vis?I[n.icon]:I.lock}${n.id!=='root'&&vis?`<span class="lv num">${n.max===1?(max?'OWNED':$$(nodeCost(n))):lv+'/'+n.max}</span>`:''}</button>`;}
  T.innerHTML=html;
  if(!tp.init&&W>0){tp.init=true;tp.x=W/2-(0*TS+ox);tp.y=20;}
  T.style.transform=`translate(${tp.x}px,${tp.y}px)`;
  T.querySelectorAll('.node').forEach(b=>b.onclick=()=>{if(treeDrag.moved)return;openNode(NODE[b.dataset.n]);});
}
let treeDrag={on:false,moved:false};
(function(){const w=$('treeWrap');let sx,sy,ox,oy;
  w.addEventListener('pointerdown',e=>{treeDrag={on:true,moved:false};sx=e.clientX;sy=e.clientY;ox=tp.x;oy=tp.y;});
  w.addEventListener('pointermove',e=>{if(!treeDrag.on)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)>8)treeDrag.moved=true;if(treeDrag.moved){tp.x=ox+dx;tp.y=oy+dy;$('tree').style.transform=`translate(${tp.x}px,${tp.y}px)`;}});
  const end=()=>{treeDrag.on=false;setTimeout(()=>treeDrag.moved=false,30);};w.addEventListener('pointerup',end);w.addEventListener('pointercancel',end);})();
let sheetNode=null;
function openNode(n){
  snd.click();sheetNode=n;const lv=L(n.id),vis=nodeVisible(n),max=lv>=n.max;
  const req=(n.p||[]).filter(p=>!has(p)).map(p=>NODE[p].name);
  $('sheet').innerHTML=`<div class="row"><div class="bigic" style="color:${max?'var(--green)':'var(--gold)'}">${I[n.icon]}</div><div><h3>${n.name}</h3><div class="msub">${n.max>1?`Level ${lv} / ${n.max}`:max?'Owned':'Unlock'}</div></div></div>
    <p>${n.desc}</p>${!vis?`<div class="eff"><span>Requires</span><b style="color:var(--red)">${req.join(', ')}</b></div>`:''}
    <div class="btns">${max||!vis?'':`<button class="play" id="buy1">Buy ${$$(nodeCost(n))}</button>${n.max>1?'<button class="ghost" id="buyMax">Buy max</button>':''}`}${max||!vis?'<button class="play" id="closeS">Close</button>':''}</div>`;
  $('sheet').classList.add('on');$('shade').classList.add('on');
  if($('buy1'))$('buy1').onclick=()=>{buy(n,1);};if($('buyMax'))$('buyMax').onclick=()=>buy(n,999);if($('closeS'))$('closeS').onclick=closeSheet;
}
function closeSheet(){$('sheet').classList.remove('on');$('shade').classList.remove('on');sheetNode=null;}
$('shade').onclick=closeSheet;
function buy(n,count){
  initAudio();let bought=0;
  while(bought<count&&L(n.id)<n.max&&nodeVisible(n)){const c=nodeCost(n);if(!spend(c))break;S.up[n.id]=L(n.id)+1;bought++;}
  if(!bought){toast('Not enough cash');return;}
  snd.buy();recalc();renderTree();renderMList();
  if(n.big&&n.id!=='root'){toast(n.name+' unlocked');}
  if(n.id==='vip')renderStats();
  if(L(n.id)>=n.max)closeSheet();else openNode(n);
}

// =====================================================================
//  CHARMS & VIP TABS
// =====================================================================
function renderCharms(){
  const owned=CHARMS.filter(c=>S.charms[c.id]).length;
  $('charmView').innerHTML=`<div class="secttl">Bonuses from charms</div><div class="totals"><div class="tot"><b style="color:var(--green)">+${Math.round(charmSum('income')*100)}%</b><small>income${charmMul('incomeX')>1?' &middot; x'+charmMul('incomeX').toFixed(2):''}</small></div><div class="tot"><b style="color:var(--cyan)">+${(charmSum('luck')*100).toFixed(1)}%</b><small>luck</small></div><div class="tot"><b style="color:var(--gold)">+${Math.round(charmSum('payout')*100)}%</b><small>payout${charmMul('payoutX')>1?' &middot; x'+charmMul('payoutX').toFixed(2):''}</small></div></div>
  <div class="secttl">Collection &middot; ${owned}/${CHARMS.length}</div><div class="grid">${CHARMS.map(c=>{const lv=S.charms[c.id]||0;const r=RAR[c.r];
    return lv?`<div class="charm" style="border-color:${r.hex}66"><span class="lv">Lv ${lv}</span><div class="ic" style="background:${r.hex}22">${charmIcon(c)}</div><div class="nm">${c.name}</div><div class="ef">${fxText(c,lv)}</div></div>`
    :`<div class="charm unk"><div class="ic">${I.lock}</div><div class="nm" style="color:${r.col}">${r.name}</div><div class="ef">Unknown</div></div>`;}).join('')}</div>
  ${has('gacha')?'':'<div class="msub" style="text-align:center;margin-top:14px">Unlock the Capsule Machine in the upgrade tree to pull charms.</div>'}`;
}
function vipGain(){return Math.max(0,Math.floor(Math.sqrt(S.life/1e9))-S.vip);}
function renderStats(){
  const st=S.stats;
  $('statsView').innerHTML=`<div class="secttl">VIP status</div><div class="vip"><h3>${I.crown.replace('<svg','<svg width="22" height="22" style="color:var(--gold)"')} ${S.vip} VIP star${S.vip===1?'':'s'}</h3>
    <p>Each star: +10% income, payouts and max bets, forever. Becoming VIP resets your cash and upgrades. Charms are kept.</p>
    ${has('vip')?`<button class="play" id="vipBtn" ${vipGain()?'':'disabled'}>Become VIP: +${vipGain()} star${vipGain()===1?'':'s'}</button><div class="msub" style="text-align:center;margin-top:8px">Next star at ${$$(Math.pow(Math.floor(Math.sqrt(S.life/1e9))+1,2)*1e9)} lifetime</div>`:`<div class="msub">Unlock the VIP Lounge at the bottom of the upgrade tree.</div>`}</div>
  <div class="secttl">Stats</div>
  <div class="statrow"><span>Lifetime earnings</span><b class="num">${$$(S.life)}</b></div>
  <div class="statrow"><span>Games played</span><b class="num">${fmt(st.plays,0)}</b></div>
  <div class="statrow"><span>Win rate</span><b class="num">${st.plays?Math.round(st.wins/st.plays*100):0}%</b></div>
  <div class="statrow"><span>Biggest win</span><b class="num">${$$(st.biggest)}</b></div>
  <div class="statrow"><span>Best multiplier</span><b class="num">${st.biggestMult.toFixed(1)}x</b></div>
  <div class="statrow"><span>Capsules opened</span><b class="num">${fmt(st.pulls,0)}</b></div>
  <div class="secttl">Settings</div>
  <div class="autorow"><button class="autobtn ${S.sound?'on':''}" id="sndBtn">Sound ${S.sound?'ON':'OFF'}</button><button class="autobtn" id="resetBtn" style="color:var(--red)">Reset save</button></div>
  <div class="msub" style="text-align:center;margin:18px 0 6px">Play money only. No real money is involved.</div>`;
  if($('vipBtn'))$('vipBtn').onclick=()=>modal(`<h3>Become VIP?</h3><p>Cash and upgrades reset. You keep your charms and gain <b style="color:var(--gold)">${vipGain()}</b> VIP stars (+${vipGain()*10}% to everything).</p><button class="play" id="mYes">Become VIP</button><button class="autobtn" style="width:100%;margin-top:10px" id="mNo">Not yet</button>`,()=>{$('mYes').onclick=()=>{prestige();closeModal();};$('mNo').onclick=closeModal;});
  $('sndBtn').onclick=()=>{S.sound=!S.sound;if(master)master.gain.value=S.sound?0.6:0;renderStats();};
  $('resetBtn').onclick=()=>modal(`<h3>Reset everything?</h3><p>This deletes all progress, including charms and VIP stars.</p><button class="play" id="mYes" style="background:linear-gradient(180deg,#ff8a8a,#e03a3a);box-shadow:0 6px 0 #8a1717">Reset</button><button class="autobtn" style="width:100%;margin-top:10px" id="mNo">Cancel</button>`,()=>{$('mYes').onclick=()=>{localStorage.removeItem('highroller');S=FRESH();shownMoney=100;recalc();closeModal();renderAll();};$('mNo').onclick=closeModal;});
}
function prestige(){const g=vipGain();S.vip+=g;const keep={charms:S.charms,vip:S.vip,life:S.life,stats:S.stats,pulls:S.pulls,sound:S.sound,pity:S.pity};S=Object.assign(FRESH(),keep);shownMoney=S.money;recalc();renderAll();bigWin(100,0,'VIP x'+S.vip);$('bigA').textContent='+'+g+' star'+(g===1?'':'s');}
function modal(html,wire){$('modalBox').innerHTML=html;$('modal').classList.add('on');wire&&wire();}
function closeModal(){$('modal').classList.remove('on');}

// =====================================================================
//  LOOP, AUTOPLAY, OFFLINE
// =====================================================================
const autoT={};let levelT=0,saveT=0,uiT=0;
function tick(dt){
  levelT+=dt;recalcIfBoost();
  earn(D.income*dt);
  if(has('sl_jack'))S.jackpot+=D.income*dt*0.01;
  for(const m of MACH){if(!m.auto||!has(m.auto)||!S.auto[m.id]||!unlocked(m))continue;autoT[m.id]=(autoT[m.id]||0)+dt;const iv=autoInterval(m);
    if(autoT[m.id]>=iv){autoT[m.id]=0;const bet=Math.max(1,Math.min(maxBet(m),S.money*(S.autoPct[m.id]||5)/100));
      if(m.id==='crash'&&cr.state!=='idle')continue;if(m.id==='slots'&&slotBusy)continue;if(m.id==='flip'&&flipBusy)continue;if(m.id==='roulette'&&roSpin)continue;
      if(S.money>=bet)MPLAY[m.id](m,bet,true);}}
  drawPlinko(dt);drawRoulette(dt);drawCrash(dt);drawWheel(dt);
  // money counter eases toward the real value
  shownMoney+=(S.money-shownMoney)*Math.min(1,dt*8);if(Math.abs(S.money-shownMoney)<0.01)shownMoney=S.money;
  $('moneyN').textContent=$$(shownMoney);
  uiT+=dt;if(uiT>0.25){uiT=0;
    $('incomeN').textContent='+'+$$(D.income)+'/s';$('luckN').textContent=(D.luck*100).toFixed(1)+'%';$('payN').textContent='x'+D.payout.toFixed(2);
    const bl=S.boostUntil-Date.now();$('boostPill').style.display=bl>0?'flex':'none';if(bl>0)$('boostPill').innerHTML=I.bolt.replace('<svg','<svg width="14" height="14"')+'2x '+Math.ceil(bl/1000)+'s';
    $('vipPill').style.display=S.vip?'flex':'none';$('vipPill').innerHTML=I.crown.replace('<svg','<svg width="14" height="14" style="color:var(--gold)"')+S.vip;
    const canBuy=NODES.some(n=>nodeVisible(n)&&L(n.id)<n.max&&S.money>=nodeCost(n));$('treeDot').style.display=canBuy?'block':'none';
    if($('treeView').classList.contains('on')&&!treeDrag.on)renderTree();
    if(curM==='gacha'&&$('pull1')){const c=pullCost();$('pull1').textContent='Pull '+$$(c);if($('pull10'))$('pull10').textContent='10x '+$$(c*10);}
    if(curM==='slots'&&$('jackN'))$('jackN').textContent=$$(S.jackpot);
    const m=MACH.find(x=>x.id===curM);if(m&&m.bet&&$('bet_'+m.id)){const mx=maxBet(m);if(S.bets[m.id]>mx)S.bets[m.id]=mx;updBet(m);}
  }
  saveT+=dt;if(saveT>5){saveT=0;persist();}
}
let boostWas=false;function recalcIfBoost(){const b=Date.now()<S.boostUntil;if(b!==boostWas){boostWas=b;recalc();}}
let lastF=performance.now();
function frame(now){const dt=clamp((now-lastF)/1000,0,0.1);lastF=now;try{tick(dt);}catch(e){console.error(e);}requestAnimationFrame(frame);}
function offline(){
  const away=(Date.now()-S.last)/1000;if(away<60)return;
  const secs=Math.min(away,D.offlineH*3600);const gain=D.income*secs*0.5;if(gain<1)return;earn(gain);
  modal(`<h3>Welcome back</h3><p>You were away for ${away>3600?(away/3600).toFixed(1)+' hours':Math.round(away/60)+' minutes'}. Your hustles kept paying${away>secs?` (capped at ${D.offlineH}h)`:''}.</p><div class="big num">+${$$(gain)}</div><button class="play" id="mYes">Collect</button>`,()=>{$('mYes').onclick=()=>{initAudio();snd.win(5);closeModal();coinBurst(innerWidth/2,innerHeight/2,16);};});
}
function renderAll(){renderMList();renderMachine();renderTree();renderCharms();renderStats();}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{initAudio();snd.click();document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===b.dataset.v));
  if(b.dataset.v==='treeView')renderTree();if(b.dataset.v==='charmView')renderCharms();if(b.dataset.v==='statsView')renderStats();if(b.dataset.v==='casinoView')renderMachine();});
document.querySelectorAll('[data-ic]').forEach(e=>e.outerHTML=I[e.dataset.ic]);
$('coinIc').innerHTML=I.coin;
addEventListener('visibilitychange',()=>{if(document.hidden)persist();});
addEventListener('pagehide',persist);
recalc();renderAll();offline();requestAnimationFrame(frame);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
