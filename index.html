<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clay">
<meta name="theme-color" content="#2b1a12">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Clay of Bhaktapur</title>
<style>
:root{--card:rgba(36,20,13,.72);--line:rgba(255,230,200,.13);--cream:#f7ead6;--mut:#cfb193;--acc:#e9a23b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2b1a12;color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;overflow:hidden}
canvas.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
svg{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 12px 0;display:flex;gap:8px;align-items:center;pointer-events:none}
#order{flex:1;padding:8px 12px;min-width:0}
#order .who{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#order .what{font-size:16px;font-weight:650;margin-top:1px}
#coins{display:flex;align-items:center;gap:6px;padding:11px 12px;font-weight:700;font-variant-numeric:tabular-nums}
#hint{position:absolute;left:20px;right:20px;text-align:center;font-size:15px;line-height:1.3;font-weight:600;color:var(--cream);text-shadow:0 1px 4px rgba(0,0,0,.7);pointer-events:none}
#hint.warn{color:#ffd27a}
#btns{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:0 12px calc(env(safe-area-inset-bottom) + 10px)}
#btns button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 11px;font-size:12px;font-weight:600;position:relative;overflow:hidden}
#btns button.on{border-color:rgba(233,162,59,.7);color:#ffd9a0}
#btns button.primary{background:linear-gradient(#e9a23b,#c97e22);color:#2b1a12;border-color:transparent}
#btns button:disabled{opacity:.4}
#wetFill{position:absolute;left:12px;right:12px;bottom:5px;height:3px;border-radius:2px;background:rgba(255,255,255,.12)}
#wetFill i{display:block;height:100%;border-radius:2px;background:#7cc3e6;width:100%}
#wetFill i.low{background:#e2685a}
.overlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:16px 14px calc(env(safe-area-inset-bottom) + 14px);z-index:5}
.overlay.dim{background:rgba(20,10,6,.6)}
.overlay.hidden{display:none}
.sheet{width:100%;max-width:440px;padding:18px 18px 16px;text-align:center;background:rgba(36,20,13,.9)}
.sheet h1{font-size:28px;margin:4px 0 2px}
.sheet h2{font-size:20px;margin:2px 0}
.sheet p{color:var(--mut);font-size:14px;line-height:1.4;margin:8px 0}
.sheet .big{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.sheet .label{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc);font-weight:700}
.steps{display:flex;flex-direction:column;gap:10px;text-align:left;margin:14px 0 6px}
.step{display:flex;gap:12px;align-items:center;font-size:14px;line-height:1.35}
.step svg{flex:none}
.step b{color:#ffd9a0}
.row{display:flex;gap:10px;margin-top:14px}
.row button{flex:1;padding:14px;border-radius:14px;font-weight:700;font-size:16px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.row button.primary{background:linear-gradient(#e9a23b,#c97e22);color:#2b1a12;border:0}
.coinline{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:17px;color:#ffd9a0}
.small{font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<canvas id="under" class="layer"></canvas>
<canvas id="gl" class="layer"></canvas>
<canvas id="fx" class="layer"></canvas>

<div id="hud">
  <div id="order" class="card"><div class="who" id="who"></div><div class="what" id="what"></div></div>
  <div id="coins" class="card">
    <svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#e9a23b"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#8a5512" stroke-width="1.6"/><rect x="10" y="7.5" width="4" height="9" rx="1" fill="#8a5512"/></svg>
    <span id="coinN">0</span>
  </div>
</div>
<div id="hint"></div>

<div id="btns">
  <button id="bWater" class="card">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3c3.5 4.3 6 7.6 6 10.6A6 6 0 0 1 6 13.6C6 10.6 8.5 7.3 12 3z"/><path d="M9.2 14.2a2.9 2.9 0 0 0 2.6 2.7" stroke-linecap="round"/></svg>
    Water<span id="wetFill"><i id="wetBar"></i></span>
  </button>
  <button id="bGuide" class="card on">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 20h8M9 20c-1.8-2-3-4.6-3-7.5S7.2 7.2 9 5.5V4h6v1.5c1.8 1.7 3 4.1 3 7s-1.2 5.5-3 7.5" stroke-dasharray="2.4 2.2"/></svg>
    Guide
  </button>
  <button id="bReset" class="card">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></svg>
    New clay
  </button>
  <button id="bFire" class="card primary">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3.2 5 5.4 5 10a5 5 0 0 1-10 0c0-2.4 1.2-3.9 2.4-5 .2 1.8 1 2.9 2.1 3.4C11 9 11.3 5.6 12 3z"/></svg>
    Fire
  </button>
</div>

<div id="start" class="overlay dim">
  <div class="sheet card">
    <div class="label">Pottery Square</div>
    <h1>Clay of Bhaktapur</h1>
    <div class="steps">
      <div class="step">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#e9a23b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 34c-2-5-3-9-3-14s1.5-9 3-12M26 34c2-5 3-9 3-14s-1.5-9-3-12"/><path d="M33 20h-6M30 17l-3 3 3 3"/><circle cx="35" cy="20" r="2" fill="#e9a23b"/></svg>
        <div><b>Drag the side</b> of the clay in or out. The wall follows your finger.</div>
      </div>
      <div class="step">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#e9a23b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 34V16M29 34V16"/><ellipse cx="20" cy="16" rx="9" ry="3"/><path d="M20 11V4M17 7l3-3 3 3"/></svg>
        <div><b>Drag the rim</b> up or down to make it taller or shorter.</div>
      </div>
      <div class="step">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#e9a23b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6c3 5 7 8 7 13a7 7 0 0 1-14 0c0-5 4-8 7-13z"/></svg>
        <div><b>Water</b> keeps it smooth. When it matches the outline, <b>Fire</b> it.</div>
      </div>
    </div>
    <p class="small">Sound on: turn off the silent switch.</p>
    <div class="row"><button id="bStart" class="primary">Start</button></div>
  </div>
</div>

<div id="modal" class="overlay hidden"><div class="sheet card" id="modalSheet"></div></div>

<script>
'use strict';
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const $=id=>document.getElementById(id);

// ---------- constants ----------
const N=96;          // profile samples bottom -> top
const K=0.22;        // camera tilt: ellipse squash
const WRU=100;       // wheel head radius in units
const WALL=10;       // wall thickness (units)
const RMIN=WALL+5, RMAX=90;
const START_R=46, START_H=125;

const ORDERS=[
  {id:'round', who:'Tourist from Lyon', what:'Round belly vase', H:200, price:40,
   pts:[[0,40],[0.35,72],[0.7,42],[0.86,28],[1,36]],
   react:['"Magnifique! This goes on my shelf in France."','"Very nice, I will take it."','"It has character. A souvenir is a souvenir."']},
  {id:'tulip', who:'Flower seller, Taumadhi', what:'Tulip vase', H:210, price:35,
   pts:[[0,34],[0.45,50],[0.75,40],[1,64]],
   react:['"My marigolds will look like a festival in this."','"Good. It stands straight and holds water."','"Hm. The flowers won\'t mind."']},
  {id:'ghaito', who:'Grandmother next door', what:'Ghaito water pot', H:170, price:55,
   pts:[[0,44],[0.42,82],[0.75,56],[0.9,30],[1,40]],
   react:['"Just like the ones my mother carried. Thank you, child."','"It will carry water. Well done."','"It holds water. Mostly."']},
  {id:'bottle', who:'Monk from the monastery', what:'Tall bottle vase', H:250, price:50,
   pts:[[0,38],[0.32,56],[0.6,38],[0.82,18],[1,24]],
   react:['"Patience made this. It shows."','"A good vessel for the altar."','"Every pot teaches something."']},
  {id:'bowl', who:'Curd shop owner', what:'Wide flower bowl', H:110, price:30,
   pts:[[0,40],[0.6,70],[1,82]],
   react:['"Wide and generous. Perfect."','"Good bowl, good price."','"A bit wobbly, but I\'ll use it."']},
];
function profAt(pts,t){
  if(t<=pts[0][0])return pts[0][1];
  for(let i=1;i<pts.length;i++){if(t<=pts[i][0]){const a=pts[i-1],b=pts[i];const u=(t-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*(1-Math.cos(u*Math.PI))/2;}}
  return pts[pts.length-1][1];
}
function rAt(r,t){const f=clamp(t,0,1)*(N-1);const i=Math.floor(f);if(i>=N-1)return r[N-1];const u=f-i;return r[i]*(1-u)+r[i+1]*u;}

// ---------- save ----------
let save={coins:0,made:0,order:0,best:{}};
try{const s=JSON.parse(localStorage.getItem('clay-save2')||'null');if(s)save=Object.assign(save,s);}catch(e){}
function persist(){try{localStorage.setItem('clay-save2',JSON.stringify(save));}catch(e){}}
const order=()=>ORDERS[save.order%ORDERS.length];

// ---------- layers / layout ----------
const under=$('under'),ug=under.getContext('2d');
const fx=$('fx'),fg=fx.getContext('2d');
const glc=$('gl');
let W,H,DPR,GDPR,S,cx,baseY,topLimit,bg,maxH;
function layout(){
  DPR=Math.min(window.devicePixelRatio||1,3);GDPR=Math.min(DPR,2);
  W=window.innerWidth;H=window.innerHeight;
  for(const c of[under,fx]){c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);}
  ug.setTransform(DPR,0,0,DPR,0,0);fg.setTransform(DPR,0,0,DPR,0,0);
  glc.width=Math.round(W*GDPR);glc.height=Math.round(H*GDPR);
  S=Math.min(W*0.47,H*0.27)/WRU;
  cx=W/2;
  const btnH=$('btns').getBoundingClientRect().height||80;
  baseY=H-btnH-WRU*S*K-34*S-6;
  topLimit=($('hud').getBoundingClientRect().bottom||90)+40;
  maxH=Math.min(300,(baseY-topLimit)/S-18);
  $('hint').style.top=(topLimit-26)+'px';
  bg=makeBackground();
}
window.addEventListener('resize',layout);

// ---------- soft, out-of-focus background ----------
function makeBackground(){
  const sw=Math.max(40,Math.round(W/7)),sh=Math.max(60,Math.round(H/7));
  const lo=document.createElement('canvas');lo.width=sw;lo.height=sh;
  const g=lo.getContext('2d');const s=sw/W;g.scale(s,s);
  const floorY=baseY-WRU*S*K*0.6;
  // brick wall in warm late light
  let gr=g.createLinearGradient(0,0,0,floorY);
  gr.addColorStop(0,'#5e3021');gr.addColorStop(0.5,'#7d412d');gr.addColorStop(1,'#8a4b33');
  g.fillStyle=gr;g.fillRect(0,0,W,floorY);
  g.fillStyle='rgba(40,16,8,.22)';
  for(let y=0,row=0;y<floorY;y+=11,row++)for(let x=(row%2)*14-14;x<W;x+=28)g.fillRect(x,y,26,1.6);
  // carved wooden window, left
  const wx=W*0.06,wy=H*0.16,ww=W*0.34,wh=H*0.26;
  g.fillStyle='#2e170d';g.fillRect(wx-10,wy-10,ww+20,wh+20);
  g.fillStyle='#160a05';g.fillRect(wx,wy,ww,wh);
  g.strokeStyle='#5a3220';g.lineWidth=3;
  for(let i=1;i<6;i++){g.beginPath();g.moveTo(wx+i*ww/6,wy);g.lineTo(wx+i*ww/6,wy+wh);g.stroke();}
  for(let i=1;i<5;i++){g.beginPath();g.moveTo(wx,wy+i*wh/5);g.lineTo(wx+ww,wy+i*wh/5);g.stroke();}
  // shelf of finished pots, right
  const shy=H*0.34;g.fillStyle='#3a2014';g.fillRect(W*0.58,shy,W*0.5,8);
  [[0.64,26,40],[0.74,20,52],[0.84,30,36],[0.94,22,46]].forEach(([px,r,h],i)=>{
    const x=W*px;g.fillStyle=['#b06a44','#9a5a3a','#c47c52','#a8603e'][i];
    g.beginPath();g.ellipse(x,shy-h*0.45,r,h*0.45,0,0,7);g.fill();g.fillRect(x-r*0.4,shy-h,r*0.8,h*0.3);
  });
  // warm light shaft
  g.fillStyle='rgba(255,196,120,.16)';
  g.beginPath();g.moveTo(W*0.45,0);g.lineTo(W*0.95,0);g.lineTo(W*0.75,floorY);g.lineTo(W*0.05,floorY);g.fill();
  // floor
  gr=g.createLinearGradient(0,floorY,0,H);
  gr.addColorStop(0,'#6b3f2b');gr.addColorStop(1,'#3a2117');
  g.fillStyle=gr;g.fillRect(0,floorY,W,H-floorY);
  // drying pots on the ground
  [[0.08,0.9],[0.2,0.75],[0.86,0.85],[0.97,0.7]].forEach(([px,sc])=>{
    const x=W*px,y=floorY+16*sc;g.fillStyle='#a8673f';
    g.beginPath();g.ellipse(x,y-22*sc,24*sc,22*sc,0,0,7);g.fill();
  });
  // upscale = natural blur (depth of field)
  const c=document.createElement('canvas');c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);
  const cg=c.getContext('2d');cg.imageSmoothingEnabled=true;cg.imageSmoothingQuality='high';
  cg.drawImage(lo,0,0,c.width,c.height);
  cg.setTransform(DPR,0,0,DPR,0,0);
  gr=cg.createRadialGradient(cx,baseY-120*S,Math.min(W,H)*0.2,cx,baseY-120*S,Math.max(W,H)*0.85);
  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(12,5,2,.6)');
  cg.fillStyle=gr;cg.fillRect(0,0,W,H);
  return c;
}

// ---------- WebGL clay ----------
const gl=glc.getContext('webgl',{alpha:true,premultipliedAlpha:true,antialias:false});
const VS=`attribute vec2 aPos;uniform vec2 uRes;varying vec2 vPix;
void main(){vPix=aPos;gl_Position=vec4(aPos.x/uRes.x*2.0-1.0,1.0-aPos.y/uRes.y*2.0,0.0,1.0);}`;
const FS=`precision highp float;
varying vec2 vPix;
uniform sampler2D uProf;uniform float uN;
uniform vec2 uC;uniform float uS,uH,uWall,uTheta,uWet,uFired,uK,uSmoke;
uniform vec4 uTouch; // t, side, strength, mode(0 shape,1 rim)
float dec(vec4 a){return (a.r*255.0*256.0+a.g*255.0)/65535.0*200.0;}
float prof(float t){t=clamp(t,0.0,1.0);float f=t*(uN-1.0);float i=floor(f);float u=f-i;
  float ra=dec(texture2D(uProf,vec2((i+0.5)/uN,0.5)));float rb=dec(texture2D(uProf,vec2((min(i+1.0,uN-1.0)+0.5)/uN,0.5)));return mix(ra,rb,u);}
float fresh(float t){t=clamp(t,0.0,1.0);return texture2D(uProf,vec2((floor(t*(uN-1.0)+0.5)+0.5)/uN,0.5)).b;}
float hash(vec3 p){p=fract(p*0.3183099+0.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float noise(vec3 x){vec3 i=floor(x);vec3 f=fract(x);f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}
vec3 baseCol(float grain){
  vec3 wet=vec3(0.42,0.235,0.155),dry=vec3(0.63,0.45,0.34),fired=vec3(0.76,0.41,0.25);
  vec3 c=mix(dry,wet,uWet);c=mix(c,fired,uFired);
  return c*(0.86+0.28*grain);
}
vec3 shade(vec3 n,vec3 c,float wetness,float extra){
  vec3 L=normalize(vec3(-0.55,0.55,0.65));vec3 V=normalize(vec3(0.0,0.22,1.0));
  float d=dot(n,L);float diff=clamp((d+0.35)/1.35,0.0,1.0);
  vec3 bounce=vec3(1.0,0.72,0.5)*max(dot(n,normalize(vec3(0.8,-0.2,0.5))),0.0)*0.22;
  vec3 col=c*(vec3(0.30,0.24,0.21)+vec3(1.05,0.95,0.85)*diff*0.95+bounce);
  vec3 Hh=normalize(L+V);float nh=max(dot(n,Hh),0.0);
  float spec=pow(nh,mix(10.0,46.0,wetness))*(0.03+0.42*wetness)+pow(nh,3.0)*0.05*wetness;
  spec*=(1.0-uFired*0.9)*(1.0+extra);
  return col+vec3(1.0,0.93,0.85)*spec;
}
void main(){
  float x=(vPix.x-uC.x)/uS;float y=(uC.y-vPix.y)/uS;
  float Rt=prof(1.0);float Ri=max(Rt-uWall,0.0);
  float rimD=length(vec2(x,(y-uH)/uK));
  float px=1.0/uS; // one screen pixel in units
  vec3 col;float alpha=1.0;
  if(rimD<Rt+px){
    alpha=clamp((Rt-rimD)/px+0.5,0.0,1.0);
    float a=atan(x,-(y-uH)/uK)-uTheta;
    float grain=noise(vec3(cos(a)*rimD,sin(a)*rimD,uH)*0.14);
    vec3 c=baseCol(grain);
    if(rimD<Ri){
      // looking down into the pot
      float v=(y-uH)/uK/max(Ri,0.001); // -1 front .. 1 back
      float depth=smoothstep(-1.0,1.0,v);
      vec3 inner=c*(0.14+0.55*depth*depth)+vec3(0.06,0.03,0.02)*uWet*depth;
      float edge=smoothstep(Ri-1.5,Ri,rimD);
      vec3 n=normalize(vec3(x/Rt*0.6,1.0,0.25));
      col=mix(inner,shade(n,c,uWet,0.0),edge);
    }else{
      float s=clamp((rimD-Ri)/max(Rt-Ri,0.001),0.0,1.0);
      float rx=x/max(rimD,0.001);float rz=-(y-uH)/uK/max(rimD,0.001);
      vec3 n=normalize(vec3(rx*s*0.9,1.0-s*0.6,max(0.15,rz)*s*0.9));
      col=shade(n,c*1.05,uWet,0.0);
    }
  }else{
    float t=y/uH;
    float r0=prof(0.0);
    if(t<0.0){
      float d=length(vec2(x,y/uK));if(d>r0+px)discard;
      alpha=clamp((r0-d)/px+0.5,0.0,1.0);t=0.0;
    }else if(t>1.0){discard;}
    float R=prof(t);
    if(abs(x)>R+px)discard;
    if(y>=0.0)alpha=clamp((R-abs(x))/px+0.5,0.0,1.0);
    float u=clamp(x/R,-0.999,0.999);float nz=sqrt(1.0-u*u);
    float e=1.5/uH;float slope=(prof(t+e)-prof(t-e))/(2.0*e*uH);
    float a=asin(u)-uTheta;
    float fr=fresh(t);
    // throwing rings: a gentle spiral groove, sharper where freshly shaped
    float ph=y*0.62+a*0.16;
    float ridge=cos(ph)*(0.07+0.22*fr)+cos(ph*2.3+1.0)*0.04;
    vec3 n=normalize(vec3(u,-slope+ridge,nz));
    vec3 q=vec3(cos(a)*R,sin(a)*R,y);
    float grain=noise(q*0.16)*0.6+noise(q*0.5)*0.4;
    vec3 c=baseCol(grain);

// ---------- audio ----------
let AC=null,master,hum,humF,squish,squishF;
function initAudio(){
  if(AC){if(AC.state!=='running')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);
  const len=AC.sampleRate*2;
  const brown=AC.createBuffer(1,len,AC.sampleRate),bd=brown.getChannelData(0);let l=0;
  for(let i=0;i<len;i++){l=(l+0.02*(Math.random()*2-1))/1.02;bd[i]=l*3.5;}
  const white=AC.createBuffer(1,len,AC.sampleRate),wd=white.getChannelData(0);for(let i=0;i<len;i++)wd[i]=Math.random()*2-1;
  AC._white=white;
  let s=AC.createBufferSource();s.buffer=brown;s.loop=true;humF=AC.createBiquadFilter();humF.type='lowpass';humF.frequency.value=160;
  hum=AC.createGain();hum.gain.value=0;s.connect(humF);humF.connect(hum);hum.connect(master);s.start();
  s=AC.createBufferSource();s.buffer=white;s.loop=true;squishF=AC.createBiquadFilter();squishF.type='bandpass';squishF.frequency.value=600;squishF.Q.value=0.8;
  squish=AC.createGain();squish.gain.value=0;s.connect(squishF);squishF.connect(squish);squish.connect(master);s.start();
}
function burst(dur,type,f0,f1,gain,q){
  if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=AC._white;
  const f=AC.createBiquadFilter();f.type=type;f.Q.value=q||1;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+dur+0.05);
}
function tone(f,dur,gain,f1){
  if(!AC)return;const t=AC.currentTime,o=AC.createOscillator();o.frequency.setValueAtTime(f,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
}
const sfx={
  splash(){burst(0.6,'bandpass',2600,500,0.22,0.8);setTimeout(()=>burst(0.35,'bandpass',1400,600,0.1,1.2),110);},
  plop(){tone(170,0.22,0.3,80);burst(0.18,'lowpass',900,200,0.15);},
  bowl(f){[1,2.76,5.4].forEach((m,i)=>tone(f*m,[3.2,1.9,1.1][i],[0.15,0.06,0.03][i]));},
  crackle(){for(let i=0;i<22;i++)setTimeout(()=>burst(0.05,'highpass',2500+Math.random()*3500,1800,0.06+Math.random()*0.08),i*60+Math.random()*50);},
  whoosh(){burst(1.2,'lowpass',300,1400,0.18,0.7);},
};
function updateAudio(){
  if(!AC)return;const t=AC.currentTime;
  hum.gain.setTargetAtTime(firing?0.03:clamp(Math.abs(omega)/8,0,1.4)*0.16*(1+0.12*Math.sin(theta)),t,0.08);
  humF.frequency.setTargetAtTime(100+Math.abs(omega)*22,t,0.1);

  if(touch&&touch.mode!==2&&!firing){
    const m=touch.speed;
    g=(touch.mode===1?0.10:0.06)+Math.min(0.16,m*0.0006);
    f=P.wet<0.2?1700+Math.sin(theta*4)*250:(touch.mode===1?320:480)+Math.min(900,m*1.4)+Math.sin(theta*3)*70;

// ---------- simulation ----------
function step(dt){
  // wheel: a helper keeps it turning at a steady pace; flick the wheel to speed it up for a while
  const target=firing?0:7;
  omega+=(target-omega)*(1-Math.exp(-(firing?1.6:0.6)*dt));
  theta+=omega*dt;
  if(!P)return;

  if(intro>0){
    intro+=dt/0.7;const u=Math.min(1,intro);const e=1-Math.pow(1-u,3);
    P.H=lerp(40,START_H,e);P.r.fill(lerp(72,START_R,e));
    if(u>=1)intro=0;
  }

  if(touch&&touch.mode!==2&&!firing&&intro===0){
    if(performance.now()-touch.lastT>60)touch.speed*=Math.pow(0.01,dt);
    const spin=clamp(Math.abs(omega)/5,0,1);
    const dryMul=P.wet<0.2?0.55:1;
    touch.str=Math.min(1,touch.str+dt*6);
    if(touch.mode===0){
      const t=clamp(touch.uy/P.H,0,1);touch.t=t;
      const side=Math.sign(touch.ux)||touch.side;touch.side=side;
      const targetR=clamp(Math.abs(touch.ux),RMIN,RMAX);
      const sig=15/P.H;const rate=1-Math.exp(-16*spin*dryMul*dt);
      let moved=0;
      for(let k=0;k<N;k++){
        const g=Math.exp(-Math.pow((k/(N-1)-t)/sig,2));if(g<0.01)continue;
        const d=(targetR-P.r[k])*g*rate;P.r[k]+=d;moved+=Math.abs(d);
        P.fresh[k]=Math.max(P.fresh[k],g*0.9);
      }
      shapedAmt+=moved;
      P.wet=Math.max(0,P.wet-(0.012+touch.speed*0.00004)*dt);
      if(spin>0.5&&Math.random()<(0.15+Math.min(0.6,touch.speed*0.004))*dt*20){
        const R=rAt(P.r,t)*S;
        parts.push({x:cx+side*R,y:baseY-t*P.H*S,vx:(side*(60+Math.random()*130)+70)*S,vy:-(30+Math.random()*130)*S,life:0.8,r:(1+Math.random()*1.8)*S});
      }
    }else if(touch.mode===1){
      const want=clamp(touch.startH+(touch.uy-touch.startUy),45,maxH);
      const prev=P.H;P.H+=(want-P.H)*(1-Math.exp(-18*dryMul*dt));
      stretched+=Math.abs(P.H-prev);
      for(let k=Math.floor(N*0.55);k<N;k++)P.fresh[k]=Math.max(P.fresh[k],0.6);
      P.wet=Math.max(0,P.wet-0.015*dt);
    }
  }
  const a=0.035,tmp=P.r.slice();
  for(let k=1;k<N-1;k++)P.r[k]=tmp[k]*(1-a)+a*0.5*(tmp[k-1]+tmp[k+1]);
  for(let k=0;k<N;k++){P.r[k]=clamp(P.r[k],RMIN,RMAX);P.fresh[k]=Math.max(0,P.fresh[k]-dt*0.12);}
  if(!touch)P.wet=Math.max(0,P.wet-0.004*dt);

  if(firing){
    firing.t+=dt;const u=clamp((firing.t-0.3)/1.6,0,1);
    P.fired=u*u*(3-2*u);P.wet=Math.min(P.wet,1-P.fired);
    if(firing.t>2.3&&!firing.shown){firing.shown=true;showResult();}
  }
  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i];q.life-=dt;q.vy+=(q.water?700:1100)*S*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;
    if(q.water&&q.y>baseY-P.H*S+rAt(P.r,1)*K*S*0.5)q.life=0;
    if(q.life<=0||q.y>H)parts.splice(i,1);
  }
}

  if(firing){
    const u=firing.t,glow=Math.sin(Math.min(1,u/2.2)*Math.PI)*(0.85+0.15*Math.sin(u*23)*Math.sin(u*7));
    const y=baseY-P.H*S*0.5;const gr=fg.createRadialGradient(cx,y,20*S,cx,y,Math.max(W,H)*0.6);

let lastHint='';

  if(!P||firing||intro>0)return['',false];

  if(shapedAmt<40)return['Drag the side of the clay in or out',false];
  if(stretched<20)return['Now drag the rim up to make it taller',false];

  return['Shape the walls to match the outline',false];
}

}

// ---------- scoring / results ----------
function scorePot(){
  const o=order();let Rt=0;for(let k=0;k<N;k++)Rt=Math.max(Rt,profAt(o.pts,k/(N-1)));
  const top=Math.max(P.H,o.H);let err=0;const M=60;
  for(let i=0;i<M;i++){
    const y=(i+0.5)/M*top;
    const a=y<=P.H?rAt(P.r,y/P.H):0,b=y<=o.H?profAt(o.pts,y/o.H):0;
    err+=Math.abs(a-b);
  }
  err/=M*Rt;
  return Math.round(clamp(100*Math.exp(-2.8*err),0,100));
}
function showResult(){
  const o=order(),sc=scorePot(),tier=sc>=78?0:sc>=50?1:2;
  const label=sc>=92?'Masterpiece':sc>=78?'Lovely':sc>=60?'Good enough':sc>=40?'Wonky but charming':'It holds water?';
  const coins=Math.round(o.price*(0.3+0.7*sc/100));
  save.coins+=coins;save.made++;const prevBest=save.best[o.id]||0;save.best[o.id]=Math.max(prevBest,sc);persist();
  sfx.bowl(sc>=78?330:sc>=50?294:247);
  $('modalSheet').innerHTML=`
    <div class="label">Out of the kiln</div>
    <h2>${o.what}</h2>
    <div class="big">${sc}%</div>
    <div class="small">${label}${prevBest>sc?` &middot; best ${prevBest}%`:''}</div>
    <p>${o.react[tier]}${P.smoke?'<br><span class="small">Smoke from the straw kiln left a dark blush on one side.</span>':''}</p>
    <div class="coinline"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#e9a23b"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#8a5512" stroke-width="1.6"/><rect x="10" y="7.5" width="4" height="9" rx="1" fill="#8a5512"/></svg>+${coins}</div>
    <div class="row"><button id="mAgain">Same vase</button><button id="mNext" class="primary">Next order</button></div>`;
  $('modal').classList.remove('hidden');
  $('mAgain').onclick=()=>{$('modal').classList.add('hidden');sfx.plop();newPot();};
  $('mNext').onclick=()=>{$('modal').classList.add('hidden');save.order=(save.order+1)%ORDERS.length;persist();sfx.plop();newPot();};
}

// ---------- loop ----------
let lastT=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  step(dt);
  drawUnder();
  drawClay(P,touch&&touch.mode!==2?{t:touch.t||1,side:touch.side||1,str:touch.str,mode:touch.mode}:null);
  drawFx();hud();updateAudio();
  requestAnimationFrame(frame);
}
layout();newPot();
if(!glOK){$('hint').textContent='This device could not start WebGL, so the clay cannot be drawn.';}
requestAnimationFrame(frame);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
