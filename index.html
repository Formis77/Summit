<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CAE Lab">
<meta name="theme-color" content="#0e131d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>CAE Lab</title>
<style>
:root{--bg:#0e131d;--s1:#161d2b;--s2:#1e2738;--s3:#283349;--line:rgba(255,255,255,.07);--ink:#eef2f8;--mut:#8f9bb3;--acc:#f2b84b;--acc2:#e39a1d;--teal:#4fd1c5;--ok:#46d28a;--bad:#ff6b6b;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
input,textarea,select{font:inherit;color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none;font-size:16px}
input:focus,textarea:focus{border-color:var(--acc)}
svg{display:block;flex:none}
.top{position:sticky;top:0;z-index:5;background:rgba(14,19,29,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.top h1{font-size:20px;margin:0;flex:1;letter-spacing:-.01em}
.top h1 small{display:block;font-size:12px;color:var(--mut);font-weight:500;letter-spacing:0}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s2);color:var(--mut)}
.ibtn:active{background:var(--s3)}
main{padding:16px 16px 24px;max-width:720px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:rgba(18,24,36,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;color:var(--mut);border-radius:12px}
nav.tabs button.on{color:var(--acc)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:20px 4px 10px;font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;border-radius:14px;background:var(--acc);color:#1a1405;font-weight:700;font-size:16px}
.btn:active{background:var(--acc2)}
.btn.sec{background:var(--s2);color:var(--ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px}
.row>*{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--s2);color:var(--mut);font-size:14px;white-space:nowrap;border:1px solid transparent}
.chip.on{background:rgba(242,184,75,.14);color:var(--acc);border-color:rgba(242,184,75,.35)}
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search input{padding-left:40px}
.ph{background:var(--s1);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.ph-h{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;width:100%;text-align:left}
.ph-h .t{flex:1;min-width:0}
.ph-h b{display:block;font-size:16px;font-weight:600;line-height:1.3}
.ph-h span{display:block;color:var(--mut);font-size:14px;margin-top:3px}
.tag{font-size:11px;padding:3px 7px;border-radius:6px;background:var(--s3);color:var(--mut);white-space:nowrap;margin-top:2px}
.tag.t3{background:rgba(255,107,107,.14);color:#ff9a9a}
.tag.u{background:rgba(79,209,197,.14);color:var(--teal)}
.ph-b{padding:0 14px 14px;border-top:1px solid var(--line);display:none}
.ph.open .ph-b{display:block}
.ex{font-size:15px;line-height:1.5;margin:12px 0 8px;font-style:italic;color:#d7deea}
.ex mark{background:rgba(242,184,75,.2);color:var(--acc);font-style:normal;border-radius:4px;padding:0 3px}
.note{font-size:14px;color:var(--mut);line-height:1.45;display:flex;gap:8px}
.note svg{color:var(--acc);margin-top:2px}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{display:flex;align-items:center;gap:6px;padding:8px 11px;border-radius:10px;background:var(--s2);font-size:13px;color:var(--mut)}
.acts button.on{color:var(--acc)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px;background:var(--s3)}
.dot.w{background:var(--bad)}.dot.m{background:var(--acc)}.dot.g{background:var(--ok)}
.empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:15px}
.count{color:var(--mut);font-size:13px;margin:0 4px 10px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--s2);border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:left}
.opt .ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--s3);display:grid;place-items:center;flex:none}
.opt.on .ck{background:var(--acc);border-color:var(--acc);color:#1a1405}
.opt b{font-weight:600;display:block}
.opt span{color:var(--mut);font-size:13px}
.step{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.step .ctl{display:flex;align-items:center;gap:14px}
.step .ctl button{width:36px;height:36px;border-radius:10px;background:var(--s2);display:grid;place-items:center}
.step .ctl b{min-width:24px;text-align:center;font-size:18px}
.switch{display:flex;align-items:center;gap:12px;padding:12px 0}
.switch .t{flex:1}.switch .t b{display:block;font-weight:600}.switch .t span{color:var(--mut);font-size:13px}
.tg{width:48px;height:28px;border-radius:999px;background:var(--s3);position:relative;flex:none;transition:.2s}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--teal)}.tg.on::after{left:23px}
.prog{height:5px;background:var(--s2);border-radius:99px;overflow:hidden;margin:4px 0 16px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.qhead{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px;margin-bottom:4px}
.qpart{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);font-weight:700}
.qtext{font-size:19px;line-height:1.55;margin:10px 0 18px}
.qtext .gap{display:inline-block;min-width:70px;border-bottom:2px solid var(--acc);color:var(--acc);text-align:center;padding:0 4px;font-weight:600}
.key{display:inline-block;letter-spacing:.12em;font-weight:800;color:var(--acc);border:1.5px solid var(--acc);border-radius:8px;padding:3px 10px;margin:4px 0 12px;font-size:15px}
.wf{float:right;margin-left:10px}
.mc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mc button{padding:15px 10px;border-radius:14px;background:var(--s2);border:1.5px solid var(--line);font-size:17px;font-weight:600}
.mc button.ok{border-color:var(--ok);background:rgba(70,210,138,.15);color:var(--ok)}
.mc button.bad{border-color:var(--bad);background:rgba(255,107,107,.13);color:var(--bad)}
.fb{border-radius:14px;padding:14px;margin-top:14px;font-size:15px;line-height:1.5}
.fb.ok{background:rgba(70,210,138,.1);border:1px solid rgba(70,210,138,.35)}
.fb.bad{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.3)}
.fb .ttl{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}
.fb.ok .ttl{color:var(--ok)}.fb.bad .ttl{color:var(--bad)}
.fb .ans{font-weight:700;color:var(--ink)}
.fb .why{color:#c4cddc;margin-top:6px}
.linkb{color:var(--teal);font-size:14px;margin-top:10px;display:inline-flex;gap:6px;align-items:center}
.score{text-align:center;padding:24px 16px}
.score .big{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1}
.score .sub{color:var(--mut);margin-top:6px}
.bars .b{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:14px}
.bars .b span:first-child{width:118px;color:var(--mut)}
.bars .b .tr{flex:1;height:8px;background:var(--s2);border-radius:99px;overflow:hidden}
.bars .b .tr i{display:block;height:100%;background:var(--teal);border-radius:99px}
.bars .b span:last-child{width:48px;text-align:right;font-variant-numeric:tabular-nums}
.mis{border-top:1px solid var(--line);padding:12px 0;font-size:14px;line-height:1.45}
.mis:first-child{border-top:0}
.mis .q{color:#c4cddc}.mis .y{color:var(--bad)}.mis .c{color:var(--ok);font-weight:600}
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 20px;cursor:pointer;user-select:none;-webkit-user-select:none}
.flash .f{font-size:24px;font-weight:700;line-height:1.3}
.flash .hint{color:var(--mut);font-size:13px;margin-top:18px;display:flex;gap:6px;align-items:center}
.flash .bk{font-size:18px;color:var(--acc);margin-top:14px;font-weight:600}
.flash .ex{font-size:15px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stats div{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
.stats b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--mut)}
.hist{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.hist:first-child{border-top:0}
.hist span{color:var(--mut)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--s1);border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;transform:translateY(100%);transition:transform .25s;max-width:720px;margin:0 auto}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--s3);margin:0 auto 14px}
.sheet h3{margin:0 0 14px;font-size:19px}
.sheet label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
.sheet p{color:var(--mut);font-size:14px;line-height:1.5}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid var(--s3);border-top-color:var(--acc);animation:sp 1s linear infinite;margin:0 auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--bad);font-size:14px;margin-top:10px;line-height:1.45}
.inrow{display:flex;gap:8px;align-items:stretch}.inrow input{flex:1}
.helpb{flex:none;width:50px;border-radius:12px;background:var(--s2);border:1px solid var(--line);color:var(--mut);font-size:20px;font-weight:800}
.helpb.on{color:var(--acc);border-color:rgba(242,184,75,.45);background:rgba(242,184,75,.12)}
.hintbox{display:none;margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(242,184,75,.08);border:1px solid rgba(242,184,75,.25);font-size:14px;color:#e8d6ad}
.hintbox.on{display:block}
.fb.help{background:rgba(242,184,75,.08);border:1px solid rgba(242,184,75,.35)}.fb.help .ttl{color:var(--acc)}
.htag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:rgba(242,184,75,.14);color:var(--acc);margin-left:6px;vertical-align:1px}
.mini{font-size:13px;color:var(--mut);line-height:1.45}
</style>
</head>
<body>
<header class="top">
  <h1 id="title">Slovník<small id="subtitle"></small></h1>
  <button class="ibtn" id="btnSettings" aria-label="Nastavení"></button>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs"></nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

<script src="data.js"></script>
<script>
"use strict";
// ---------- ikony (vlastní SVG, žádné emoji) ----------
const P = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const I = {
  book:`<svg width="22" height="22" viewBox="0 0 24 24" ${P}><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 8h7M9 11.5h5"/></svg>`,
  test:`<svg width="22" height="22" viewBox="0 0 24 24" ${P}><rect x="5" y="3.5" width="14" height="18" rx="2.5"/><path d="M9 3.5h6v3H9z"/><path d="m8.5 13 2 2 4-4.5"/></svg>`,
  cards:`<svg width="22" height="22" viewBox="0 0 24 24" ${P}><rect x="3" y="7" width="14" height="14" rx="2.5"/><path d="M7 7V5.5A2.5 2.5 0 0 1 9.5 3H19a2 2 0 0 1 2 2v9.5a2.5 2.5 0 0 1-2.5 2.5H17"/></svg>`,
  chart:`<svg width="22" height="22" viewBox="0 0 24 24" ${P}><path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/></svg>`,
  gear:`<svg width="20" height="20" viewBox="0 0 24 24" ${P}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`,
  search:`<svg width="18" height="18" viewBox="0 0 24 24" ${P}><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`,
  star:`<svg width="16" height="16" viewBox="0 0 24 24" ${P}><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>`,
  starF:`<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>`,
  check:`<svg width="16" height="16" viewBox="0 0 24 24" ${P} stroke-width="2.6"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>`,
  x:`<svg width="16" height="16" viewBox="0 0 24 24" ${P} stroke-width="2.6"><path d="M6 6l12 12M18 6 6 18"/></svg>`,
  bulb:`<svg width="16" height="16" viewBox="0 0 24 24" ${P}><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg>`,
  spark:`<svg width="18" height="18" viewBox="0 0 24 24" ${P}><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>`,
  plus:`<svg width="20" height="20" viewBox="0 0 24 24" ${P}><path d="M12 5v14M5 12h14"/></svg>`,
  back:`<svg width="20" height="20" viewBox="0 0 24 24" ${P}><path d="m15 18-6-6 6-6"/></svg>`,
  flip:`<svg width="14" height="14" viewBox="0 0 24 24" ${P}><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>`,
  trash:`<svg width="16" height="16" viewBox="0 0 24 24" ${P}><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>`,
  target:`<svg width="18" height="18" viewBox="0 0 24 24" ${P}><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6" fill="currentColor"/></svg>`
};

// ---------- data a stav ----------
const D = window.CAE_DATA;
const TYPES = {col:"Kolokace",pv:"Frázová slovesa",prep:"Předložky",idiom:"Idiomy",link:"Gramatika",wf:"Tvoření slov",word:"Slovíčka"};
const PARTS = {p1:"Part 1 · Multiple choice",p2:"Part 2 · Open cloze",p3:"Part 3 · Word formation",p4:"Part 4 · Transformations"};
const PSHORT = {p1:"Multiple choice",p2:"Open cloze",p3:"Word formation",p4:"Transformations",dr:"Dril výrazů"};
const KEY = "caelab.v1";
const SRC = {T1:"Test 1",T2:"Test 2",T3:"Test 3",T6:"Test 6",KWT:"KWT list"};
const MINE = p => p.src && p.src!=="core" && p.src!=="u";
let S = load();
function load(){
  let s; try{ s = JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ s = {}; }
  return Object.assign({stats:{},starred:{},custom:[],history:[],settings:{model:"claude-sonnet-5-5"},setup:{parts:{p1:1,p2:1,p3:1,p4:1},n:5,ai:0,focus:"mix"}}, s);
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function hash(str){ let h=5381; for(let i=0;i<str.length;i++) h=((h<<5)+h+str.charCodeAt(i))|0; return (h>>>0).toString(36); }
function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,60); }
function phrases(){
  const base = D.phrases.map(p=>({id:"x:"+slug(p[0]),en:p[0],cz:p[1],type:p[2],ex:p[3],key:p[4],note:p[5],src:p[6]}));
  const own = S.custom.map(p=>Object.assign({src:"u"},p));
  return base.concat(own);
}
function bank(part){ return (D[part]||[]).map(q=>Object.assign({id:part+":"+hash(q.s||q.s1),part},q)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function norm(s){ return String(s||"").toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.,!?;:"“”]/g," ").replace(/\s+/g," ").trim(); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function stat(id){ return S.stats[id]; }
function record(id, ok){ const s = S.stats[id] || (S.stats[id]={c:0,w:0,t:0}); ok?s.c++:s.w++; s.t=Date.now(); s.last=ok?1:0; }
function level(id){ const s=stat(id); if(!s) return ""; if(s.last===0||s.w>s.c) return "w"; if(s.c>=s.w+2) return "g"; return "m"; }
function weight(id, focus){
  const s = stat(id);
  if(!s) return focus==="weak"?0.4:2.2;
  let w = 1 + s.w*1.6 - s.c*0.6 + (s.last===0?2:0);
  const days = (Date.now()-s.t)/864e5; w += Math.min(days,10)*0.15;
  if(focus==="weak") w = s.last===0||s.w>=s.c ? w*3 : w*0.2;
  return Math.max(0.15, Math.min(w, 8));
}
function pick(list, n, focus){
  const pool = list.slice(), out=[];
  while(out.length<n && pool.length){
    const ws = pool.map(x=>weight(x.id,focus)), tot = ws.reduce((a,b)=>a+b,0);
    let r = Math.random()*tot, i=0; while(i<ws.length-1 && (r-=ws[i])>0) i++;
    out.push(pool.splice(i,1)[0]);
  }
  return out;
}

// ---------- AI generování ----------
async function aiTest(parts, n){
  setTitle("Generuji…","AI píše nové úlohy");
  $("view").innerHTML = `<div class="card" style="text-align:center;padding:40px 20px"><div class="spin"></div><b>Píšu ti nové úlohy</b><p class="mini">Obvykle to trvá 15–40 vteřin.</p></div>`;
  const weak = phrases().filter(p=>level(p.id)==="w"||MINE(p)).map(p=>p.en);
  const focus = shuffle(weak).slice(0,18);
  const spec = {p1:'"p1":[{"s":"sentence with ___","o":["CORRECT","wrong","wrong","wrong"],"e":"vysvětlení česky"}]',
    p2:'"p2":[{"s":"sentence with ___","a":["answer","alternative"],"e":"vysvětlení česky"}]',
    p3:'"p3":[{"s":"sentence with ___","w":"STEMWORD","a":["answer"],"e":"vysvětlení česky"}]',
    p4:'"p4":[{"s1":"first sentence","k":"KEYWORD","s2":"second sentence with ___","a":["all acceptable 3-6 word answers including the key word, lowercase"],"e":"vysvětlení česky"}]'};
  const prompt = `You are an experienced Cambridge C1 Advanced (CAE) exam item writer. Write ${n} new, original items for each of these Reading and Use of English parts: ${parts.join(", ")}.
Rules:
- Real CAE level and style: collocations, fixed phrases, phrasal verbs, dependent prepositions, inversion, linking words, word formation with prefixes and suffixes, key word transformations testing two things at once.
- Each item is ONE standalone sentence (two for part 4) with exactly one gap written as ___ .
- Part 1: four single-word options, the FIRST option is the only correct one; the other three must be clearly wrong in that exact context but plausible (similar meaning). No item where two options could be accepted.
- Part 2: the gap is one grammatical word; list every acceptable answer.
- Part 3: give the stem word in capitals; the answer must need a real change (prefix, suffix, plural, internal change).
- Part 4: answer 3–6 words including the key word unchanged; list all acceptable variants in lowercase.
- Explanations ("e") in Czech, short, naming the rule or the collocation.
- Vary the topics. Do not repeat sentences that commonly appear in textbooks word for word.
${focus.length?`- Where natural, test some of these phrases the learner keeps getting wrong: ${focus.join("; ")}.`:""}
Return ONLY valid JSON, no markdown, in this shape:
{${parts.map(p=>spec[p]).join(",")}}`;
  try{
    const res = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":S.settings.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:S.settings.model||"claude-sonnet-5-5",max_tokens:6000,messages:[{role:"user",content:prompt}]})});
    const j = await res.json();
    if(!res.ok) throw new Error((j.error&&j.error.message)||("HTTP "+res.status));
    const txt = (j.content||[]).map(c=>c.text||"").join("");
    const m = txt.match(/\{[\s\S]*\}/); if(!m) throw new Error("AI nevrátila čitelná data.");
    const data = JSON.parse(m[0]);
    let qs=[];
    parts.forEach(p=>(data[p]||[]).forEach(q=>{
      const ok = p==="p1"?(q.s&&Array.isArray(q.o)&&q.o.length>=2):p==="p4"?(q.s1&&q.s2&&q.k&&Array.isArray(q.a)):(q.s&&Array.isArray(q.a));
      if(ok){ if(q.a) q.a=q.a.map(String); qs.push(Object.assign({id:"ai:"+hash((q.s||q.s1)+Math.random()),part:p,ai:1},q)); }
    }));
    if(!qs.length) throw new Error("AI nevrátila žádné použitelné úlohy.");
    startRun(qs,"AI test");
  }catch(e){
    setTitle("Nový test","");
    $("view").innerHTML = `<div class="card"><b>Generování se nepovedlo</b><div class="err">${esc(e.message)}</div><p class="mini">Zkontroluj API klíč a kredit v nastavení. Mezitím můžeš spustit test z banky úloh.</p></div>
      <button class="btn" id="fb">Test z banky úloh</button><div style="height:10px"></div><button class="btn sec" id="bk">Zpět</button>`;
    $("fb").onclick=()=>{ S.setup.ai=0; save(); startTest(); };
    $("bk").onclick=viewTestSetup;
  }
}

let R = null;
function startRun(qs, name){
  if(!qs.length) return;
  const order = {p1:1,p2:2,p3:3,p4:4,dr:5};
  qs.sort((a,b)=>order[a.part]-order[b.part]);
  qs.forEach(q=>{ if(q.part==="p1"){ q._o = shuffle(q.o); q._c = q.o[0]; } });
  R = {qs, i:0, name, res:[], answered:false};
  drawQ();
}
function drawQ(){
  const q = R.qs[R.i];
  setTitle(R.name, `${R.i+1} / ${R.qs.length}`);
  let body = "";
  if(q.part==="p1"){
    body = `<div class="qtext">${gapped(q.s)}</div><div class="mc">${q._o.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
  } else if(q.part==="p4"){
    body = `<div class="qtext" style="margin-bottom:6px">${esc(q.s1)}</div><div class="key">${esc(q.k)}</div><div class="qtext" style="margin-top:4px">${gapped(q.s2)}</div>
      <input id="ans" placeholder="3–6 slov včetně klíčového slova" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">`;
  } else {
    body = `${q.part==="p3"?`<div class="key wf">${esc(q.w)}</div>`:""}<div class="qtext">${gapped(q.s)}</div>
      ${q.part==="dr"?`<div class="inrow"><input id="ans" placeholder="Jedno slovo" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"><button class="helpb" id="help" aria-label="Nápověda">?</button></div>
      <div class="hintbox" id="hintbox">${esc(q.hint)} · začíná na „${esc(q.a[0][0])}“, ${q.a[0].length} písmen<div class="mini" style="margin-top:4px;color:var(--acc)">Bude započítáno jako „s pomocí“.</div></div>`
      :`<input id="ans" placeholder="${q.part==="p3"?"Tvar slova":"Jedno slovo"}" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">`}`;
  }
  $("view").innerHTML = `<div class="qhead"><span class="qpart">${q.part==="dr"?"Dril výrazů":PARTS[q.part]}</span><span>${q.ai?"AI":""}</span></div>
    <div class="prog"><i style="width:${(R.i/R.qs.length)*100}%"></i></div>
    <div class="card">${body}<div id="fbk"></div></div>
    <div id="nav"></div>`;
  R.answered=false;
  if(q.part==="p1"){
    $("view").querySelectorAll(".mc button").forEach(b=>b.onclick=()=>{ if(R.answered) return; answer(b.dataset.o===q._c, b.dataset.o);
      $("view").querySelectorAll(".mc button").forEach(x=>{ if(x.dataset.o===q._c) x.classList.add("ok"); else if(x===b) x.classList.add("bad"); }); });
    $("nav").innerHTML = `<button class="btn ghost" id="skip">Nevím</button>`;
    $("skip").onclick=()=>{ if(R.answered) return; answer(false,"—"); $("view").querySelectorAll(".mc button").forEach(x=>{ if(x.dataset.o===q._c) x.classList.add("ok"); }); };
  } else {
    const inp=$("ans");
    $("nav").innerHTML = `<div class="row"><button class="btn ghost" id="skip">Nevím</button><button class="btn" id="chk">Zkontrolovat</button></div>`;
    const check=()=>{ if(R.answered) return; const v=inp.value; if(!v.trim()) return; inp.blur(); answer(q.a.some(a=>norm(a)===norm(v)), v); };
    $("chk").onclick=check; inp.onkeydown=e=>{ if(e.key==="Enter") check(); };
    $("skip").onclick=()=>{ if(R.answered) return; answer(false,"—"); };
    if($("help")) $("help").onclick=()=>{ if(R.answered) return; q._help=true; $("help").classList.add("on"); $("hintbox").classList.add("on"); inp.focus({preventScroll:true}); };
    setTimeout(()=>inp.focus({preventScroll:true}),60);
  }
}
function gapped(s){ return esc(s).replace("___",'<span class="gap">&nbsp;?&nbsp;</span>'); }
function answer(ok, given){
  R.answered = true;
  const q = R.qs[R.i];
  const correct = q.part==="p1"?q._c:q.a[0];
  let warn = "";
  if(q.part==="p4" && given!=="—"){
    const wc = norm(given).split(" ").filter(Boolean).length;
    if(!norm(given).split(" ").includes(norm(q.k))) warn = "Chybí klíčové slovo – v testu by to bylo za 0.";
    else if(wc>6||wc<3) warn = `Máš ${wc} slov, povolené jsou 3–6.`;
  }
  const helped = !!(q._help && ok);
  if(helped) ok = false;
  R.res.push({q, ok, given, correct, helped});
  if(!q.ai) record(q.id, ok);
  save();
  const alts = (q.a||[]).length>1 ? `<div class="mini" style="margin-top:6px">Uznává se i: ${q.a.slice(1).map(esc).join(" · ")}</div>` : "";
  $("fbk").innerHTML = `<div class="fb ${helped?"help":ok?"ok":"bad"}"><div class="ttl">${helped?I.check+"Správně, ale s pomocí":ok?I.check+"Správně":I.x+"Špatně"}</div>
    ${helped?`<div class="mini" style="color:#e8d6ad">Výraz se přidá mezi slabá místa, ať si ho zopakuješ.</div>`:ok?"":`Správně: <span class="ans">${esc(correct)}</span>`}${q.part!=="p1"?alts:""}
    ${warn?`<div class="err" style="margin-top:6px">${esc(warn)}</div>`:""}
    ${q.e?`<div class="why">${esc(q.e)}</div>`:""}
    ${!ok&&!helped&&q.part!=="p1"&&given!=="—"?`<button class="linkb" id="ovr">${I.check}Měl jsem to dobře (uznat)</button>`:""}</div>`;
  if($("ovr")) $("ovr").onclick=()=>{ const r=R.res[R.res.length-1]; r.ok=true; if(!q.ai){ const s=S.stats[q.id]; s.w--; s.c++; s.last=1; } save(); $("ovr").remove(); $("fbk").querySelector(".fb").className="fb ok"; };
  $("nav").innerHTML = `<button class="btn" id="nx">${R.i+1<R.qs.length?"Další":"Výsledky"}</button>`;
  $("nx").onclick = ()=>{ R.i++; if(R.i<R.qs.length){ drawQ(); window.scrollTo(0,0); } else results(); };
  if(window.innerWidth<700) setTimeout(()=>{ const n=$("nx"); if(n) n.scrollIntoView({behavior:"smooth",block:"end"}); },80);
}
function results(){
  const res = R.res, ok = res.filter(r=>r.ok).length, pct = Math.round(ok/res.length*100), nh = res.filter(r=>r.helped).length;
  const by = {}; res.forEach(r=>{ const k=r.q.part; by[k]=by[k]||{ok:0,n:0}; by[k].n++; if(r.ok) by[k].ok++; });
  S.history.unshift({d:Date.now(),name:R.name,ok,n:res.length,by}); S.history = S.history.slice(0,60); save();
  setTitle("Výsledek", R.name);
  const wrong = res.filter(r=>!r.ok);
  $("view").innerHTML = `<div class="card score"><div class="big">${ok}/${res.length}</div><div class="sub">${pct} %${nh?` · ${nh} s pomocí`:""} · ${pct>=80?"výborně, tohle už sedí":pct>=60?"na hraně C1, ještě dotáhnout":"tohle chce ještě zopakovat"}</div></div>
    ${Object.keys(by).length>1?`<div class="card bars">${Object.entries(by).map(([k,v])=>`<div class="b"><span>${PSHORT[k]}</span><div class="tr"><i style="width:${v.ok/v.n*100}%"></i></div><span>${v.ok}/${v.n}</span></div>`).join("")}</div>`:""}
    ${wrong.length?`<div class="h2">Chyby k zopakování</div><div class="card">${wrong.map(r=>`<div class="mis"><div class="q">${r.q.part==="p4"?esc(r.q.s1)+" <b>"+esc(r.q.k)+"</b><br>":""}${esc((r.q.s||r.q.s2).replace("___","____"))}</div><div>${r.helped?`<span class="c">${esc(r.correct)}</span><span class="htag">s pomocí</span>`:`<span class="y">${esc(r.given)}</span> → <span class="c">${esc(r.correct)}</span>`}</div>${r.q.e?`<div class="mini">${esc(r.q.e)}</div>`:""}</div>`).join("")}</div>`:""}
    ${wrong.length?`<button class="btn" id="again">Zopakovat chyby</button><div style="height:10px"></div>`:""}
    <button class="btn sec" id="new">Nový test</button>`;
  if($("again")) $("again").onclick=()=>startRun(wrong.map(r=>{ const q=Object.assign({},r.q); delete q._o; delete q._help; return q; }), "Oprava chyb");
  $("new").onclick=()=>go("test");
}

// ---------- DRIL (kartičky) ----------
let dr = {dir:"en", f:"mine", deck:[], i:0, flip:false};
function viewDrill(){
  setTitle("Dril", "kartičky a doplňování");
  const all = phrases();
  const fs = [["mine","Z mých testů"],["weak","Slabá místa"],["star","Oblíbené"],["all","Vše"]].concat(Object.entries(TYPES).filter(([k])=>all.some(p=>p.type===k)));
  $("view").innerHTML = `<div class="chips">${fs.map(([k,l])=>`<button class="chip ${dr.f===k?"on":""}" data-f="${k}">${l}</button>`).join("")}</div>
    <div class="chips" style="padding-top:0"><button class="chip ${dr.dir==="en"?"on":""}" data-d="en">Anglicky → česky</button><button class="chip ${dr.dir==="cz"?"on":""}" data-d="cz">Česky → anglicky</button></div>
    <div id="fc"></div>
    <div style="height:6px"></div>
    <button class="btn sec" id="gap">${I.target}Doplňovačka z vybraných výrazů</button>`;
  $("view").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ dr.f=b.dataset.f; dr.deck=[]; viewDrill(); });
  $("view").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ dr.dir=b.dataset.d; dr.flip=false; viewDrill(); });
  $("gap").onclick=()=>{ const L=deckSource().filter(p=>p.ex&&p.key); if(L.length) startRun(drillQs(pick(L,Math.min(10,L.length),"mix")),"Doplňovačka"); };
  if(!dr.deck.length){ const src=deckSource(); dr.deck = pick(src, src.length, "mix"); dr.i=0; dr.flip=false; }
  drawCard();
}
function deckSource(){
  const all = phrases();
  return all.filter(p=> dr.f==="all" ? true : dr.f==="mine" ? MINE(p) : dr.f==="weak" ? level(p.id)==="w" : dr.f==="star" ? !!S.starred[p.id] : p.type===dr.f);
}
function drawCard(){
  const box=$("fc");
  if(!dr.deck.length){ box.innerHTML = `<div class="card empty">${dr.f==="weak"?"Žádná slabá místa – super. Nebo jsi ještě nic neprocvičoval.":dr.f==="star"?"Nemáš žádné oblíbené výrazy.":"Prázdný balíček."}</div>`; return; }
  if(dr.i>=dr.deck.length){ box.innerHTML = `<div class="card empty"><b style="color:var(--ink)">Balíček hotový</b><br>Prošel jsi ${dr.deck.length} karet.</div><button class="btn" id="re">Znovu, zamíchat</button>`; $("re").onclick=()=>{ dr.deck=[]; viewDrill(); }; return; }
  const p = dr.deck[dr.i];
  const front = dr.dir==="en"?p.en:p.cz, back = dr.dir==="en"?p.cz:p.en;
  box.innerHTML = `<div class="count">${dr.i+1} / ${dr.deck.length}</div>
    <div class="card flash" id="fl"><div class="f">${esc(front)}</div>
    ${dr.flip?`<div class="bk">${esc(back)}</div>${p.ex?`<div class="ex">${hl(p.ex,p.key)}</div>`:""}${p.note?`<div class="note" style="text-align:left">${I.bulb}<div>${esc(p.note)}</div></div>`:""}`:`<div class="hint">${I.flip}Klepni pro otočení</div>`}</div>
    ${dr.flip?`<div class="row"><button class="btn sec" id="no" style="color:var(--bad)">${I.x}Neuměl jsem</button><button class="btn sec" id="yes" style="color:var(--ok)">${I.check}Uměl jsem</button></div>`:""}`;
  $("fl").onclick=()=>{ if(!dr.flip){ dr.flip=true; drawCard(); } };
  if(dr.flip){
    $("no").onclick=()=>{ record(p.id,false); save(); dr.i++; dr.flip=false; drawCard(); };
    $("yes").onclick=()=>{ record(p.id,true); save(); dr.i++; dr.flip=false; drawCard(); };
  }
}

// ---------- POKROK ----------
function viewStats(){
  setTitle("Pokrok","");
  const ids = Object.keys(S.stats);
  let c=0,w=0; ids.forEach(k=>{ c+=S.stats[k].c; w+=S.stats[k].w; });
  const parts = {};
  ids.forEach(k=>{ const p=k.split(":")[0]; const key=p==="x"||p==="u"?"dr":p; parts[key]=parts[key]||{c:0,w:0}; parts[key].c+=S.stats[k].c; parts[key].w+=S.stats[k].w; });
  const weakP = phrases().filter(p=>level(p.id)==="w");
  const weakQ = ["p1","p2","p3","p4"].reduce((n,p)=>n+bank(p).filter(q=>level(q.id)==="w").length,0);
  $("view").innerHTML = `<div class="stats"><div><b>${c+w}</b><span>odpovědí</span></div><div><b>${c+w?Math.round(c/(c+w)*100):0}%</b><span>úspěšnost</span></div><div><b>${weakP.length+weakQ}</b><span>slabých míst</span></div></div>
    ${Object.keys(parts).length?`<div class="card bars">${["p1","p2","p3","p4","dr"].filter(k=>parts[k]).map(k=>{ const v=parts[k], n=v.c+v.w; return `<div class="b"><span>${PSHORT[k]}</span><div class="tr"><i style="width:${v.c/n*100}%"></i></div><span>${Math.round(v.c/n*100)}%</span></div>`; }).join("")}</div>`:`<div class="card empty">Zatím žádná data. Udělej první test nebo projdi kartičky.</div>`}
    ${weakP.length+weakQ?`<button class="btn" id="fix">${I.target}Procvičit slabá místa</button>`:""}
    ${S.history.length?`<div class="h2">Historie testů</div><div class="card">${S.history.slice(0,15).map(h=>`<div class="hist"><div>${esc(h.name)}<br><span>${new Date(h.d).toLocaleDateString("cs-CZ",{day:"numeric",month:"numeric"})} ${new Date(h.d).toLocaleTimeString("cs-CZ",{hour:"2-digit",minute:"2-digit"})}</span></div><b>${h.ok}/${h.n}</b></div>`).join("")}</div>`:""}
    ${weakP.length?`<div class="h2">Výrazy, které ti nejdou</div><div class="card">${weakP.slice(0,20).map(p=>`<div class="hist"><div>${esc(p.en)}<br><span>${esc(p.cz)}</span></div></div>`).join("")}</div>`:""}`;
  if($("fix")) $("fix").onclick=()=>{
    let qs=[]; ["p1","p2","p3","p4"].forEach(p=>{ qs=qs.concat(bank(p).filter(q=>level(q.id)==="w")); });
    qs = shuffle(qs).slice(0,16).concat(drillQs(shuffle(weakP.filter(p=>p.ex&&p.key)).slice(0,8)));
    startRun(qs,"Slabá místa");
  };
}

// ---------- NASTAVENÍ ----------
function openSettings(){
  const s=S.settings;
  sheet(`<h3>Nastavení</h3>
    <label>Anthropic API klíč (pro generování úloh přes AI)</label>
    <input id="sKey" type="password" placeholder="sk-ant-…" value="${esc(s.apiKey||"")}" autocomplete="off">
    <p class="mini">Klíč získáš na console.anthropic.com (API Keys). Platí se podle spotřeby – jeden test stojí řádově jednotky korun. Klíč se ukládá jen v tomhle telefonu a posílá se přímo do Anthropic API.</p>
    <label>Model</label>
    <select id="sModel">${[["claude-sonnet-5-5","Sonnet 5.5 (doporučeno)"],["claude-haiku-5-5","Haiku 5.5 (levnější, rychlejší)"],["claude-opus-5-5","Opus 5.5 (nejlepší, dražší)"]].map(([v,l])=>`<option value="${v}" ${s.model===v?"selected":""}>${l}</option>`).join("")}</select>
    <div style="height:16px"></div><button class="btn" id="sSave">Uložit</button>
    <div class="h2">Data</div>
    <p class="mini">Databáze: ${D.phrases.length} výrazů, ${["p1","p2","p3","p4"].reduce((n,p)=>n+D[p].length,0)} úloh. Verze ${D.version}.</p>
    <button class="btn ghost" id="sReset">Vymazat pokrok a historii</button>`);
  $("sSave").onclick=()=>{ s.apiKey=$("sKey").value.trim(); s.model=$("sModel").value; if(s.apiKey) S.setup.ai=1; save(); closeSheet(); if(tab==="test") viewTestSetup(); };
  $("sReset").onclick=()=>{ if(!confirm("Opravdu smazat veškerý pokrok? Vlastní výrazy a klíč zůstanou.")) return; S.stats={}; S.history=[]; save(); closeSheet(); go(tab); };
}
function sheet(html){ $("sheetBody").innerHTML=html; $("sheetBg").style.display="block"; requestAnimationFrame(()=>$("sheet").classList.add("open")); }
function closeSheet(){ $("sheet").classList.remove("open"); setTimeout(()=>$("sheetBg").style.display="none",250); }
$("sheetBg").onclick=closeSheet;

renderTabs(); go("dict");
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
